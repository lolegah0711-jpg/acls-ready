<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 – ACLS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0d1117;font-family:'Inter',sans-serif;color:#fff;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;padding:16px 8px 32px;
      -webkit-user-select:none;user-select:none;}

    #back{position:fixed;top:10px;left:10px;z-index:999;background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.75);padding:5px 14px;
      border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;
      font-family:Inter,sans-serif;backdrop-filter:blur(4px);}

    header{margin:48px 0 16px;text-align:center;}
    h1{font-size:clamp(32px,8vw,52px);font-weight:900;letter-spacing:-.02em;
      background:linear-gradient(135deg,#f59e0b,#fbbf24,#f97316);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

    #top-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;justify-content:center;}

    .score-box{background:#161b22;border:1px solid #30363d;border-radius:10px;
      padding:8px 18px;text-align:center;min-width:90px;}
    .score-label{font-size:10px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.08em;}
    .score-val{font-size:22px;font-weight:800;color:#fbbf24;transition:transform .1s;}
    .score-val.bump{animation:bump .2s ease;}
    @keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}

    .top-btn{padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:700;
      font-family:inherit;cursor:pointer;transition:opacity .15s,transform .1s;}
    .top-btn:hover{opacity:.85;transform:translateY(-1px);}
    #btn-new{background:linear-gradient(135deg,#b45309,#f59e0b);color:#fff;}
    #btn-undo{background:#1f2937;color:#9ca3af;border:1px solid #374151;}
    #btn-undo:disabled{opacity:.3;cursor:default;transform:none;}

    /* Board */
    #board-wrap{position:relative;background:#161b22;border:2px solid #30363d;
      border-radius:14px;padding:10px;}
    #board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
      width:min(400px,92vw);aspect-ratio:1;}

    .cell{border-radius:8px;background:#0d1117;border:1px solid #21262d;}

    .tile{position:absolute;border-radius:8px;display:flex;align-items:center;justify-content:center;
      font-weight:900;transition:top .1s ease,left .1s ease;will-change:top,left;}
    .tile.is-new{animation:appear .15s ease both;}
    .tile.is-merged{animation:pop .18s ease both;}
    @keyframes appear{from{transform:scale(0)}to{transform:scale(1)}}
    @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

    /* Tile colors */
    .t2   {background:#1e3a2f;color:#86efac;}
    .t4   {background:#14532d;color:#4ade80;}
    .t8   {background:#7c2d12;color:#fed7aa;}
    .t16  {background:#9a3412;color:#ffedd5;}
    .t32  {background:#c2410c;color:#fff;}
    .t64  {background:#ea580c;color:#fff;}
    .t128 {background:#92400e;color:#fef3c7;}
    .t256 {background:#b45309;color:#fef9c3;}
    .t512 {background:#d97706;color:#fff7ed;}
    .t1024{background:#f59e0b;color:#1c1917;}
    .t2048{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#1c1917;
      box-shadow:0 0 24px rgba(251,191,36,.5);}
    .tsuper{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;
      box-shadow:0 0 24px rgba(168,85,247,.5);}

    /* Overlays */
    #overlay{position:absolute;inset:0;border-radius:12px;background:rgba(13,17,23,.88);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:12px;z-index:10;opacity:0;pointer-events:none;transition:opacity .3s;}
    #overlay.show{opacity:1;pointer-events:all;}
    .ov-title{font-size:28px;font-weight:900;}
    .ov-sub{font-size:14px;color:#9ca3af;}
    .ov-btn{padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:800;
      font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#b45309,#f59e0b);color:#fff;}
    #win-banner{display:none;background:linear-gradient(135deg,#92400e,#f59e0b);
      border-radius:10px;padding:10px 20px;text-align:center;margin-bottom:4px;width:min(400px,92vw);}

    /* Stats bar */
    #stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
    .stat-pill{background:#161b22;border:1px solid #30363d;border-radius:20px;
      padding:5px 14px;font-size:12px;color:#8b949e;}
    .stat-pill span{color:#fbbf24;font-weight:700;}

    #hint{font-size:11px;color:#4b5563;margin-top:8px;}

    /* Leaderboard overlay */
    .lb-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;
      justify-content:center;z-index:200;}
    .lb-ov.hidden{display:none;}
    .lb-card{background:#161b22;border:2px solid #30363d;border-radius:16px;padding:24px 28px;
      max-width:420px;width:92%;max-height:90vh;overflow-y:auto;}
    .lb-card-title{font-size:20px;font-weight:800;margin-bottom:4px;color:#fbbf24;}
    .lb-card-sub{font-size:12px;color:#8b949e;margin-bottom:16px;}
    .lb-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #21262d;font-size:13px;}
    .lb-rank{width:26px;text-align:center;font-weight:700;font-size:15px;}
    .lb-av{width:28px;height:28px;border-radius:50%;background:#1f2937;display:flex;align-items:center;
      justify-content:center;font-size:10px;font-weight:700;overflow:hidden;flex-shrink:0;}
    .lb-av img{width:100%;height:100%;object-fit:cover;}
    .lb-name{flex:1;font-weight:600;}
    .lb-score{font-weight:700;color:#fbbf24;}
    .lb-close{margin-top:14px;padding:9px 22px;border:none;border-radius:8px;background:#1f2937;
      color:#9ca3af;border:1px solid #374151;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;}
  </style>
</head>
<body>
<a id="back" href="/" onclick="window.close()">← Portal</a>

<header><h1>2048</h1></header>

<div id="top-row">
  <div class="score-box"><div class="score-label">Punkte</div><div class="score-val" id="score">0</div></div>
  <div class="score-box"><div class="score-label">Bestleistung</div><div class="score-val" id="best">0</div></div>
  <button class="top-btn" id="btn-new" onclick="newGame()">Neu ↺</button>
  <button class="top-btn" id="btn-undo" onclick="undo()" disabled>Rückgängig ↩</button>
  <button class="top-btn" style="background:#1f2937;color:#fbbf24;border:1px solid #374151" onclick="openLb()">🏆 Rangliste</button>
</div>

<div id="win-banner">🎉 Du hast <b>2048</b> erreicht! Weiterspielen?</div>

<div id="board-wrap">
  <div id="board"></div>
  <div id="overlay">
    <div class="ov-title" id="ov-title"></div>
    <div class="ov-sub" id="ov-sub"></div>
    <button class="ov-btn" onclick="newGame()">Nochmal spielen</button>
  </div>
</div>

<div id="stats">
  <div class="stat-pill">Züge: <span id="st-moves">0</span></div>
  <div class="stat-pill">Spiele: <span id="st-games">0</span></div>
  <div class="stat-pill">Gewonnen: <span id="st-wins">0</span></div>
</div>
<div id="hint">← → ↑ ↓ oder WASD · Wischen auf Mobilgeräten</div>

<!-- LEADERBOARD OVERLAY -->
<div class="lb-ov hidden" id="ov-lb">
  <div class="lb-card">
    <div class="lb-card-title">🏆 Rangliste – 2048</div>
    <div class="lb-card-sub">Bester Score pro Spieler</div>
    <div id="lb-list"></div>
    <button class="lb-close" onclick="document.getElementById('ov-lb').classList.add('hidden')">Schließen ✕</button>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────────
let board, score, moveCount;
let history = [];   // [{board, score, moveCount}]
let bestScore = +localStorage.getItem('2048_best') || 0;
let stats = JSON.parse(localStorage.getItem('2048_stats') || '{"games":0,"wins":0}');
let won = false, gameOver = false;
let currentUser = null;

// ── BOARD SIZE ─────────────────────────────────────────────────────────────────
const N = 4;

function newGame() {
  board = Array.from({length:N}, () => Array(N).fill(0));
  score = 0;
  moveCount = 0;
  history = [];
  won = false;
  gameOver = false;
  stats.games++;
  saveStats();
  document.getElementById('win-banner').style.display = 'none';
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('btn-undo').disabled = true;
  addRandom(); addRandom();
  render();
  updateHUD();
}

// ── CORE LOGIC ─────────────────────────────────────────────────────────────────
function addRandom() {
  const empty = [];
  for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (!board[r][c]) empty.push([r,c]);
  if (!empty.length) return;
  const [r,c] = empty[Math.floor(Math.random()*empty.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
  return [r,c];
}

function slideLeft(row) {
  let cells = row.filter(x=>x), gained = 0;
  for (let i=0;i<cells.length-1;i++) {
    if (cells[i]===cells[i+1]) {
      cells[i]*=2; gained+=cells[i]; cells.splice(i+1,1);
    }
  }
  while (cells.length<N) cells.push(0);
  return {row:cells, gained};
}

function transform(b, dir) {
  // returns board rotated so "left" equals the desired direction
  if (dir==='left')  return b.map(r=>[...r]);
  if (dir==='right') return b.map(r=>[...r].reverse());
  if (dir==='up')    return Array.from({length:N},(_,c)=>Array.from({length:N},(_,r)=>b[r][c]));
  if (dir==='down')  return Array.from({length:N},(_,c)=>Array.from({length:N},(_,r)=>b[N-1-r][c]));
}

function untransform(t, dir) {
  if (dir==='left')  return t.map(r=>[...r]);
  if (dir==='right') return t.map(r=>[...r].reverse());
  if (dir==='up')    return Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>t[c][r]));
  if (dir==='down')  return Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>t[N-1-c][r]));
}

function move(dir) {
  if (gameOver) return;
  const t = transform(board, dir);
  let gained = 0, moved = false;
  const prev = board.map(r=>[...r]);
  for (let r=0;r<N;r++) {
    const {row, gained:g} = slideLeft(t[r]);
    if (row.some((v,i)=>v!==t[r][i])) moved=true;
    t[r]=row; gained+=g;
  }
  if (!moved) return;
  // save undo
  history.push({board:prev.map(r=>[...r]), score, moveCount});
  if (history.length>10) history.shift();
  board = untransform(t, dir);
  score += gained;
  moveCount++;
  if (score > bestScore) { bestScore=score; localStorage.setItem('2048_best',bestScore); }
  addRandom();
  render();
  updateHUD();
  if (!won && board.flat().includes(2048)) { won=true; stats.wins++; saveStats(); showWin(); }
  else if (!canMove()) showLose();
}

function undo() {
  if (!history.length) return;
  const s = history.pop();
  board = s.board; score = s.score; moveCount = s.moveCount;
  render(); updateHUD();
  document.getElementById('btn-undo').disabled = !history.length;
}

function canMove() {
  for (let r=0;r<N;r++) for (let c=0;c<N;c++) {
    if (!board[r][c]) return true;
    if (c<N-1 && board[r][c]===board[r][c+1]) return true;
    if (r<N-1 && board[r][c]===board[r+1][c]) return true;
  }
  return false;
}

// ── RENDER ─────────────────────────────────────────────────────────────────────
let tileSize = 0, gap = 8, pad = 10;

function getTileClass(v) {
  if (v >= 4096) return 'tsuper';
  return 't'+v;
}

function render() {
  const boardEl = document.getElementById('board');
  const boardW = boardEl.offsetWidth || Math.min(400, window.innerWidth*0.92);
  tileSize = (boardW - pad*2 - gap*(N-1) - 2) / N; // approx; use getBoundingClientRect

  // Build grid cells (background)
  if (!boardEl.querySelector('.cell')) {
    boardEl.innerHTML = '';
    for (let i=0;i<N*N;i++) {
      const cell=document.createElement('div'); cell.className='cell'; boardEl.appendChild(cell);
    }
  }

  // Compute actual cell size from DOM
  const cells = boardEl.querySelectorAll('.cell');
  const wrap = document.getElementById('board-wrap');
  const rect0 = cells[0].getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  const cSize = rect0.width;

  // Remove old tiles
  wrap.querySelectorAll('.tile').forEach(t=>t.remove());

  // Place tiles
  for (let r=0;r<N;r++) for (let c=0;c<N;c++) {
    const v = board[r][c];
    if (!v) continue;
    const cellRect = cells[r*N+c].getBoundingClientRect();
    const top  = cellRect.top  - wrapRect.top;
    const left = cellRect.left - wrapRect.left;
    const tile = document.createElement('div');
    tile.className = `tile ${getTileClass(v)}`;
    tile.style.width  = cSize+'px';
    tile.style.height = cSize+'px';
    tile.style.top    = top+'px';
    tile.style.left   = left+'px';
    tile.style.fontSize = cSize * (v>=1024?0.28:v>=128?0.34:0.42) + 'px';
    tile.textContent  = v;
    wrap.appendChild(tile);
  }
}

function updateHUD() {
  const sEl = document.getElementById('score');
  sEl.textContent = score.toLocaleString('de-DE');
  sEl.classList.remove('bump'); void sEl.offsetWidth; sEl.classList.add('bump');
  document.getElementById('best').textContent = bestScore.toLocaleString('de-DE');
  document.getElementById('st-moves').textContent = moveCount;
  document.getElementById('st-games').textContent = stats.games;
  document.getElementById('st-wins').textContent = stats.wins;
  document.getElementById('btn-undo').disabled = !history.length;
}

function showWin() {
  const b = document.getElementById('win-banner');
  b.style.display = '';
  b.style.animation = 'none';
  void b.offsetWidth;
}

function showLose() {
  gameOver = true;
  submitScore();
  const ov = document.getElementById('overlay');
  document.getElementById('ov-title').textContent = '😔 Game Over';
  document.getElementById('ov-sub').textContent = `Punkte: ${score.toLocaleString('de-DE')} · Züge: ${moveCount}`;
  ov.classList.add('show');
}

function saveStats() { localStorage.setItem('2048_stats', JSON.stringify(stats)); }

async function submitScore() {
  if (!currentUser) return;
  try {
    await fetch('/api/game-scores/2048', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({score: bestScore})
    });
  } catch {}
}

async function openLb() {
  await submitScore();
  document.getElementById('ov-lb').classList.remove('hidden');
  const el = document.getElementById('lb-list');
  el.innerHTML = '<div style="text-align:center;padding:14px;color:#8b949e">Laden…</div>';
  try {
    const data = await (await fetch('/api/game-scores/2048')).json();
    if (!data.length) { el.innerHTML = '<div style="text-align:center;padding:14px;color:#8b949e">Noch keine Einträge</div>'; return; }
    el.innerHTML = data.map((row, i) => {
      const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
      const me = currentUser && row.discord_id === currentUser.discord_id;
      const av = row.avatar
        ? `<img src="https://cdn.discordapp.com/avatars/${row.discord_id}/${row.avatar}.png" onerror="this.parentElement.textContent='${(row.username||'?').slice(0,2).toUpperCase()}'">`
        : (row.username||'?').slice(0,2).toUpperCase();
      return `<div class="lb-row" style="${me?'background:#1a1200;border-radius:6px;':''}">
        <div class="lb-rank">${medal}</div>
        <div class="lb-av">${av}</div>
        <div class="lb-name">${row.username||'Unbekannt'}</div>
        <div class="lb-score">${row.score.toLocaleString('de-DE')}</div>
      </div>`;
    }).join('');
  } catch { el.innerHTML = '<div style="text-align:center;color:#ef4444">Fehler beim Laden</div>'; }
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
                a:'left',d:'right',w:'up',s:'down',
                A:'left',D:'right',W:'up',S:'down'};
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

// Touch / swipe
let tx=0,ty=0;
document.getElementById('board-wrap').addEventListener('touchstart',e=>{
  tx=e.touches[0].clientX; ty=e.touches[0].clientY;
},{passive:true});
document.getElementById('board-wrap').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if (Math.max(Math.abs(dx),Math.abs(dy))<20) return;
  if (Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
},{passive:true});

// Resize: re-render tiles at new positions
window.addEventListener('resize',()=>render());

// ── START ──────────────────────────────────────────────────────────────────────
(async () => { try { const r = await fetch('/auth/me'); if (r.ok) currentUser = await r.json(); } catch {} })();
newGame();
</script>
</body>
</html>
