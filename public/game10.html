<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 – ACLS</title>
  <link href="/fonts/inter.css" rel="stylesheet">
  <style>
html, body {
  margin: 0;
  padding: 0;
  background: #faf8ef;
  color: #776e65;
  font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
  font-size: 18px;
}
body { margin: 20px 0; }

#back {
  position: fixed; top: 10px; left: 10px; z-index: 999;
  background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.12);
  color: rgba(255,255,255,.85); padding: 5px 14px; border-radius: 8px;
  font-size: 12px; font-weight: 600; text-decoration: none;
  font-family: Inter, sans-serif; backdrop-filter: blur(4px);
}

.heading:after { content: ""; display: block; clear: both; }

h1.title {
  font-size: 80px; font-weight: bold; margin: 0;
  display: block; float: left; color: #776e65;
}

@keyframes move-up {
  0%   { top: 25px; opacity: 1; }
  100% { top: -50px; opacity: 0; }
}
.score-wrap { float: right; display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
.score-container, .best-container {
  position: relative; background: #bbada0; padding: 15px 25px;
  font-size: 25px; height: 25px; line-height: 47px; font-weight: bold;
  border-radius: 3px; color: white; min-width: 80px; text-align: center;
}
.score-container:after { position: absolute; width: 100%; top: 10px; left: 0; content: "Punkte"; text-transform: uppercase; font-size: 13px; line-height: 13px; text-align: center; color: #eee4da; }
.best-container:after  { position: absolute; width: 100%; top: 10px; left: 0; content: "Beste"; text-transform: uppercase; font-size: 13px; line-height: 13px; text-align: center; color: #eee4da; }
.score-container .score-addition {
  position: absolute; right: 30px; font-size: 25px; line-height: 25px;
  font-weight: bold; color: rgba(119,110,101,.9); z-index: 100;
  animation: move-up 600ms ease-in both;
}

.lb-btn {
  background: #8f7a66; color: #f9f6f2; border: none; border-radius: 3px;
  padding: 0 16px; height: 57px; font-size: 14px; font-weight: bold;
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.lb-btn:hover { background: #7f6a56; }

p { margin-top: 0; margin-bottom: 10px; line-height: 1.65; }
a { color: #776e65; font-weight: bold; text-decoration: underline; cursor: pointer; }
hr { border: none; border-bottom: 1px solid #d8d4d0; margin-top: 20px; margin-bottom: 30px; }

.container { width: 500px; margin: 0 auto; padding-top: 44px; }

@keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } }

.game-container {
  margin-top: 10px; position: relative; padding: 15px; cursor: default;
  -webkit-touch-callout: none; -webkit-user-select: none; -moz-user-select: none;
  background: #bbada0; border-radius: 6px; width: 500px; height: 500px;
  box-sizing: border-box;
}
.game-container .game-message {
  display: none; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  background: rgba(238,228,218,.5); z-index: 100; text-align: center;
  animation: fade-in 800ms ease 1200ms both;
}
.game-container .game-message p {
  font-size: 60px; font-weight: bold; height: 60px; line-height: 60px; margin-top: 222px;
}
.game-container .game-message .lower { display: block; margin-top: 59px; }
.game-container .game-message a {
  display: inline-block; background: #8f7a66; border-radius: 3px; padding: 0 20px;
  text-decoration: none; color: #f9f6f2; height: 40px; line-height: 42px; margin-left: 9px;
}
.game-container .game-message.game-won { background: rgba(237,194,46,.5); color: #f9f6f2; }
.game-container .game-message.game-won,
.game-container .game-message.game-over { display: block; }

.grid-container { position: absolute; z-index: 1; }
.grid-row { margin-bottom: 15px; }
.grid-row:last-child { margin-bottom: 0; }
.grid-row:after { content: ""; display: block; clear: both; }
.grid-cell {
  width: 106.25px; height: 106.25px; margin-right: 15px; float: left;
  border-radius: 3px; background: rgba(238,228,218,.35);
}
.grid-cell:last-child { margin-right: 0; }

.tile-container { position: absolute; z-index: 2; }
.tile { width: 106.25px; height: 106.25px; line-height: 116.25px; }
.tile.tile-position-1-1 { position: absolute; left: 0px;   top: 0px; }
.tile.tile-position-1-2 { position: absolute; left: 0px;   top: 121px; }
.tile.tile-position-1-3 { position: absolute; left: 0px;   top: 243px; }
.tile.tile-position-1-4 { position: absolute; left: 0px;   top: 364px; }
.tile.tile-position-2-1 { position: absolute; left: 121px; top: 0px; }
.tile.tile-position-2-2 { position: absolute; left: 121px; top: 121px; }
.tile.tile-position-2-3 { position: absolute; left: 121px; top: 243px; }
.tile.tile-position-2-4 { position: absolute; left: 121px; top: 364px; }
.tile.tile-position-3-1 { position: absolute; left: 243px; top: 0px; }
.tile.tile-position-3-2 { position: absolute; left: 243px; top: 121px; }
.tile.tile-position-3-3 { position: absolute; left: 243px; top: 243px; }
.tile.tile-position-3-4 { position: absolute; left: 243px; top: 364px; }
.tile.tile-position-4-1 { position: absolute; left: 364px; top: 0px; }
.tile.tile-position-4-2 { position: absolute; left: 364px; top: 121px; }
.tile.tile-position-4-3 { position: absolute; left: 364px; top: 243px; }
.tile.tile-position-4-4 { position: absolute; left: 364px; top: 364px; }

.tile {
  border-radius: 3px; background: #eee4da; text-align: center; font-weight: bold;
  z-index: 10; font-size: 55px;
  transition: 100ms ease-in-out;
  transition-property: top, left;
}
.tile.tile-2    { background: #eee4da; }
.tile.tile-4    { background: #ede0c8; }
.tile.tile-8    { color: #f9f6f2; background: #f2b179; }
.tile.tile-16   { color: #f9f6f2; background: #f59563; }
.tile.tile-32   { color: #f9f6f2; background: #f67c5f; }
.tile.tile-64   { color: #f9f6f2; background: #f65e3b; }
.tile.tile-128  { color: #f9f6f2; background: #edcf72; box-shadow: 0 0 30px 10px rgba(243,215,116,.24), inset 0 0 0 1px rgba(255,255,255,.14); font-size: 45px; }
.tile.tile-256  { color: #f9f6f2; background: #edcc61; box-shadow: 0 0 30px 10px rgba(243,215,116,.32), inset 0 0 0 1px rgba(255,255,255,.19); font-size: 45px; }
.tile.tile-512  { color: #f9f6f2; background: #edc850; box-shadow: 0 0 30px 10px rgba(243,215,116,.40), inset 0 0 0 1px rgba(255,255,255,.24); font-size: 45px; }
.tile.tile-1024 { color: #f9f6f2; background: #edc53f; box-shadow: 0 0 30px 10px rgba(243,215,116,.48), inset 0 0 0 1px rgba(255,255,255,.29); font-size: 35px; }
.tile.tile-2048 { color: #f9f6f2; background: #edc22e; box-shadow: 0 0 30px 10px rgba(243,215,116,.56), inset 0 0 0 1px rgba(255,255,255,.33); font-size: 35px; }

@keyframes appear {
  0%   { opacity: 0; transform: scale(0); }
  100% { opacity: 1; transform: scale(1); }
}
.tile-new { animation: appear 200ms ease 100ms both; }

@keyframes pop {
  0%   { transform: scale(0); }
  50%  { transform: scale(1.2); }
  100% { transform: scale(1); }
}
.tile-merged { z-index: 20; animation: pop 200ms ease 100ms both; }

/* Leaderboard overlay */
.lb-ov { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: flex; align-items: center; justify-content: center; z-index: 500; }
.lb-ov.hidden { display: none; }
.lb-card { background: #faf8ef; border: 2px solid #bbada0; border-radius: 12px; padding: 24px 28px; max-width: 420px; width: 92%; max-height: 85vh; overflow-y: auto; }
.lb-card-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; color: #776e65; }
.lb-card-sub { font-size: 12px; color: #a09890; margin-bottom: 16px; }
.lb-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #e0d8d0; font-size: 13px; }
.lb-rank { width: 26px; text-align: center; font-weight: 700; font-size: 15px; }
.lb-av { width: 28px; height: 28px; border-radius: 50%; background: #bbada0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; overflow: hidden; flex-shrink: 0; color: #f9f6f2; }
.lb-av img { width: 100%; height: 100%; object-fit: cover; }
.lb-name { flex: 1; font-weight: 600; }
.lb-score { font-weight: 700; color: #f65e3b; }
.lb-close { margin-top: 14px; padding: 9px 22px; border: none; border-radius: 6px; background: #8f7a66; color: #f9f6f2; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
.lb-close:hover { background: #7f6a56; }

@media screen and (max-width: 560px) {
  html, body { font-size: 15px; }
  body { margin: 20px 0; padding: 0 10px; }
  h1.title { font-size: 50px; }
  .container { width: 300px; margin: 0 auto; padding-top: 44px; }
  .score-container, .best-container { padding: 10px 16px; font-size: 18px; height: 20px; line-height: 38px; min-width: 60px; }
  .lb-btn { height: 48px; font-size: 12px; padding: 0 10px; }
  .game-container { margin-top: 20px; padding: 10px; width: 300px; height: 300px; }
  .grid-cell { width: 57.5px; height: 57.5px; margin-right: 10px; }
  .tile { width: 57.5px; height: 57.5px; line-height: 67.5px; font-size: 35px; }
  .tile.tile-128, .tile.tile-256, .tile.tile-512 { font-size: 25px; }
  .tile.tile-1024, .tile.tile-2048 { font-size: 15px; }
  .tile.tile-position-1-1 { left: 0;     top: 0; }
  .tile.tile-position-1-2 { left: 0;     top: 68px; }
  .tile.tile-position-1-3 { left: 0;     top: 135px; }
  .tile.tile-position-1-4 { left: 0;     top: 203px; }
  .tile.tile-position-2-1 { left: 68px;  top: 0; }
  .tile.tile-position-2-2 { left: 68px;  top: 68px; }
  .tile.tile-position-2-3 { left: 68px;  top: 135px; }
  .tile.tile-position-2-4 { left: 68px;  top: 203px; }
  .tile.tile-position-3-1 { left: 135px; top: 0; }
  .tile.tile-position-3-2 { left: 135px; top: 68px; }
  .tile.tile-position-3-3 { left: 135px; top: 135px; }
  .tile.tile-position-3-4 { left: 135px; top: 203px; }
  .tile.tile-position-4-1 { left: 203px; top: 0; }
  .tile.tile-position-4-2 { left: 203px; top: 68px; }
  .tile.tile-position-4-3 { left: 203px; top: 135px; }
  .tile.tile-position-4-4 { left: 203px; top: 203px; }
  .grid-row { margin-bottom: 10px; }
  .game-container .game-message p { font-size: 30px !important; height: 30px !important; line-height: 30px !important; margin-top: 90px !important; }
  .game-container .game-message .lower { margin-top: 30px !important; }
}
  </style>

<body>

<a id="back" href="/" onclick="window.close()">← Portal</a>

<div class="container">
  <div class="heading">
    <h1 class="title">2048</h1>
    <div class="score-wrap">
      <button class="lb-btn" onclick="openLb()">🏆 Rangliste</button>
      <div class="best-container" id="best-container">0</div>
      <div class="score-container" id="score-container">0</div>
    </div>
  </div>

  <div class="game-container">
    <div class="game-message">
      <p></p>
      <div class="lower">
        <a class="retry-button">Neu starten</a>
      </div>
    </div>

    <div class="grid-container">
      <div class="grid-row">
        <div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div>
      </div>
      <div class="grid-row">
        <div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div>
      </div>
      <div class="grid-row">
        <div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div>
      </div>
      <div class="grid-row">
        <div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div>
      </div>
    </div>

    <div class="tile-container"></div>
  </div>
</div>

<!-- Leaderboard Overlay -->
<div class="lb-ov hidden" id="ov-lb">
  <div class="lb-card">
    <div class="lb-card-title">🏆 Rangliste – 2048</div>
    <div class="lb-card-sub">Bester Score pro Spieler</div>
    <div id="lb-list"></div>
    <button class="lb-close" onclick="document.getElementById('ov-lb').classList.add('hidden')">Schließen ✕</button>
  </div>
</div>

<script src='/vendor/hammer.min.js'></script>
<script src="/game-auth.js"></script>
<script>
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
// ── LEADERBOARD & USER ────────────────────────────────────────────
var currentUser = null;
var localBest = +localStorage.getItem('2048_best') || 0;

(function() {
  fetch('/auth/me').then(function(r) { if (r.ok) r.json().then(function(u) { currentUser = u; }); }).catch(function(){});
  GameAuth.init('2048');
})();

function submitScore(score) {
  if (!currentUser || score <= 0) return;
  fetch('/api/game-scores/2048', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(GameAuth.body(score))
  }).catch(function(){});
}

function openLb() {
  if (localBest > 0) submitScore(localBest);
  document.getElementById('ov-lb').classList.remove('hidden');
  var el = document.getElementById('lb-list');
  el.innerHTML = '<div style="text-align:center;padding:14px;color:#a09890">Laden…</div>';
  fetch('/api/game-scores/2048').then(function(r) { return r.json(); }).then(function(data) {
    if (!data.length) { el.innerHTML = '<div style="text-align:center;padding:14px;color:#a09890">Noch keine Einträge</div>'; return; }
    el.innerHTML = data.map(function(row, i) {
      var medal = i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : (i+1)+'.';
      var me = currentUser && row.discord_id === currentUser.discord_id;
      var av = row.avatar
        ? '<img src="https://cdn.discordapp.com/avatars/'+row.discord_id+'/'+row.avatar+'.png">'
        : (row.username||'?').slice(0,2).toUpperCase();
      return '<div class="lb-row" style="'+(me?'background:#f0ebe5;border-radius:6px;':'')+'">' +
        '<div class="lb-rank">'+medal+'</div>' +
        '<div class="lb-av">'+av+'</div>' +
        '<div class="lb-name">'+esc(row.username||'Unbekannt')+'</div>' +
        '<div class="lb-score">'+row.score.toLocaleString('de-DE')+'</div>' +
        '</div>';
    }).join('');
  }).catch(function() { el.innerHTML = '<div style="text-align:center;color:#ef4444">Fehler beim Laden</div>'; });
}

// ── GAME ──────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", function () {
  window.requestAnimationFrame(function () {
    var manager = new GameManager(4, KeyboardInputManager, HTMLActuator);
  });
});

function GameManager(size, InputManager, Actuator) {
  this.size         = size;
  this.inputManager = new InputManager;
  this.actuator     = new Actuator;
  this.startTiles   = 2;
  this.inputManager.on("move", this.move.bind(this));
  this.inputManager.on("restart", this.restart.bind(this));
  this.setup();
}

GameManager.prototype.restart = function () {
  this.actuator.restart();
  this.setup();
};

GameManager.prototype.setup = function () {
  this.grid  = new Grid(this.size);
  this.score = 0;
  this.over  = false;
  this.won   = false;
  this.addStartTiles();
  this.actuate();
};

GameManager.prototype.addStartTiles = function () {
  for (var i = 0; i < this.startTiles; i++) this.addRandomTile();
};

GameManager.prototype.addRandomTile = function () {
  if (this.grid.cellsAvailable()) {
    var value = Math.random() < 0.9 ? 2 : 4;
    var tile  = new Tile(this.grid.randomAvailableCell(), value);
    this.grid.insertTile(tile);
  }
};

GameManager.prototype.actuate = function () {
  this.actuator.actuate(this.grid, { score: this.score, over: this.over, won: this.won });
};

GameManager.prototype.prepareTiles = function () {
  this.grid.eachCell(function (x, y, tile) {
    if (tile) { tile.mergedFrom = null; tile.savePosition(); }
  });
};

GameManager.prototype.moveTile = function (tile, cell) {
  this.grid.cells[tile.x][tile.y] = null;
  this.grid.cells[cell.x][cell.y] = tile;
  tile.updatePosition(cell);
};

GameManager.prototype.move = function (direction) {
  var self = this;
  if (this.over || this.won) return;
  var cell, tile;
  var vector     = this.getVector(direction);
  var traversals = this.buildTraversals(vector);
  var moved      = false;
  this.prepareTiles();
  traversals.x.forEach(function (x) {
    traversals.y.forEach(function (y) {
      cell = { x: x, y: y };
      tile = self.grid.cellContent(cell);
      if (tile) {
        var positions = self.findFarthestPosition(cell, vector);
        var next      = self.grid.cellContent(positions.next);
        if (next && next.value === tile.value && !next.mergedFrom) {
          var merged = new Tile(positions.next, tile.value * 2);
          merged.mergedFrom = [tile, next];
          self.grid.insertTile(merged);
          self.grid.removeTile(tile);
          tile.updatePosition(positions.next);
          self.score += merged.value;
          if (merged.value === 2048) self.won = true;
        } else {
          self.moveTile(tile, positions.farthest);
        }
        if (!self.positionsEqual(cell, tile)) moved = true;
      }
    });
  });
  if (moved) {
    this.addRandomTile();
    if (!this.movesAvailable()) this.over = true;
    this.actuate();
  }
};

GameManager.prototype.getVector = function (direction) {
  var map = { 0: {x:0,y:-1}, 1: {x:1,y:0}, 2: {x:0,y:1}, 3: {x:-1,y:0} };
  return map[direction];
};

GameManager.prototype.buildTraversals = function (vector) {
  var traversals = { x: [], y: [] };
  for (var pos = 0; pos < this.size; pos++) { traversals.x.push(pos); traversals.y.push(pos); }
  if (vector.x === 1) traversals.x = traversals.x.reverse();
  if (vector.y === 1) traversals.y = traversals.y.reverse();
  return traversals;
};

GameManager.prototype.findFarthestPosition = function (cell, vector) {
  var previous;
  do { previous = cell; cell = { x: previous.x + vector.x, y: previous.y + vector.y }; }
  while (this.grid.withinBounds(cell) && this.grid.cellAvailable(cell));
  return { farthest: previous, next: cell };
};

GameManager.prototype.movesAvailable = function () {
  return this.grid.cellsAvailable() || this.tileMatchesAvailable();
};

GameManager.prototype.tileMatchesAvailable = function () {
  var self = this, tile;
  for (var x = 0; x < this.size; x++) {
    for (var y = 0; y < this.size; y++) {
      tile = this.grid.cellContent({ x: x, y: y });
      if (tile) {
        for (var direction = 0; direction < 4; direction++) {
          var vector = self.getVector(direction);
          var cell   = { x: x + vector.x, y: y + vector.y };
          var other  = self.grid.cellContent(cell);
          if (other && other.value === tile.value) return true;
        }
      }
    }
  }
  return false;
};

GameManager.prototype.positionsEqual = function (first, second) {
  return first.x === second.x && first.y === second.y;
};

// ── GRID ─────────────────────────────────────────────────────────
function Grid(size) {
  this.size = size;
  this.cells = [];
  this.build();
}

Grid.prototype.build = function () {
  for (var x = 0; x < this.size; x++) {
    var row = this.cells[x] = [];
    for (var y = 0; y < this.size; y++) row.push(null);
  }
};

Grid.prototype.randomAvailableCell = function () {
  var cells = this.availableCells();
  if (cells.length) return cells[Math.floor(Math.random() * cells.length)];
};

Grid.prototype.availableCells = function () {
  var cells = [];
  this.eachCell(function (x, y, tile) { if (!tile) cells.push({ x: x, y: y }); });
  return cells;
};

Grid.prototype.eachCell = function (callback) {
  for (var x = 0; x < this.size; x++)
    for (var y = 0; y < this.size; y++) callback(x, y, this.cells[x][y]);
};

Grid.prototype.cellsAvailable  = function () { return !!this.availableCells().length; };
Grid.prototype.cellAvailable    = function (cell) { return !this.cellOccupied(cell); };
Grid.prototype.cellOccupied     = function (cell) { return !!this.cellContent(cell); };
Grid.prototype.cellContent      = function (cell) { return this.withinBounds(cell) ? this.cells[cell.x][cell.y] : null; };
Grid.prototype.insertTile       = function (tile) { this.cells[tile.x][tile.y] = tile; };
Grid.prototype.removeTile       = function (tile) { this.cells[tile.x][tile.y] = null; };
Grid.prototype.withinBounds     = function (pos)  { return pos.x >= 0 && pos.x < this.size && pos.y >= 0 && pos.y < this.size; };

// ── ACTUATOR ─────────────────────────────────────────────────────
function HTMLActuator() {
  this.tileContainer    = document.getElementsByClassName("tile-container")[0];
  this.scoreContainer   = document.getElementById("score-container");
  this.bestContainer    = document.getElementById("best-container");
  this.messageContainer = document.getElementsByClassName("game-message")[0];
  this.score = 0;
  this.bestContainer.textContent = localBest.toLocaleString('de-DE');
}

HTMLActuator.prototype.actuate = function (grid, metadata) {
  var self = this;
  window.requestAnimationFrame(function () {
    self.clearContainer(self.tileContainer);
    grid.cells.forEach(function (column) {
      column.forEach(function (cell) { if (cell) self.addTile(cell); });
    });
    self.updateScore(metadata.score);
    if (metadata.over) self.message(false);
    if (metadata.won)  self.message(true);
  });
};

HTMLActuator.prototype.restart = function () { this.clearMessage(); };

HTMLActuator.prototype.clearContainer = function (container) {
  while (container.firstChild) container.removeChild(container.firstChild);
};

HTMLActuator.prototype.addTile = function (tile) {
  var self     = this;
  var element  = document.createElement("div");
  var position = tile.previousPosition || { x: tile.x, y: tile.y };
  var posClass = this.positionClass(position);
  var classes  = ["tile", "tile-" + tile.value, posClass];
  this.applyClasses(element, classes);
  element.textContent = tile.value;
  if (tile.previousPosition) {
    window.requestAnimationFrame(function () {
      classes[2] = self.positionClass({ x: tile.x, y: tile.y });
      self.applyClasses(element, classes);
    });
  } else if (tile.mergedFrom) {
    classes.push("tile-merged");
    this.applyClasses(element, classes);
    tile.mergedFrom.forEach(function (merged) { self.addTile(merged); });
  } else {
    classes.push("tile-new");
    this.applyClasses(element, classes);
  }
  this.tileContainer.appendChild(element);
};

HTMLActuator.prototype.applyClasses = function (element, classes) {
  element.setAttribute("class", classes.join(" "));
};

HTMLActuator.prototype.normalizePosition = function (position) {
  return { x: position.x + 1, y: position.y + 1 };
};

HTMLActuator.prototype.positionClass = function (position) {
  position = this.normalizePosition(position);
  return "tile-position-" + position.x + "-" + position.y;
};

HTMLActuator.prototype.updateScore = function (score) {
  this.clearContainer(this.scoreContainer);
  var difference = score - this.score;
  this.score = score;
  this.scoreContainer.textContent = score.toLocaleString('de-DE');
  if (difference > 0) {
    var addition = document.createElement("div");
    addition.classList.add("score-addition");
    addition.textContent = "+" + difference;
    this.scoreContainer.appendChild(addition);
  }
  // Update local best
  if (score > localBest) {
    localBest = score;
    localStorage.setItem('2048_best', localBest);
    this.bestContainer.textContent = localBest.toLocaleString('de-DE');
    submitScore(localBest);
  }
};

HTMLActuator.prototype.message = function (won) {
  var type    = won ? "game-won" : "game-over";
  var message = won ? "Gewonnen!" : "Game Over!";
  this.messageContainer.classList.add(type);
  this.messageContainer.getElementsByTagName("p")[0].textContent = message;
  if (!won) submitScore(localBest);
};

HTMLActuator.prototype.clearMessage = function () {
  this.messageContainer.classList.remove("game-won", "game-over");
};

// ── INPUT ────────────────────────────────────────────────────────
function KeyboardInputManager() {
  this.events = {};
  this.listen();
}

KeyboardInputManager.prototype.on = function (event, callback) {
  if (!this.events[event]) this.events[event] = [];
  this.events[event].push(callback);
};

KeyboardInputManager.prototype.emit = function (event, data) {
  var callbacks = this.events[event];
  if (callbacks) callbacks.forEach(function (cb) { cb(data); });
};

KeyboardInputManager.prototype.listen = function () {
  var self = this;
  var map  = { 38:0, 39:1, 40:2, 37:3, 75:0, 76:1, 74:2, 72:3, 87:0, 68:1, 83:2, 65:3 };
  document.addEventListener("keydown", function (event) {
    var modifiers = event.altKey || event.ctrlKey || event.metaKey || event.shiftKey;
    var mapped    = map[event.which];
    if (!modifiers) {
      if (mapped !== undefined) { event.preventDefault(); self.emit("move", mapped); }
      if (event.which === 32) self.restart.bind(self)(event);
    }
  });
  var retry = document.getElementsByClassName("retry-button")[0];
  retry.addEventListener("click", this.restart.bind(this));

  var gestures     = [Hammer.DIRECTION_UP, Hammer.DIRECTION_RIGHT, Hammer.DIRECTION_DOWN, Hammer.DIRECTION_LEFT];
  var gameContainer = document.getElementsByClassName("game-container")[0];
  var handler      = Hammer(gameContainer, { drag_block_horizontal: true, drag_block_vertical: true });
  handler.on("swipe", function (event) {
    event.gesture.preventDefault();
    var mapped = gestures.indexOf(event.gesture.direction);
    if (mapped !== -1) self.emit("move", mapped);
  });
};

KeyboardInputManager.prototype.restart = function (event) {
  event.preventDefault();
  this.emit("restart");
};

// ── TILE ─────────────────────────────────────────────────────────
function Tile(position, value) {
  this.x = position.x; this.y = position.y;
  this.value = value || 2;
  this.previousPosition = null;
  this.mergedFrom = null;
}
Tile.prototype.savePosition   = function () { this.previousPosition = { x: this.x, y: this.y }; };
Tile.prototype.updatePosition = function (position) { this.x = position.x; this.y = position.y; };
</script>
