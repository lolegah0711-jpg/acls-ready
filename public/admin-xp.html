<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XP-Überwachung — ACLS Admin</title>
<style>
  :root { --bg:#0b0f17; --card:#151b27; --card2:#1c2433; --line:#26303f; --txt:#e5e9f0; --mut:#8b97a9; --acc:#ef4444; --good:#22c55e; --warn:#f59e0b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:1.2rem; }
  h1 { font-size:1.5rem; margin:.2rem 0; }
  .sub { color:var(--mut); margin-bottom:1rem; font-size:.9rem; }
  a.back { color:#38bdf8; text-decoration:none; font-size:.85rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem 1.1rem; margin-bottom:1rem; }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th, td { text-align:left; padding:.45rem .5rem; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:600; font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; }
  tr.flag { background:rgba(239,68,68,.08); }
  .flagpill { background:#3a0d0d; color:var(--acc); border-radius:999px; padding:.1rem .5rem; font-size:.72rem; font-weight:700; }
  .src { background:#0d1622; border:1px solid var(--line); border-radius:999px; padding:.1rem .5rem; font-size:.72rem; color:var(--mut); }
  button { background:#1c2433; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:.35rem .7rem; font-size:.8rem; cursor:pointer; }
  button:hover{ border-color:var(--acc); }
  input { background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:.45rem .6rem; }
  .muted{ color:var(--mut); font-size:.82rem; } .err{ color:var(--acc); }
  .big{ font-size:1.4rem; font-weight:800; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
  @media(max-width:640px){ .grid2{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Zurück zum Portal</a>
  <h1>🛡️ XP-Überwachung <span class="muted">(Anti-Cheat)</span></h1>
  <div class="sub">Jeder Saison-XP-Gewinn wird mit Quelle &amp; Zeit protokolliert. Anomalie-Schwelle: &gt; 5.000 XP/Stunde.</div>
  <div class="err" id="msg"></div>

  <div class="card">
    <strong>🚩 Geflaggte Anomalien (letzte 7 Tage)</strong>
    <div id="flags" style="margin-top:.7rem"><div class="muted">Lädt…</div></div>
  </div>

  <div class="card">
    <strong>📊 Top XP-Verdiener (letzte 24h)</strong>
    <div id="overview" style="margin-top:.7rem"><div class="muted">Lädt…</div></div>
  </div>

  <div class="card">
    <strong>🔍 XP-Verlauf eines Nutzers</strong>
    <div style="margin-top:.6rem;display:flex;gap:.5rem;flex-wrap:wrap">
      <input id="didInput" placeholder="Discord-ID" style="flex:1;min-width:200px">
      <button onclick="loadUser()">Anzeigen</button>
    </div>
    <div id="userDetail" style="margin-top:.8rem"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
async function api(path){ const r=await fetch(path); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||'Fehler'); return d; }
function msg(t){ $('msg').textContent=t||''; }
const fmt = n => (n||0).toLocaleString('de-DE');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tdate = s => { try { return new Date(s+'Z').toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch { return s; } };

async function loadFlags(){
  try { const rows = await api('/api/admin/xp-flags');
    $('flags').innerHTML = rows.length ? table(['Nutzer','Discord-ID','Flags','Geflaggte XP','Zuletzt'],
      rows.map(r=>[esc(r.username||'?'), `<button onclick="pick('${r.discord_id}')">${r.discord_id}</button>`, `<span class="flagpill">${r.flags}</span>`, fmt(r.flagged_xp), tdate(r.last_flag)]))
      : '<div class="muted">✓ Keine Anomalien — alles sauber.</div>';
  } catch(e){ msg(e.message); }
}
async function loadOverview(){
  try { const rows = await api('/api/admin/xp-overview');
    $('overview').innerHTML = rows.length ? table(['Nutzer','Discord-ID','XP (24h)','Gewinne','Flags'],
      rows.map(r=>[esc(r.username||'?'), `<button onclick="pick('${r.discord_id}')">${r.discord_id}</button>`, fmt(r.xp_24h), r.gains, r.flags>0?`<span class="flagpill">${r.flags}</span>`:'0']))
      : '<div class="muted">Keine XP-Gewinne in den letzten 24h.</div>';
  } catch(e){ msg(e.message); }
}
function pick(did){ $('didInput').value=did; loadUser(); window.scrollTo(0,document.body.scrollHeight); }
async function loadUser(){
  const did = $('didInput').value.trim(); if(!did) return;
  try { const d = await api('/api/admin/xp-log/'+encodeURIComponent(did));
    const srcRows = d.by_source.map(s=>`<span class="src">${esc(s.source)}: ${fmt(s.xp)} (${s.n}×)</span>`).join(' ');
    $('userDetail').innerHTML = `
      <div class="grid2" style="margin-bottom:.7rem">
        <div class="card" style="margin:0"><div class="muted">Letzte Stunde</div><div class="big ${d.xp_last_hour>5000?'err':''}">${fmt(d.xp_last_hour)} XP</div></div>
        <div class="card" style="margin:0"><div class="muted">Letzte 24h</div><div class="big">${fmt(d.xp_last_24h)} XP</div></div>
      </div>
      <div style="margin-bottom:.6rem">${srcRows||'<span class="muted">Keine Daten</span>'}</div>
      ${ d.log.length ? table(['Zeit','Quelle','XP',''], d.log.map(l=>[tdate(l.created_at), `<span class="src">${esc(l.source)}</span>`, '+'+fmt(l.amount), l.flagged?'<span class="flagpill">FLAG</span>':''])) : '<div class="muted">Kein XP-Verlauf.</div>' }`;
  } catch(e){ $('userDetail').innerHTML = '<div class="err">'+e.message+'</div>'; }
}

function table(head, rows){
  return `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.slice(0,head.length).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')
  }</tbody></table>`;
}

loadFlags(); loadOverview();
setInterval(loadFlags, 30000);
</script>
</body>
</html>
