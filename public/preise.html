<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preisliste – Werkstatt &amp; Fahrschule | ACLS Los Santos (ColdRP)</title>
  <meta name="description" content="Alle aktuellen Preise des ACLS Automobil-Club Los Santos: Werkstatt-Leistungen, Führerscheine & Service – transparent und täglich aktuell.">
  <link rel="canonical" href="__BASE_URL__/preise">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ACLS Automobil-Club Los Santos">
  <meta property="og:title" content="Preisliste – Werkstatt & Fahrschule | ACLS Los Santos">
  <meta property="og:description" content="Werkstatt, Führerscheine & Service: alle Preise auf einen Blick – transparent und täglich aktuell.">
  <meta property="og:url" content="__BASE_URL__/preise">
  <meta property="og:image" content="__BASE_URL__/icon-512.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#080c14;font-family:'Inter',sans-serif;color:#e5e7eb;min-height:100vh;padding:24px 16px 48px;}

    .header{max-width:720px;margin:0 auto 32px;text-align:center;padding-top:16px;}
    .logo{font-size:13px;font-weight:700;letter-spacing:.2em;color:#6b7280;text-transform:uppercase;margin-bottom:8px;}
    h1{font-size:clamp(24px,5vw,36px);font-weight:800;color:#f9fafb;margin-bottom:6px;}
    .subtitle{font-size:14px;color:#6b7280;}

    .grid{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}

    .card{background:#0f1623;border:1px solid #1e2a3a;border-radius:14px;overflow:hidden;}
    .card-head{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e2a3a;}
    .cat-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .cat-title{font-weight:700;font-size:.95rem;}
    .cat-sub{font-size:.72rem;color:#6b7280;margin-top:2px;}

    .items{padding:12px 0;}
    .item{display:flex;align-items:center;gap:12px;padding:9px 20px;}
    .item:not(:last-child){border-bottom:1px solid #111827;}
    .item-name{flex:1;font-size:.875rem;font-weight:500;}
    .item-note{font-size:.72rem;color:#6b7280;margin-top:2px;}
    .item-price{font-size:.9rem;font-weight:800;white-space:nowrap;}

    .empty{text-align:center;padding:40px;color:#6b7280;font-size:14px;}

    .footer{max-width:720px;margin:28px auto 0;text-align:center;font-size:12px;color:#374151;}

    /* ── Kostenrechner ── */
    .add-btn{width:26px;height:26px;border-radius:7px;border:1px solid #1e2a3a;background:#131c2b;color:#9ca3af;font-weight:800;cursor:pointer;flex-shrink:0;font-size:.9rem;line-height:1;transition:.15s}
    .add-btn:hover{border-color:#f97316;color:#f97316}
    .add-btn.on{background:rgba(249,115,22,.18);border-color:#f97316;color:#f97316}
    .calcbar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,14,22,.96);backdrop-filter:blur(8px);border-top:1px solid #1e2a3a;padding:12px 16px;display:none;z-index:50}
    .calcbar.show{display:block}
    .calcbar-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .calc-sum{font-size:1.15rem;font-weight:800;color:#f97316;font-variant-numeric:tabular-nums}
    .calc-count{font-size:.75rem;color:#6b7280}
    .calc-btn{background:#f97316;color:#0a0a0a;font-weight:800;border:none;border-radius:9px;padding:9px 16px;cursor:pointer;font-size:.82rem;font-family:inherit}
    .calc-btn.ghost{background:transparent;color:#9ca3af;border:1px solid #1e2a3a}
    .hint{max-width:720px;margin:10px auto 0;text-align:center;font-size:12px;color:#4b5563}

    @media(max-width:480px){.grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>

<div class="header">
  <div class="logo">Automobil-Club Los Santos</div>
  <h1>💰 Preisliste</h1>
  <div class="subtitle">Aktuelle Preise für Fahrschule &amp; Serviceleistungen</div>
</div>

<div class="grid" id="grid">
  <div class="empty">Laden…</div>
</div>

<div class="hint">💡 Tipp: Klicke auf <b>＋</b> neben einer Leistung, um dir unten deine Kosten zusammenzurechnen.</div>
<div class="footer">Alle Preise in GTA$ · Stand: täglich aktuell</div>

<div class="calcbar" id="calcbar">
  <div class="calcbar-inner">
    <div>
      <div class="calc-sum" id="calcSum">0 $</div>
      <div class="calc-count" id="calcCount">0 Leistungen gewählt</div>
    </div>
    <div style="flex:1"></div>
    <button class="calc-btn ghost" onclick="clearCalc()">Leeren</button>
    <button class="calc-btn" onclick="copyCalc()">📋 Anfrage kopieren</button>
  </div>
</div>

<script>
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

// ── Kostenrechner ──────────────────────────────────────────────
// Preis-Text → Zahl ("1.500 $" → 1500). Nicht parsebare Preise sind nicht wählbar.
const priceNum = t => {
  const m = String(t).replace(/\./g,'').replace(/,/g,'.').match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : null;
};
let cart = []; // { name, price }

function toggleCalc(btn, name, price){
  const i = cart.findIndex(c => c.name === name);
  if (i >= 0) { cart.splice(i, 1); btn.classList.remove('on'); btn.textContent = '＋'; }
  else        { cart.push({ name, price }); btn.classList.add('on'); btn.textContent = '✓'; }
  renderCalc();
}
function renderCalc(){
  const bar = document.getElementById('calcbar');
  if (!cart.length) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  const sum = cart.reduce((s, c) => s + c.price, 0);
  document.getElementById('calcSum').textContent = sum.toLocaleString('de-DE') + ' $';
  document.getElementById('calcCount').textContent = cart.length + ' Leistung' + (cart.length > 1 ? 'en' : '') + ' gewählt';
}
function clearCalc(){
  cart = [];
  document.querySelectorAll('.add-btn.on').forEach(b => { b.classList.remove('on'); b.textContent = '＋'; });
  renderCalc();
}
async function copyCalc(){
  const sum = cart.reduce((s, c) => s + c.price, 0);
  const txt = 'Anfrage an den ACLS:\n' +
    cart.map(c => `• ${c.name} – ${c.price.toLocaleString('de-DE')} $`).join('\n') +
    `\nGesamt (ca.): ${sum.toLocaleString('de-DE')} $`;
  try { await navigator.clipboard.writeText(txt); alert('Anfrage kopiert! Füge sie im Discord oder IC ein.'); }
  catch { prompt('Kopiere deine Anfrage:', txt); }
}
const CAT_META = {
  'Werkstatt':    { icon:'🔧', bg:'rgba(249,115,22,.15)', col:'#f97316', sub:'Reparatur, Tuning & Abschleppdienst' },
  'Fahrschule':   { icon:'🎓', bg:'rgba(34,197,94,.12)',  col:'#22c55e', sub:'Rechnungspreis – automatischer Kontoabzug' },
  'Kundenpreise': { icon:'🤝', bg:'rgba(56,189,248,.12)', col:'#38bdf8', sub:'Bar auf Hand' },
};

async function load() {
  try {
    const res = await fetch('/api/prices');
    const rows = await res.json();
    if (!rows.length) { document.getElementById('grid').innerHTML = '<div class="empty">Keine Preise hinterlegt.</div>'; return; }

    const cats = {};
    rows.forEach(r => { if (!cats[r.category]) cats[r.category] = []; cats[r.category].push(r); });

    document.getElementById('grid').innerHTML = Object.entries(cats).map(([cat, items]) => {
      const m = CAT_META[cat] || { icon:'🏷️', bg:'rgba(107,114,128,.12)', col:'#6b7280', sub:'' };
      return `
      <div class="card">
        <div class="card-head">
          <div class="cat-icon" style="background:${m.bg}">${m.icon}</div>
          <div>
            <div class="cat-title">${cat}</div>
            ${m.sub ? `<div class="cat-sub">${m.sub}</div>` : ''}
          </div>
        </div>
        <div class="items">
          ${items.map(item => {
            const num = priceNum(item.price);
            return `
          <div class="item">
            <div style="flex:1;min-width:0">
              <div class="item-name">${esc(item.name)}</div>
              ${item.notes ? `<div class="item-note">${esc(item.notes)}</div>` : ''}
            </div>
            <div class="item-price" style="color:${m.col}">${esc(item.price)}</div>
            ${num !== null ? `<button class="add-btn" title="Zum Rechner hinzufügen" onclick="toggleCalc(this, ${JSON.stringify(esc(item.name))}, ${num})">＋</button>` : ''}
          </div>`;}).join('')}
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('grid').innerHTML = '<div class="empty">Fehler beim Laden der Preise.</div>';
  }
}
load();
</script>
</body>
</html>
