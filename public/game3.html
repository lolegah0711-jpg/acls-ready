<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead Zone – ACLS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#060606; font-family:'Inter',sans-serif; color:#fff; overflow:hidden; user-select:none; }
    canvas { display:block; }

    #ui {
      position:fixed; top:0; left:0; right:0;
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 20px;
      background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);
      pointer-events:none; z-index:10;
    }
    .ui-left { display:flex; flex-direction:column; gap:5px; }
    #health-bar-wrap { display:flex; align-items:center; gap:8px; }
    #health-bar { width:180px; height:13px; background:#1a1a1a; border-radius:7px; overflow:hidden; border:1px solid #2a2a2a; }
    #health-fill { height:100%; background:linear-gradient(90deg,#dc2626,#f87171); border-radius:7px; transition:width .15s; }
    #health-text { font-size:12px; font-weight:700; color:#fca5a5; min-width:38px; }
    #xp-bar-wrap { display:flex; align-items:center; gap:8px; }
    #xp-bar { width:120px; height:5px; background:#1a1a1a; border-radius:3px; overflow:hidden; }
    #xp-fill { height:100%; background:linear-gradient(90deg,#7c3aed,#a855f7); border-radius:3px; transition:width .3s; }
    #xp-text { font-size:11px; color:#a78bfa; white-space:nowrap; font-weight:600; }
    .ui-stat { font-size:12px; color:#6b7280; }
    .ui-stat b { color:#d1d5db; }

    .ui-center { text-align:center; }
    #wave-label { font-size:10px; color:#4b5563; font-weight:700; text-transform:uppercase; letter-spacing:.1em; }
    #wave-num   { font-size:38px; font-weight:800; line-height:1; }

    .ui-right { text-align:right; }
    #weapon-wrap { display:flex; align-items:center; gap:6px; justify-content:flex-end; }
    #weapon-icon { font-size:20px; }
    #ammo-text   { font-size:14px; font-weight:700; }
    #score-label { font-size:10px; color:#4b5563; font-weight:700; text-transform:uppercase; letter-spacing:.1em; margin-top:4px; }
    #score-num   { font-size:28px; font-weight:800; color:#fbbf24; }

    #reload-wrap {
      position:fixed; bottom:62px; left:50%; transform:translateX(-50%);
      width:200px; pointer-events:none; display:none; z-index:10;
    }
    #reload-label { text-align:center; font-size:11px; color:#fbbf24; font-weight:700; letter-spacing:.05em; margin-bottom:4px; }
    #reload-bar   { height:5px; background:#1f1f1f; border-radius:3px; overflow:hidden; }
    #reload-fill  { height:100%; background:#fbbf24; border-radius:3px; }

    #hint { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); font-size:11px; color:#2d3748; pointer-events:none; white-space:nowrap; }

    #ch { position:fixed; pointer-events:none; z-index:200; transform:translate(-50%,-50%); }

    .ov { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.88); z-index:100; }
    .ov.hidden { display:none; }
    .ov-card { background:#0c0c0c; border:1px solid #1e1e1e; border-radius:18px; padding:38px 44px; max-width:520px; width:92%; text-align:center; }
    .ov-card h2 { font-size:28px; font-weight:800; margin-bottom:6px; }
    .sub { color:#6b7280; font-size:14px; margin-bottom:22px; line-height:1.5; }

    .btn { display:inline-block; padding:12px 28px; border-radius:10px; font-weight:700; font-size:15px; cursor:pointer; border:none; font-family:inherit; transition:opacity .15s, transform .1s; }
    .btn:hover  { opacity:.85; transform:translateY(-1px); }
    .btn:active { transform:translateY(0); }
    .btn-red   { background:#dc2626; color:#fff; }
    .btn-green { background:#16a34a; color:#fff; }
    .btn-gray  { background:#1f2937; color:#d1d5db; border:1px solid #374151; }

    .up-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0; }
    .up-card { background:#131313; border:1px solid #222; border-radius:12px; padding:14px 12px; cursor:pointer; transition:border-color .15s, background .15s; text-align:center; }
    .up-card:hover:not(.maxed):not(.locked) { border-color:#22c55e; background:#081208; }
    .up-card.maxed  { opacity:.4; cursor:default; }
    .up-card.locked { opacity:.5; cursor:default; }
    .up-icon  { font-size:26px; margin-bottom:4px; }
    .up-name  { font-size:13px; font-weight:700; }
    .up-desc  { font-size:11px; color:#6b7280; margin-top:2px; }
    .up-stars { font-size:15px; letter-spacing:2px; margin-top:7px; }

    .lb-row { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid #141414; font-size:13px; }
    .lb-rank { width:26px; text-align:center; font-weight:700; }
    .lb-av   { width:28px; height:28px; border-radius:50%; background:#1f2937; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; overflow:hidden; flex-shrink:0; }
    .lb-av img { width:100%; height:100%; object-fit:cover; }
    .lb-name  { flex:1; font-weight:600; }
    .lb-score { font-weight:700; color:#fbbf24; }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<svg id="ch" width="26" height="26" viewBox="0 0 26 26">
  <line x1="13" y1="2"  x2="13" y2="9"  stroke="rgba(255,255,255,.6)" stroke-width="1.5"/>
  <line x1="13" y1="17" x2="13" y2="24" stroke="rgba(255,255,255,.6)" stroke-width="1.5"/>
  <line x1="2"  y1="13" x2="9"  y2="13" stroke="rgba(255,255,255,.6)" stroke-width="1.5"/>
  <line x1="17" y1="13" x2="24" y2="13" stroke="rgba(255,255,255,.6)" stroke-width="1.5"/>
  <circle cx="13" cy="13" r="2.5" stroke="#ef4444" stroke-width="1.5" fill="none"/>
</svg>

<div id="ui">
  <div class="ui-left">
    <div id="health-bar-wrap">
      <div id="health-bar"><div id="health-fill" style="width:100%"></div></div>
      <div id="health-text">100</div>
    </div>
    <div id="xp-bar-wrap">
      <div id="xp-bar"><div id="xp-fill" style="width:0%"></div></div>
      <div id="xp-text">Lv.1</div>
    </div>
    <div class="ui-stat">Kills: <b id="ui-kills">0</b></div>
  </div>
  <div class="ui-center">
    <div id="wave-label">Welle</div>
    <div id="wave-num">1</div>
  </div>
  <div class="ui-right">
    <div id="weapon-wrap"><div id="weapon-icon">🔫</div><div id="ammo-text">∞</div></div>
    <div id="score-label">Score</div>
    <div id="score-num">0</div>
  </div>
</div>

<div id="reload-wrap">
  <div id="reload-label">NACHLADEN</div>
  <div id="reload-bar"><div id="reload-fill" style="width:0%"></div></div>
</div>
<div id="hint">WASD bewegen · Maus zielen · Klick schießen · R nachladen</div>

<!-- START -->
<div class="ov" id="ov-start">
  <div class="ov-card">
    <div style="font-size:52px;margin-bottom:12px">☣️</div>
    <h2 style="color:#ef4444;letter-spacing:.02em">DEAD ZONE</h2>
    <p class="sub">Überlebe Wellen von Zombies. Sammle Waffen und Heilung auf.<br>Level deinen Charakter zwischen den Wellen.</p>
    <div id="char-info" style="font-size:13px;color:#6b7280;margin-bottom:22px">Lade Charakter…</div>
    <button class="btn btn-red" onclick="startGame()" style="font-size:16px;padding:14px 36px">▶ STARTEN</button>
    <br><br>
    <button class="btn btn-gray" onclick="openLb()">🏆 Rangliste</button>
  </div>
</div>

<!-- WAVE CLEAR -->
<div class="ov hidden" id="ov-wave">
  <div class="ov-card">
    <h2 id="wc-title" style="color:#22c55e"></h2>
    <p class="sub" id="wc-sub"></p>
    <div id="pts-info" style="font-size:14px;color:#fbbf24;font-weight:700;min-height:22px;margin-bottom:4px"></div>
    <div class="up-grid" id="up-grid"></div>
    <button class="btn btn-green" onclick="nextWave()">Nächste Welle →</button>
  </div>
</div>

<!-- GAME OVER -->
<div class="ov hidden" id="ov-dead">
  <div class="ov-card">
    <div style="font-size:48px;margin-bottom:8px">💀</div>
    <h2 style="color:#ef4444">GAME OVER</h2>
    <p class="sub" id="go-stats"></p>
    <p style="font-size:13px;color:#6b7280;margin-bottom:22px" id="go-char"></p>
    <div style="display:flex;gap:12px;justify-content:center">
      <button class="btn btn-red" onclick="restartGame()">Nochmal</button>
      <button class="btn btn-gray" onclick="openLb()">🏆 Rangliste</button>
    </div>
  </div>
</div>

<!-- LEADERBOARD -->
<div class="ov hidden" id="ov-lb">
  <div class="ov-card" style="max-width:420px">
    <h2 style="margin-bottom:4px">🏆 Rangliste</h2>
    <p class="sub">Dead Zone – Höchster Score</p>
    <div id="lb-list" style="text-align:left;max-height:320px;overflow-y:auto"></div>
    <button class="btn btn-gray" onclick="closeLb()" style="margin-top:18px">Schließen</button>
  </div>
</div>

<script>
// ── WEAPONS ──────────────────────────────────────────────────────────────────
const WPNS = {
  pistol:  { name:'Pistole',       icon:'🔫', dmg:28, rate:360, ammo:0,  spd:12, spread:.05, pellets:1, reloadMs:1200, color:'#fbbf24' },
  shotgun: { name:'Schrotflinte',  icon:'💥', dmg:18, rate:750, ammo:8,  spd:11, spread:.28, pellets:6, reloadMs:1800, color:'#f97316' },
  smg:     { name:'SMG',           icon:'⚡', dmg:13, rate:110, ammo:35, spd:14, spread:.13, pellets:1, reloadMs:1400, color:'#60a5fa' },
  rifle:   { name:'Sturmgewehr',   icon:'🎯', dmg:45, rate:210, ammo:20, spd:16, spread:.04, pellets:1, reloadMs:1600, color:'#4ade80' },
};

// ── ZOMBIE TYPES ──────────────────────────────────────────────────────────────
const ZTYPES = {
  walker:  { baseHp:65,  spd:1.1,  dmg:10, xp:10, pts:10, r:14, c1:'#3d6b52', c2:'#2a4a38' },
  runner:  { baseHp:32,  spd:2.6,  dmg:8,  xp:8,  pts:15, r:11, c1:'#15803d', c2:'#0d5c2b' },
  tank:    { baseHp:320, spd:0.55, dmg:28, xp:45, pts:60, r:22, c1:'#7f1d1d', c2:'#5a1313', drop:true },
  spitter: { baseHp:45,  spd:1.4,  dmg:6,  xp:12, pts:20, r:13, c1:'#5b21b6', c2:'#3b1585', ranged:true },
};

// ── SKILLS ────────────────────────────────────────────────────────────────────
const SKILLS = [
  { key:'skill_damage',   icon:'⚔️', name:'Schaden',        desc:'+20% Schaden pro Stufe' },
  { key:'skill_firerate', icon:'🔥', name:'Feuerrate',       desc:'-10% Schussintervall' },
  { key:'skill_speed',    icon:'👟', name:'Bewegung',        desc:'+0.3 Laufgeschwindigkeit' },
  { key:'skill_shield',   icon:'🛡️', name:'Schild',          desc:'+25 Max-HP pro Stufe' },
];

// ── STATE ─────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;

let player, bullets=[], eBullets=[], zombies=[], particles=[], drops=[], bloodStains=[];
let score=0, wave=1, kills=0;
let gameState = 'idle';
let mouse = { x:400, y:300, down:false };
let keys  = {};
let curWpn='pistol', curAmmo=0;
let lastFireT=0, reloading=false, reloadStart=0, reloadDur=1200;
let shakeMag=0;
let char=null, currentUser=null;
let sessionKills=0, sessionXp=0;
let raf, lastT=0;
let waveQueue=[], zombiesSpawned=0, spawnCd=0;

function resize() { W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const rnd  = (a,b) => Math.random()*(b-a)+a;
const rndI = (a,b) => Math.floor(rnd(a,b));
const clamp= (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;
const dist2= (a,b) => (a.x-b.x)**2+(a.y-b.y)**2;

function edgePos() {
  const s=rndI(0,4);
  if(s===0) return {x:rnd(0,W), y:-28};
  if(s===1) return {x:W+28,     y:rnd(0,H)};
  if(s===2) return {x:rnd(0,W), y:H+28};
  return           {x:-28,      y:rnd(0,H)};
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
async function init() {
  try { const r=await fetch('/auth/me');      if(r.ok) currentUser=await r.json(); } catch{}
  try { const r=await fetch('/api/game-char'); if(r.ok) char=await r.json(); } catch{}
  renderCharInfo();
  lastT=performance.now();
  raf=requestAnimationFrame(loop);
}

function renderCharInfo() {
  const el=document.getElementById('char-info');
  if(!char) { el.textContent=''; return; }
  el.textContent=`Lv.${char.level} Überlebender · ${char.xp}/${char.level*100} XP · ${char.total_kills} Kills gesamt`;
}

// ── GAME INIT ─────────────────────────────────────────────────────────────────
function initGame() {
  const maxHp=100+(char?char.skill_shield*25:0);
  const spd  =2.6+(char?char.skill_speed*0.3:0);
  player={ x:W/2, y:H/2, vx:0, vy:0, r:15, hp:maxHp, maxHp, spd, angle:0, invT:0 };
  bullets=[]; eBullets=[]; zombies=[]; particles=[]; drops=[]; bloodStains=[];
  score=0; wave=1; kills=0; sessionKills=0; sessionXp=0;
  curWpn='pistol'; curAmmo=0; reloading=false; lastFireT=0; shakeMag=0;
  updateHUD(); updateAmmoHUD();
}

// ── WAVE ──────────────────────────────────────────────────────────────────────
function buildWave(w) {
  const q=[];
  for(let i=0;i<5+w*3;i++)              q.push('walker');
  for(let i=0;i<Math.max(0,(w-1)*2);i++) q.push('runner');
  for(let i=0;i<Math.floor(w/3);i++)    q.push('tank');
  for(let i=0;i<Math.max(0,(w-2));i++)  q.push('spitter');
  for(let i=q.length-1;i>0;i--){ const j=rndI(0,i+1); [q[i],q[j]]=[q[j],q[i]]; }
  return q;
}

function startWave() {
  waveQueue=buildWave(wave); zombiesSpawned=0; spawnCd=0;
  document.getElementById('wave-num').textContent=wave;
}

function spawnZombie(type) {
  const t=ZTYPES[type], pos=edgePos();
  const hp=t.baseHp+wave*8;
  zombies.push({
    x:pos.x, y:pos.y, vx:0, vy:0,
    type, hp, maxHp:hp, spd:t.spd*(1+wave*.04),
    dmg:t.dmg, r:t.r, xp:t.xp, pts:t.pts,
    c1:t.c1, c2:t.c2, drop:t.drop||false, ranged:t.ranged||false,
    flash:0, angle:0, shootCd:t.ranged?rnd(0,120):0,
  });
}

// ── SHOOTING ─────────────────────────────────────────────────────────────────
function tryShoot() {
  if(reloading) return;
  const now=performance.now(), w=WPNS[curWpn];
  const fr=w.rate*(1-(char?char.skill_firerate*.1:0));
  if(now-lastFireT<fr) return;
  if(w.ammo>0&&curAmmo===0) { startReload(); return; }
  lastFireT=now;
  if(w.ammo>0){ curAmmo--; if(curAmmo===0) startReload(); }
  const baseA=Math.atan2(mouse.y-player.y, mouse.x-player.x);
  const dmgMul=1+(char?char.skill_damage*.2:0);
  for(let p=0;p<w.pellets;p++){
    const a=baseA+(Math.random()-.5)*w.spread*2;
    bullets.push({ x:player.x+Math.cos(baseA)*22, y:player.y+Math.sin(baseA)*22, vx:Math.cos(a)*w.spd, vy:Math.sin(a)*w.spd, dmg:w.dmg*dmgMul, col:w.color, r:5, life:1 });
  }
  for(let i=0;i<5;i++){
    const a=baseA+(Math.random()-.5)*.9;
    particles.push({x:player.x+Math.cos(baseA)*24,y:player.y+Math.sin(baseA)*24,vx:Math.cos(a)*rnd(2,5),vy:Math.sin(a)*rnd(2,5),life:1,dec:.16,col:'#fef08a',r:rnd(2,4)});
  }
  updateAmmoHUD();
}

function startReload() {
  if(reloading||WPNS[curWpn].ammo===0) return;
  reloading=true; reloadStart=performance.now(); reloadDur=WPNS[curWpn].reloadMs;
  document.getElementById('reload-wrap').style.display='block';
}

function switchWeapon(name) {
  curWpn=name; curAmmo=WPNS[name].ammo; reloading=false;
  document.getElementById('reload-wrap').style.display='none';
  updateAmmoHUD();
}

// ── UPDATE ────────────────────────────────────────────────────────────────────
function update(dt) {
  if(gameState!=='playing') return;

  // Player
  let dx=0,dy=0;
  if(keys['w']||keys['arrowup'])    dy-=1;
  if(keys['s']||keys['arrowdown'])  dy+=1;
  if(keys['a']||keys['arrowleft'])  dx-=1;
  if(keys['d']||keys['arrowright']) dx+=1;
  if(dx&&dy){dx*=.707;dy*=.707;}
  player.vx=lerp(player.vx,dx*player.spd,.22);
  player.vy=lerp(player.vy,dy*player.spd,.22);
  player.x=clamp(player.x+player.vx,player.r,W-player.r);
  player.y=clamp(player.y+player.vy,player.r,H-player.r);
  player.angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);
  if(player.invT>0) player.invT-=dt*1000;
  if(mouse.down) tryShoot();

  // Reload tick
  if(reloading){
    const p=(performance.now()-reloadStart)/reloadDur;
    document.getElementById('reload-fill').style.width=clamp(p*100,0,100)+'%';
    if(p>=1){ reloading=false; curAmmo=WPNS[curWpn].ammo; document.getElementById('reload-wrap').style.display='none'; updateAmmoHUD(); }
  }

  // Spawn
  spawnCd-=dt*1000;
  if(spawnCd<=0&&zombiesSpawned<waveQueue.length){
    spawnZombie(waveQueue[zombiesSpawned++]);
    spawnCd=Math.max(220,900-wave*35);
  }

  // Player bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life-=.013;
    if(b.life<=0||b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){ bullets.splice(i,1); continue; }
    for(let j=zombies.length-1;j>=0;j--){
      const z=zombies[j];
      if(dist2(b,z)<(b.r+z.r)**2){
        z.hp-=b.dmg; z.flash=10;
        for(let p=0;p<5;p++){const a=Math.random()*Math.PI*2;particles.push({x:b.x,y:b.y,vx:Math.cos(a)*rnd(1,3),vy:Math.sin(a)*rnd(1,3),life:1,dec:.1,col:'#ef4444',r:rnd(2,4)});}
        if(z.hp<=0) killZombie(j,z);
        bullets.splice(i,1); break;
      }
    }
  }

  // Enemy bullets
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life-=.009;
    if(b.life<=0||b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){ eBullets.splice(i,1); continue; }
    if(player.invT<=0&&dist2(b,player)<(b.r+player.r)**2){
      player.hp-=b.dmg; player.invT=300; shakeMag=Math.max(shakeMag,5);
      eBullets.splice(i,1);
      if(player.hp<=0){ endGame(); return; }
    }
  }

  // Zombies
  for(let i=zombies.length-1;i>=0;i--){
    const z=zombies[i];
    const ang=Math.atan2(player.y-z.y,player.x-z.x);
    z.angle=ang;
    z.vx=lerp(z.vx,Math.cos(ang)*z.spd,.1);
    z.vy=lerp(z.vy,Math.sin(ang)*z.spd,.1);
    z.x+=z.vx; z.y+=z.vy;
    if(z.flash>0) z.flash--;

    if(z.ranged){
      z.shootCd-=dt*1000;
      if(z.shootCd<=0&&dist2(z,player)<280**2){
        z.shootCd=2200-wave*50;
        const a=ang+(Math.random()-.5)*.3;
        eBullets.push({x:z.x,y:z.y,vx:Math.cos(a)*6,vy:Math.sin(a)*6,dmg:z.dmg,r:6,life:1,col:'#c084fc'});
      }
      if(dist2(z,player)<180**2){ z.vx-=Math.cos(ang)*z.spd*.5; z.vy-=Math.sin(ang)*z.spd*.5; }
    }

    // Separation
    for(let j=0;j<zombies.length;j++){
      if(i===j) continue;
      const o=zombies[j], d2=dist2(z,o), minD=z.r+o.r+1;
      if(d2<minD*minD&&d2>0){ const d=Math.sqrt(d2), push=(minD-d)/d*.45; z.x-=(o.x-z.x)*push*.28; z.y-=(o.y-z.y)*push*.28; }
    }

    if(!z.ranged&&player.invT<=0&&dist2(z,player)<(z.r+player.r)**2){
      player.hp-=z.dmg*dt*1.8; shakeMag=Math.max(shakeMag,4); player.invT=200;
      if(player.hp<=0){ endGame(); return; }
    }
  }

  // Drops
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.angle+=.04; d.life-=dt*1000;
    if(d.life<=0){ drops.splice(i,1); continue; }
    if(dist2(d,player)<(d.r+player.r)**2){ pickupDrop(d); drops.splice(i,1); }
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=.88; p.vy*=.88; p.life-=p.dec;
    if(p.life<=0) particles.splice(i,1);
  }

  shakeMag*=.8;

  if(zombiesSpawned>=waveQueue.length&&zombies.length===0) endWave();
  updateHUD();
}

function killZombie(j,z){
  kills++; sessionKills++; score+=z.pts*wave;
  sessionXp+=z.xp*wave;
  zombies.splice(j,1);
  bloodStains.push({x:z.x,y:z.y,r:z.r*1.7,a:.5});
  if(bloodStains.length>60) bloodStains.shift();
  for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2;particles.push({x:z.x,y:z.y,vx:Math.cos(a)*rnd(1,5),vy:Math.sin(a)*rnd(1,5),life:1,dec:.032,col:'#991b1b',r:rnd(3,7)});}
  particles.push({x:z.x,y:z.y-12,vx:0,vy:-.6,life:1,dec:.011,col:'#fbbf24',r:0,txt:`+${z.pts*wave}`});
  if(z.drop) spawnDrop(z.x,z.y);
  document.getElementById('ui-kills').textContent=kills;
}

function spawnDrop(x,y){
  const pool=['shotgun','smg','rifle','health','health'];
  drops.push({x,y,type:pool[rndI(0,pool.length)],r:14,angle:0,life:8000});
}

function pickupDrop(d){
  if(d.type==='health'){
    player.hp=Math.min(player.maxHp,player.hp+50);
    particles.push({x:d.x,y:d.y-12,vx:0,vy:-.5,life:1,dec:.012,col:'#f87171',r:0,txt:'❤️ +50'});
  } else {
    switchWeapon(d.type);
    particles.push({x:d.x,y:d.y-12,vx:0,vy:-.5,life:1,dec:.012,col:'#60a5fa',r:0,txt:WPNS[d.type].name});
  }
}

// ── DRAW ─────────────────────────────────────────────────────────────────────
function draw() {
  const sx=(Math.random()-.5)*shakeMag, sy=(Math.random()-.5)*shakeMag;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(sx,sy);

  // BG
  ctx.fillStyle='#050505'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.025)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Blood stains
  for(const b of bloodStains){
    ctx.globalAlpha=b.a*.45; ctx.fillStyle='#7f1d1d';
    ctx.beginPath(); ctx.ellipse(b.x,b.y,b.r,b.r*.5,0,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // Drops
  for(const d of drops){
    const alpha=d.life<2000?d.life/2000:1;
    ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.angle); ctx.globalAlpha=alpha;
    const gc=d.type==='health'?'#dc2626':'#2563eb';
    ctx.shadowColor=gc; ctx.shadowBlur=14; ctx.fillStyle=gc;
    ctx.fillRect(-11,-11,22,22); ctx.shadowBlur=0;
    ctx.font='15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(d.type==='health'?'❤️':(WPNS[d.type]?.icon||'📦'),0,0);
    ctx.restore(); ctx.globalAlpha=1;
  }

  // Particles (non-text)
  for(const p of particles){
    if(p.txt) continue;
    ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0,p.r*p.life),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // Enemy bullets
  for(const b of eBullets){
    ctx.globalAlpha=b.life; ctx.shadowColor='#a855f7'; ctx.shadowBlur=10;
    ctx.fillStyle='#c084fc'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  // Zombies
  for(const z of zombies){
    ctx.save(); ctx.translate(z.x,z.y);
    ctx.globalAlpha=.2; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(2,5,z.r*.9,z.r*.4,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    ctx.rotate(z.angle);
    ctx.fillStyle=z.flash>0?'#fef2f2':z.c1; ctx.beginPath(); ctx.arc(0,0,z.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=z.flash>0?'#ef4444':z.c2; ctx.beginPath(); ctx.arc(0,0,z.r*.52,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=z.flash>0?'#fff':'#fca5a5';
    ctx.beginPath(); ctx.arc(z.r*.42,-z.r*.22,z.r*.17,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(z.r*.42, z.r*.22,z.r*.17,0,Math.PI*2); ctx.fill();
    if(z.ranged){ ctx.fillStyle='#a855f7'; ctx.beginPath(); ctx.arc(-z.r*.3,0,z.r*.22,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
    if(z.hp<z.maxHp){
      const bw=z.r*2.6,bh=4,bx=z.x-bw/2,by=z.y-z.r-11;
      ctx.fillStyle='#1a1a1a'; ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle='#ef4444'; ctx.fillRect(bx,by,bw*(z.hp/z.maxHp),bh);
    }
  }

  // Player bullets
  for(const b of bullets){
    ctx.globalAlpha=b.life; ctx.shadowColor=b.col; ctx.shadowBlur=9;
    ctx.fillStyle=b.col; ctx.beginPath(); ctx.arc(b.x,b.y,Math.max(0,b.r*b.life),0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  // Player
  if(player&&(gameState==='playing'||gameState==='wave-end')){
    ctx.save(); ctx.translate(player.x,player.y);
    ctx.globalAlpha=.2; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(3,6,13,6,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
    ctx.rotate(player.angle);
    ctx.fillStyle='#374151'; ctx.fillRect(10,-3.5,22,7);
    ctx.fillStyle='#4b5563'; ctx.fillRect(28,-2.5,6,5);
    ctx.shadowColor='#3b82f6'; ctx.shadowBlur=14;
    const gr=ctx.createRadialGradient(-4,-4,2,0,0,player.r);
    gr.addColorStop(0,'#93c5fd'); gr.addColorStop(1,'#1d4ed8');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(0,0,player.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    if(player.invT>0&&Math.floor(player.invT/60)%2===0){ ctx.globalAlpha=.3; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,player.r,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
    ctx.strokeStyle='#93c5fd'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,player.r,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // Float texts
  for(const p of particles){
    if(!p.txt) continue;
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col; ctx.font='bold 13px Inter,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.txt,p.x,p.y);
    ctx.globalAlpha=1;
  }

  ctx.restore();
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD(){
  if(!player) return;
  const pct=Math.max(0,player.hp/player.maxHp*100);
  document.getElementById('health-fill').style.width=pct+'%';
  document.getElementById('health-text').textContent=Math.max(0,Math.ceil(player.hp));
  document.getElementById('score-num').textContent=score;
  document.getElementById('wave-num').textContent=wave;
  if(char){
    document.getElementById('xp-fill').style.width=Math.min(100,(char.xp/(char.level*100))*100)+'%';
    document.getElementById('xp-text').textContent=`Lv.${char.level}`;
  }
}
function updateAmmoHUD(){
  const w=WPNS[curWpn];
  document.getElementById('weapon-icon').textContent=w.icon;
  document.getElementById('ammo-text').textContent=w.ammo===0?'∞':`${curAmmo}/${w.ammo}`;
}

// ── LOOP ─────────────────────────────────────────────────────────────────────
function loop(now){
  raf=requestAnimationFrame(loop);
  const dt=Math.min((now-lastT)/1000,.05); lastT=now;
  update(dt); draw();
}

// ── WAVE END ─────────────────────────────────────────────────────────────────
function endWave(){
  gameState='wave-end';
  document.getElementById('wc-title').textContent=`Welle ${wave} abgeschlossen! 🎉`;
  document.getElementById('wc-sub').textContent=`Score: ${score.toLocaleString()} · Kills: ${kills}`;
  const pts=char?char.skill_points:0;
  document.getElementById('pts-info').textContent=pts>0?`${pts} Skillpunkt${pts>1?'e':''} verfügbar!`:'';
  renderUpGrid();
  document.getElementById('ov-wave').classList.remove('hidden');
}

function renderUpGrid(){
  const pts=char?char.skill_points:0;
  document.getElementById('up-grid').innerHTML=SKILLS.map(s=>{
    const lv=char?char[s.key]:0, maxed=lv>=5;
    const stars='★'.repeat(lv)+'☆'.repeat(5-lv);
    const cls=maxed?'up-card maxed':pts<1?'up-card locked':'up-card';
    const click=(!maxed&&pts>0)?`onclick="spendPt('${s.key}')"`:'';
    return`<div class="${cls}"${click?` ${click}`:''}>
      <div class="up-icon">${s.icon}</div>
      <div class="up-name">${s.name}</div>
      <div class="up-desc">${s.desc}</div>
      <div class="up-stars" style="color:${maxed?'#4ade80':'#fbbf24'}">${stars}</div>
    </div>`;
  }).join('');
}

window.spendPt=async function(skill){
  if(!char||char.skill_points<1) return;
  try{
    const r=await fetch('/api/game-char/upgrade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skill})});
    if(r.ok){const d=await r.json();char=d.char;renderUpGrid();renderCharInfo();}
  }catch{}
};

window.nextWave=function(){
  document.getElementById('ov-wave').classList.add('hidden');
  wave++; gameState='playing'; startWave();
};

// ── GAME OVER ────────────────────────────────────────────────────────────────
async function endGame(){
  gameState='dead';
  try{await fetch('/api/game-scores/deadzone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({score})});}catch{}
  try{
    const r=await fetch('/api/game-char/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kills:sessionKills,xp:sessionXp})});
    if(r.ok){const d=await r.json();char=d.char;renderCharInfo();}
  }catch{}
  document.getElementById('go-stats').textContent=`Welle ${wave} · ${kills} Kills · Score: ${score.toLocaleString()}`;
  document.getElementById('go-char').textContent=char?`Lv.${char.level} Überlebender · ${char.total_kills} Kills gesamt`:'';
  document.getElementById('ov-dead').classList.remove('hidden');
}

// ── PUBLIC CONTROLS ──────────────────────────────────────────────────────────
function startGame(){
  document.getElementById('ov-start').classList.add('hidden');
  document.getElementById('ov-dead').classList.add('hidden');
  initGame(); gameState='playing'; startWave();
}
function restartGame(){
  document.getElementById('ov-dead').classList.add('hidden');
  initGame(); gameState='playing'; startWave();
}

async function openLb(){
  document.getElementById('ov-lb').classList.remove('hidden');
  const el=document.getElementById('lb-list');
  el.innerHTML='<div style="text-align:center;padding:20px;color:#6b7280">Laden…</div>';
  try{
    const r=await fetch('/api/game-scores/deadzone'), data=await r.json();
    if(!data.length){el.innerHTML='<div style="text-align:center;padding:20px;color:#6b7280">Noch keine Einträge</div>';return;}
    el.innerHTML=data.map((row,i)=>{
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
      const me=currentUser&&row.discord_id===currentUser.discord_id;
      const av=row.avatar
        ?`<img src="https://cdn.discordapp.com/avatars/${row.discord_id}/${row.avatar}.png" onerror="this.parentElement.textContent='${(row.username||'?').slice(0,2).toUpperCase()}'">`
        :(row.username||'?').slice(0,2).toUpperCase();
      return`<div class="lb-row" style="${me?'background:#1a1200;border-radius:6px;':''}">
        <div class="lb-rank">${medal}</div><div class="lb-av">${av}</div>
        <div class="lb-name">${row.username||'Unbekannt'}</div>
        <div class="lb-score">${row.score.toLocaleString()}</div>
      </div>`;
    }).join('');
  }catch{el.innerHTML='<div style="text-align:center;color:#ef4444">Fehler beim Laden</div>';}
}
function closeLb(){document.getElementById('ov-lb').classList.add('hidden');}

// ── INPUT ────────────────────────────────────────────────────────────────────
window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==='r'&&gameState==='playing') startReload();
  if(e.key===' ') e.preventDefault();
});
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
canvas.style.cursor='none';
document.addEventListener('mousemove',e=>{
  mouse.x=e.clientX; mouse.y=e.clientY;
  const ch=document.getElementById('ch');
  ch.style.left=e.clientX+'px'; ch.style.top=e.clientY+'px';
});
document.addEventListener('mousedown',e=>{ if(e.button===0){mouse.down=true;if(gameState==='playing')tryShoot();} });
document.addEventListener('mouseup',  e=>{ if(e.button===0)mouse.down=false; });
document.addEventListener('contextmenu',e=>e.preventDefault());

init();
</script>
