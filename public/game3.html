<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ACLS Galaxie-Jäger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a14;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      gap: .6rem;
      user-select: none;
      -webkit-user-select: none;
      overflow-y: auto;
      padding: .8rem 0 1.5rem;
    }
    .top-bar { display: flex; align-items: center; gap: 1rem; width: 360px; }
    .back-btn { background: transparent; border: 1px solid rgba(168,85,247,.4); color: #a855f7; padding: .28rem .65rem; border-radius: 6px; cursor: pointer; font-size: .8rem; transition: background .15s; text-decoration: none; }
    .back-btn:hover { background: rgba(168,85,247,.12); }
    h1 { font-size: 1rem; color: #a855f7; font-weight: 700; flex: 1; }
    .charlvl { font-size: .78rem; color: #64748b; white-space: nowrap; }

    .game-wrap { position: relative; width: 360px; flex-shrink: 0; }
    canvas { display: block; border-radius: 10px; border: 2px solid rgba(168,85,247,.25); }
    .hint { font-size: .7rem; color: #374151; }

    /* Upgrade Overlay */
    #up-overlay {
      display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5,5,18,.93); border-radius: 10px; padding: 1.1rem .9rem;
      flex-direction: column; align-items: center; gap: .7rem; z-index: 10; overflow-y: auto;
    }
    #up-overlay.show { display: flex; }
    .up-title { font-size: 1.05rem; font-weight: 700; color: #a855f7; text-align: center; }
    .up-sub   { font-size: .8rem; color: #94a3b8; text-align: center; }
    .pts-badge { background: rgba(168,85,247,.18); border: 1px solid rgba(168,85,247,.4); border-radius: 20px; padding: .12rem .7rem; font-size: .76rem; color: #c084fc; }
    .up-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; width: 100%; }
    .up-card {
      background: #0f172a; border: 2px solid rgba(168,85,247,.2); border-radius: 10px;
      padding: .65rem .5rem; display: flex; flex-direction: column; align-items: center;
      gap: .3rem; cursor: pointer; transition: border-color .15s, background .15s;
    }
    .up-card:hover:not(.maxed):not(.no-pts) { border-color: #a855f7; background: rgba(168,85,247,.08); }
    .up-card.maxed  { opacity: .45; cursor: default; }
    .up-card.no-pts { opacity: .55; cursor: default; }
    .up-icon { font-size: 1.5rem; }
    .up-name { font-size: .78rem; font-weight: 700; color: #e2e8f0; }
    .up-desc { font-size: .67rem; color: #64748b; text-align: center; min-height: 1.6em; }
    .dots { display: flex; gap: 3px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #1e293b; border: 1.5px solid #334155; }
    .dot.on { background: #a855f7; border-color: #a855f7; }
    .up-btn { font-size: .68rem; color: #a855f7; border: 1px solid rgba(168,85,247,.35); background: rgba(168,85,247,.12); border-radius: 5px; padding: .15rem .5rem; margin-top: .1rem; }
    .cont-btn { background: #7c3aed; color: #fff; border: none; border-radius: 8px; padding: .6rem 0; font-size: .92rem; font-weight: 700; cursor: pointer; width: 100%; }
    .cont-btn:hover { background: #6d28d9; }

    /* Leaderboard */
    .lb { width: 360px; background: #0d1117; border: 1px solid rgba(168,85,247,.2); border-radius: 10px; padding: .6rem .7rem; }
    .lb-title { font-size: .72rem; font-weight: 700; color: #a855f7; text-transform: uppercase; letter-spacing: .06em; margin-bottom: .45rem; }
    .lb-row { display: flex; align-items: center; gap: .5rem; padding: .22rem .25rem; border-radius: 5px; font-size: .8rem; }
    .lb-row.me { background: rgba(168,85,247,.1); }
    .lb-rank { width: 1.4rem; text-align: right; font-size: .72rem; color: #475569; flex-shrink: 0; }
    .lb-rank.gold { color: #fbbf24; font-weight: 700; } .lb-rank.silver { color: #94a3b8; font-weight: 700; } .lb-rank.bronze { color: #b45309; font-weight: 700; }
    .lb-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: #1e293b; flex-shrink: 0; }
    .lb-name  { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-level { font-weight: 700; color: #a855f7; flex-shrink: 0; font-size: .76rem; min-width: 3rem; text-align: right; }
    .lb-kills { color: #475569; flex-shrink: 0; font-size: .7rem; min-width: 4.5rem; text-align: right; }
    .lb-empty { font-size: .78rem; color: #4b5563; text-align: center; padding: .5rem 0; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="back-btn" href="javascript:history.back()">← Zurück</a>
    <h1>🚀 Galaxie-Jäger</h1>
    <div class="charlvl">Lv.<span id="char-lv">1</span></div>
  </div>

  <div class="game-wrap">
    <canvas id="c" width="360" height="580"></canvas>
    <div id="up-overlay">
      <div class="up-title" id="up-title">Welle abgeschlossen!</div>
      <div class="up-sub"   id="up-sub"></div>
      <div class="pts-badge" id="up-pts" style="display:none"></div>
      <div class="up-grid" id="up-grid"></div>
      <button class="cont-btn" id="cont-btn" onclick="continueAfterOverlay()">Nächste Welle →</button>
    </div>
  </div>

  <div class="hint">← → / Maus zum Steuern &nbsp;·&nbsp; Space oder Klick zum Starten</div>

  <div class="lb">
    <div class="lb-title">🏆 Rangliste – Galaxie-Jäger</div>
    <div id="lb-list"><div class="lb-empty">Lade…</div></div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // ── Character ─────────────────────────────────────────────────
    let char = { level:1, xp:0, skill_damage:0, skill_firerate:0, skill_speed:0, skill_shield:0, skill_points:0, total_kills:0 };
    let currentUserId = null;
    // Local XP tracking (not yet saved)
    let localLevel, localXP, unsavedXP, unsavedKills, sessionXP, sessionKills;

    function xpForLevel(lv) { return lv * 100; }
    function getStats() {
      return {
        damage:       1   + char.skill_damage   * 0.7,
        fireInterval: Math.max(8, 28 - char.skill_firerate * 4),
        speed:        5   + char.skill_speed,
        lives:        3   + char.skill_shield,
      };
    }
    function syncLocalFromChar() {
      localLevel = char.level; localXP = char.xp;
      unsavedXP = 0; unsavedKills = 0;
      sessionXP = 0; sessionKills = 0;
    }

    // ── Game State ────────────────────────────────────────────────
    let state = 'idle'; // idle | playing | wave_end | dead
    let wave, lives, invincible;
    let player, bullets, eBullets, enemies, particles, floats, stars;
    let fireTimer, spawnQueue, spawnTimer, waveKillCount, waveGoal;

    function buildStars() {
      stars = [
        Array.from({length:50}, () => ({x:Math.random()*W, y:Math.random()*H, s:.5, sp:.25})),
        Array.from({length:28}, () => ({x:Math.random()*W, y:Math.random()*H, s:.9, sp:.6})),
        Array.from({length:14}, () => ({x:Math.random()*W, y:Math.random()*H, s:1.4, sp:1.1})),
      ];
    }

    function waveConfig(w) {
      return {
        scouts:   Math.min(4 + w * 2, 22),
        fighters: w >= 3 ? Math.min((w-2)*2, 10) : 0,
        boss:     w % 5 === 0,
      };
    }
    function buildQueue(cfg) {
      const q = [];
      for (let i=0;i<cfg.scouts;i++)   q.push('scout');
      for (let i=0;i<cfg.fighters;i++) q.push('fighter');
      if (cfg.boss) q.push('boss');
      for (let i=q.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [q[i],q[j]]=[q[j],q[i]]; }
      return q;
    }

    function startWave(w) {
      const cfg = waveConfig(w);
      spawnQueue = buildQueue(cfg);
      waveKillCount = 0; waveGoal = spawnQueue.length;
      spawnTimer = 40;
    }

    function reset() {
      const st = getStats();
      wave = 1; lives = st.lives; invincible = 0;
      syncLocalFromChar();
      player = { x: W/2, tx: W/2, y: H-70 };
      bullets=[]; eBullets=[]; enemies=[]; particles=[]; floats=[];
      fireTimer=0;
      buildStars();
      startWave(1);
      state = 'playing';
    }

    // ── Enemy factories ───────────────────────────────────────────
    const MK = ['scout','fighter','boss'];
    function makeEnemy(type) {
      if (type==='scout')   return {type,x:30+Math.random()*(W-60),y:-18,hp:1,maxHp:1,speed:1.9+Math.random()*.8,vx:(Math.random()-.5)*2.2,color:'#ef4444',xp:10,size:11,sInt:0,sTimer:0};
      if (type==='fighter') return {type,x:40+Math.random()*(W-80),y:-26,hp:3,maxHp:3,speed:1.3,vx:(Math.random()-.5)*1.6,color:'#3b82f6',xp:25,size:16,sInt:0,sTimer:0};
      return                        {type,x:W/2,y:-55,hp:15,maxHp:15,speed:.6,vx:1.1,color:'#a855f7',xp:100,size:28,sInt:52,sTimer:0};
    }

    // ── Input ─────────────────────────────────────────────────────
    const keys={};
    document.addEventListener('keydown', e => {
      if (['ArrowLeft','ArrowRight','a','A','d','D',' ','Enter'].includes(e.key)) e.preventDefault();
      keys[e.key] = true;
      if ((e.key===' '||e.key==='Enter') && (state==='idle'||state==='dead')) reset();
    });
    document.addEventListener('keyup', e => { delete keys[e.key]; });
    canvas.addEventListener('click', () => { if (state==='idle'||state==='dead') reset(); });
    canvas.addEventListener('mousemove', e => {
      const r=canvas.getBoundingClientRect(); if (player) player.tx=e.clientX-r.left;
    });
    let tX=null;
    canvas.addEventListener('touchstart', e => {
      const r=canvas.getBoundingClientRect(); tX=e.touches[0].clientX-r.left;
      if (state==='idle'||state==='dead') reset();
    },{passive:true});
    canvas.addEventListener('touchmove',  e => { const r=canvas.getBoundingClientRect(); tX=e.touches[0].clientX-r.left; },{passive:true});
    canvas.addEventListener('touchend',   () => { tX=null; },{passive:true});

    // ── Update ────────────────────────────────────────────────────
    function update() {
      if (state!=='playing') return;
      const st = getStats();

      // Stars
      for (const layer of stars) for (const s of layer) { s.y+=s.sp; if(s.y>H){s.y=-2;s.x=Math.random()*W;} }

      // Player move
      if (tX!==null) player.tx=tX;
      if (keys['ArrowLeft'] ||keys['a']||keys['A']) player.tx-=st.speed;
      if (keys['ArrowRight']||keys['d']||keys['D']) player.tx+=st.speed;
      player.tx = Math.max(22, Math.min(W-22, player.tx));
      player.x += (player.tx - player.x) * .22;

      // Fire
      fireTimer++;
      if (fireTimer >= st.fireInterval) {
        fireTimer=0;
        bullets.push({x:player.x-6,y:player.y-22,vy:-11});
        bullets.push({x:player.x+6,y:player.y-22,vy:-11});
      }

      // Spawn
      if (spawnQueue.length>0) {
        spawnTimer--;
        if (spawnTimer<=0) {
          spawnTimer = 35+Math.random()*22;
          enemies.push(makeEnemy(spawnQueue.shift()));
        }
      }

      // Enemies
      if (invincible>0) invincible--;
      for (let i=enemies.length-1;i>=0;i--) {
        const e=enemies[i];
        e.x+=e.vx; e.y+=e.speed;
        if (e.x<e.size||e.x>W-e.size) e.vx*=-1;
        if (e.sInt>0) { e.sTimer++; if(e.sTimer>=e.sInt){e.sTimer=0; eBullets.push({x:e.x,y:e.y+e.size+4,r:5,vy:3.2});} }
        if (e.y>H+70) { enemies.splice(i,1); continue; }

        // Hit player
        if (invincible<=0) {
          const dx=player.x-e.x, dy=player.y-e.y;
          if (Math.sqrt(dx*dx+dy*dy)<e.size+15) {
            burst(player.x,player.y,'#f97316',14);
            enemies.splice(i,1);
            takeDamage(); continue;
          }
        }

        // Hit by bullet
        let hit=false;
        for (let j=bullets.length-1;j>=0;j--) {
          const b=bullets[j];
          if (Math.abs(b.x-e.x)<e.size+2 && Math.abs(b.y-e.y)<e.size+2) {
            bullets.splice(j,1);
            e.hp -= st.damage;
            burst(b.x,b.y,'#fed7aa',5);
            if (e.hp<=0) {
              burst(e.x,e.y,e.color,e.type==='boss'?28:14);
              if (e.type==='boss') burst(e.x,e.y,'#fbbf24',18);
              enemies.splice(i,1);
              waveKillCount++;
              gainXP(e.xp);
              hit=true;
            }
            break;
          }
        }
        if (hit) continue;
      }

      // Bullets
      bullets = bullets.filter(b=>b.y>-20); for(const b of bullets) b.y+=b.vy;
      for (let i=eBullets.length-1;i>=0;i--) {
        const b=eBullets[i]; b.y+=b.vy;
        if (b.y>H+20) { eBullets.splice(i,1); continue; }
        if (invincible<=0) {
          const dx=player.x-b.x, dy=player.y-b.y;
          if (Math.sqrt(dx*dx+dy*dy)<b.r+15) { eBullets.splice(i,1); burst(player.x,player.y,'#ef4444',10); takeDamage(); }
        }
      }

      // Particles & floats
      particles = particles.filter(p=>p.life>.02);
      for (const p of particles) { p.x+=p.vx; p.y+=p.vy; p.vy+=.1; p.vx*=.96; p.life-=.028; p.r*=.95; }
      floats = floats.filter(f=>f.life>.02);
      for (const f of floats)    { f.y+=f.vy; f.life-=.014; }

      // Wave done
      if (spawnQueue.length===0 && enemies.length===0 && waveKillCount>=waveGoal) waveComplete();
    }

    function gainXP(amount) {
      unsavedXP  += amount; sessionXP  += amount;
      unsavedKills++;       sessionKills++;
      localXP += amount;
      while (localXP >= xpForLevel(localLevel)) {
        localXP -= xpForLevel(localLevel);
        localLevel++;
        floats.push({text:`Level ${localLevel}! ✨`,x:W/2,y:H/2-20,color:'#c084fc',life:1,vy:-1.3});
      }
    }

    function takeDamage() {
      lives--; invincible=90;
      if (lives<=0) { state='dead'; onGameOver(); }
    }

    function burst(x,y,color,n=12) {
      for (let i=0;i<n;i++) {
        const a=Math.random()*Math.PI*2, v=1.5+Math.random()*4;
        particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,r:2+Math.random()*3,color});
      }
    }

    function waveComplete() {
      state='wave_end';
      openOverlay(false);
    }

    async function onGameOver() {
      await saveProgress();
      openOverlay(true);
    }

    // ── Save ──────────────────────────────────────────────────────
    async function saveProgress() {
      if (!currentUserId || (unsavedXP===0 && unsavedKills===0)) return;
      try {
        const res = await fetch('/api/game-char/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({xp:unsavedXP,kills:unsavedKills})});
        if (res.ok) {
          const d = await res.json();
          char = d.char;
          localLevel = char.level; localXP = char.xp;
          document.getElementById('char-lv').textContent = char.level;
        }
      } catch(e) {}
      unsavedXP=0; unsavedKills=0;
      refreshLeaderboard();
    }

    // ── Upgrade Overlay ───────────────────────────────────────────
    const SKILLS = [
      {key:'skill_damage',   icon:'⚡', name:'Schaden',    descs:['×1.0','×1.7','×2.4','×3.1','×3.8','×4.5']},
      {key:'skill_firerate', icon:'🔥', name:'Feuerrate',  descs:['Normal','Schnell','Rapid','Burst','Mega','Gatling']},
      {key:'skill_speed',    icon:'💨', name:'Geschwind.', descs:['Standard','Flink','Schnell','Sehr schnell','Blitz','Max']},
      {key:'skill_shield',   icon:'🛡️', name:'Schild',     descs:['3 Leben','4 Leben','5 Leben','6 Leben','7 Leben','8 Leben']},
    ];
    const MAX_SK = 5;

    function renderUpgradeGrid() {
      const hasPoints = char.skill_points > 0;
      document.getElementById('up-pts').style.display = hasPoints ? '' : 'none';
      document.getElementById('up-pts').textContent   = `${char.skill_points} Skillpunkt${char.skill_points!==1?'e':''} verfügbar`;
      document.getElementById('up-grid').innerHTML = SKILLS.map(sk => {
        const lv = char[sk.key], maxed = lv>=MAX_SK;
        return `<div class="up-card${maxed?' maxed':''}${!maxed&&!hasPoints?' no-pts':''}" onclick="spendPoint('${sk.key}')">
          <div class="up-icon">${sk.icon}</div>
          <div class="up-name">${sk.name}</div>
          <div class="dots">${Array.from({length:MAX_SK},(_,i)=>`<div class="dot${i<lv?' on':''}"></div>`).join('')}</div>
          <div class="up-desc">${sk.descs[lv]}</div>
          ${!maxed?`<div class="up-btn">Upgrade +1</div>`:`<div class="up-desc" style="color:#374151;margin-top:.1rem">MAX</div>`}
        </div>`;
      }).join('');
    }

    function openOverlay(isGameOver) {
      const overlay = document.getElementById('up-overlay');
      document.getElementById('up-title').textContent = isGameOver ? '💥 Abgestürzt!' : `🌟 Welle ${wave} geschafft!`;
      document.getElementById('up-sub').textContent   = `+${sessionXP} XP · ${sessionKills} Abschüsse · Lv.${localLevel}`;
      document.getElementById('cont-btn').textContent = isGameOver ? '▶ Nochmal spielen' : 'Nächste Welle →';
      document.getElementById('cont-btn').dataset.mode = isGameOver ? 'dead' : 'wave';
      renderUpgradeGrid();
      overlay.classList.add('show');
    }

    window.spendPoint = async function(skillKey) {
      if (char.skill_points<=0 || char[skillKey]>=MAX_SK) return;
      try {
        const res = await fetch('/api/game-char/upgrade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skill:skillKey})});
        if (res.ok) { const d=await res.json(); char=d.char; renderUpgradeGrid(); }
      } catch(e) {}
    };

    window.continueAfterOverlay = function() {
      const mode = document.getElementById('cont-btn').dataset.mode;
      document.getElementById('up-overlay').classList.remove('show');
      if (mode==='dead') { state='idle'; return; }
      // Next wave
      wave++;
      eBullets=[]; bullets=[];
      startWave(wave);
      state='playing';
    };

    // ── Draw ──────────────────────────────────────────────────────
    function drawStars() {
      const alphas=[.25,.45,.7];
      for (let li=0;li<stars.length;li++) {
        ctx.fillStyle=`rgba(255,255,255,${alphas[li]})`;
        for (const s of stars[li]) { ctx.beginPath(); ctx.arc(s.x,s.y,s.s,0,Math.PI*2); ctx.fill(); }
      }
    }

    function drawPlayer() {
      if (invincible>0 && Math.floor(invincible/6)%2===1) return;
      const x=player.x, y=player.y;
      // Engine glow
      const eg=ctx.createRadialGradient(x,y+20,0,x,y+20,26);
      eg.addColorStop(0,'rgba(249,115,22,.8)'); eg.addColorStop(1,'rgba(249,115,22,0)');
      ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(x,y+20,26,0,Math.PI*2); ctx.fill();
      // Wings
      ctx.fillStyle='#c2410c';
      ctx.beginPath(); ctx.moveTo(x-16,y+16); ctx.lineTo(x-26,y+24); ctx.lineTo(x-7,y+10); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x+16,y+16); ctx.lineTo(x+26,y+24); ctx.lineTo(x+7,y+10); ctx.closePath(); ctx.fill();
      // Body
      ctx.fillStyle='#f97316';
      ctx.beginPath(); ctx.moveTo(x,y-28); ctx.lineTo(x+15,y+16); ctx.lineTo(x+7,y+12); ctx.lineTo(x,y+22); ctx.lineTo(x-7,y+12); ctx.lineTo(x-15,y+16); ctx.closePath(); ctx.fill();
      // Cockpit
      ctx.fillStyle='#bfdbfe';
      ctx.beginPath(); ctx.ellipse(x,y-8,5.5,10,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.4)';
      ctx.beginPath(); ctx.ellipse(x-1.5,y-12,2,5,-.3,0,Math.PI*2); ctx.fill();
    }

    function drawEnemy(e) {
      ctx.save(); ctx.translate(e.x,e.y);
      const n = e.type==='scout'?4 : e.type==='fighter'?6 : 8;
      ctx.fillStyle = e.color;
      if (e.type==='boss') { ctx.shadowColor=e.color; ctx.shadowBlur=18; }
      ctx.beginPath();
      for (let i=0;i<n;i++) {
        const a=(i/n)*Math.PI*2-(Math.PI/2);
        i===0?ctx.moveTo(Math.cos(a)*e.size,Math.sin(a)*e.size):ctx.lineTo(Math.cos(a)*e.size,Math.sin(a)*e.size);
      }
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur=0;
      // Inner highlight
      ctx.fillStyle='rgba(255,255,255,.15)';
      ctx.beginPath(); ctx.arc(0,0,e.size*.45,0,Math.PI*2); ctx.fill();
      // HP bar for boss
      if (e.type==='boss') {
        const bw=e.size*2.4;
        ctx.fillStyle='rgba(0,0,0,.6)'; ctx.beginPath(); ctx.roundRect(-bw/2,-e.size-13,bw,7,3); ctx.fill();
        const g=ctx.createLinearGradient(-bw/2,0,bw/2,0);
        g.addColorStop(0,'#7c3aed'); g.addColorStop(1,'#a855f7');
        ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(-bw/2,-e.size-13,bw*(e.hp/e.maxHp),7,3); ctx.fill();
      }
      ctx.restore();
    }

    function drawHUD() {
      const st=getStats();
      // Wave/kills
      ctx.fillStyle='rgba(0,0,0,.55)'; ctx.beginPath(); ctx.roundRect(6,6,145,30,6); ctx.fill();
      ctx.fillStyle='#a855f7'; ctx.font='bold 13px Segoe UI'; ctx.textAlign='left';
      ctx.fillText(`Welle ${wave}  ·  ${sessionKills} Kills`,14,26);
      // Lives
      ctx.fillStyle='rgba(0,0,0,.55)'; ctx.beginPath(); ctx.roundRect(W-90,6,84,30,6); ctx.fill();
      ctx.font='14px Segoe UI'; ctx.textAlign='right';
      const maxLives=st.lives;
      ctx.fillText('❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,maxLives-lives)),W-8,26);
      // XP bar
      const xpPct = Math.min(1, localXP / xpForLevel(localLevel));
      ctx.fillStyle='rgba(0,0,0,.45)'; ctx.beginPath(); ctx.roundRect(6,H-18,W-12,10,5); ctx.fill();
      const xg=ctx.createLinearGradient(6,0,6+(W-12)*xpPct,0);
      xg.addColorStop(0,'#7c3aed'); xg.addColorStop(1,'#a855f7');
      ctx.fillStyle=xg; ctx.beginPath(); ctx.roundRect(6,H-18,(W-12)*xpPct,10,5); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='9px Segoe UI'; ctx.textAlign='center';
      ctx.fillText(`Lv.${localLevel}  ·  ${localXP}/${xpForLevel(localLevel)} XP`,W/2,H-10);
      // Floats
      for (const f of floats) {
        ctx.globalAlpha=f.life; ctx.fillStyle=f.color;
        ctx.font='bold 16px Segoe UI'; ctx.textAlign='center'; ctx.fillText(f.text,f.x,f.y);
      }
      ctx.globalAlpha=1;
    }

    function drawOverlay() {
      ctx.fillStyle='rgba(5,5,18,.82)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      if (state==='idle') {
        ctx.fillStyle='#a855f7'; ctx.font='bold 26px Segoe UI'; ctx.fillText('🚀 Galaxie-Jäger',W/2,H/2-70);
        ctx.fillStyle='#94a3b8'; ctx.font='13px Segoe UI';
        ctx.fillText('Besiege Wellen von Feinden und levele deinen',W/2,H/2-40);
        ctx.fillText('Charakter dauerhaft auf!',W/2,H/2-22);
        if (char.level>1||char.total_kills>0) {
          ctx.fillStyle='rgba(168,85,247,.12)'; ctx.beginPath(); ctx.roundRect(W/2-95,H/2-4,190,54,8); ctx.fill();
          ctx.strokeStyle='rgba(168,85,247,.3)'; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(W/2-95,H/2-4,190,54,8); ctx.stroke();
          ctx.fillStyle='#e2e8f0'; ctx.font='bold 13px Segoe UI';
          ctx.fillText(`Level ${char.level}  ·  ${char.total_kills.toLocaleString()} Abschüsse`,W/2,H/2+18);
          ctx.fillStyle='#64748b'; ctx.font='11px Segoe UI';
          ctx.fillText(`Noch ${xpForLevel(char.level)-char.xp} XP bis Level ${char.level+1}`,W/2,H/2+36);
          if (char.skill_points>0) { ctx.fillStyle='#c084fc'; ctx.fillText(`⭐ ${char.skill_points} Skillpunkt${char.skill_points!==1?'e':''} wartend!`,W/2,H/2+52); }
        }
      }
      // Start button
      const p=.82+.18*Math.sin(Date.now()/280);
      ctx.fillStyle=`rgba(124,58,237,${p})`; ctx.beginPath(); ctx.roundRect(W/2-85,H/2+65,170,44,9); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 14px Segoe UI';
      ctx.fillText('▶   Spiel starten',W/2,H/2+92);
    }

    function draw() {
      ctx.fillStyle='#030712'; ctx.fillRect(0,0,W,H);
      if (stars) drawStars();
      for (const p of particles) { ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1;
      for (const e of enemies) drawEnemy(e);
      // Player bullets (laser)
      for (const b of bullets) {
        const g=ctx.createLinearGradient(b.x,b.y+12,b.x,b.y);
        g.addColorStop(0,'rgba(249,115,22,0)'); g.addColorStop(1,'#fef3c7');
        ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(b.x-1.5,b.y,3,12,1.5); ctx.fill();
      }
      // Enemy bullets
      for (const b of eBullets) {
        ctx.shadowColor='#ef4444'; ctx.shadowBlur=10;
        ctx.fillStyle='#fca5a5'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
      if (state==='playing'||state==='wave_end') { drawPlayer(); drawHUD(); }
      if (state==='idle') drawOverlay();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    buildStars(); loop();

    // ── Leaderboard ───────────────────────────────────────────────
    const MEDAL=['🥇','🥈','🥉'], MC=['gold','silver','bronze'];
    async function refreshLeaderboard() {
      const rows = await fetch('/api/game-char/leaderboard').then(r=>r.ok?r.json():[]).catch(()=>[]);
      const list = document.getElementById('lb-list');
      if (!rows.length) { list.innerHTML='<div class="lb-empty">Noch keine Einträge</div>'; return; }
      list.innerHTML = rows.map((r,i) => {
        const isMe = r.user_id===currentUserId;
        const av   = r.avatar?`https://cdn.discordapp.com/avatars/${r.discord_id}/${r.avatar}.png?size=32`:'';
        return `<div class="lb-row${isMe?' me':''}">
          <span class="lb-rank ${i<3?MC[i]:''}">${i<3?MEDAL[i]:(i+1)+'.'}</span>
          ${av?`<img class="lb-avatar" src="${av}" onerror="this.style.display='none'">`:'<div class="lb-avatar"></div>'}
          <span class="lb-name" style="${isMe?'color:#a855f7;font-weight:700':''}">${r.username}</span>
          <span class="lb-level">Lv.${r.level}</span>
          <span class="lb-kills">${r.total_kills.toLocaleString()} kills</span>
        </div>`;
      }).join('');
    }

    // ── Init ──────────────────────────────────────────────────────
    (async () => {
      const me = await fetch('/auth/me').then(r=>r.ok?r.json():null).catch(()=>null);
      if (me&&me.id) {
        currentUserId=me.id;
        try {
          const c = await fetch('/api/game-char').then(r=>r.ok?r.json():null);
          if (c) { char=c; document.getElementById('char-lv').textContent=char.level; }
        } catch(e) {}
      }
      syncLocalFromChar();
      refreshLeaderboard();
    })();
  </script>
</body>
</html>
