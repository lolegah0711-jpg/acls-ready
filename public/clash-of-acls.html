<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clash of ACLS</title>
<style>
  :root {
    --bg:#0b0f17; --card:#151b27; --card2:#1c2433; --line:#26303f; --txt:#e5e9f0; --mut:#8b97a9;
    --acc:#f97316; --good:#22c55e; --bad:#ef4444;
    --cell: clamp(19px, calc((100vw - 28px) / 17.2), 44px);
    --board: calc(var(--cell) * 12);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:radial-gradient(1100px 500px at 50% -80px, #141d30, var(--bg)); color:var(--txt); font-family:system-ui,Segoe UI,Roboto,sans-serif; overflow-x:hidden; min-height:100vh; }
  button { font-family:inherit; }

  /* ── HUD oben ── */
  #hud { position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:.45rem; padding:.5rem .6rem; background:linear-gradient(#0b0f17f2,#0b0f17cc); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #hud a.back { color:var(--mut); text-decoration:none; font-size:1rem; padding:.25rem .4rem; border-radius:8px; }
  #hud a.back:hover { color:var(--acc); }
  .res { display:flex; align-items:center; gap:.28rem; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:.22rem .55rem; font-size:.76rem; font-weight:700; white-space:nowrap; }
  .res .cap { color:var(--mut); font-weight:400; font-size:.65rem; }
  .hud-btn { width:34px; height:34px; border-radius:10px; background:var(--card); border:1px solid var(--line); color:var(--txt); font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; margin-left:auto; }
  .hud-btn + .hud-btn { margin-left:0; }
  .hud-btn:hover { border-color:var(--acc); }

  /* ── Toast ── */
  #msg { position:fixed; top:104px; left:50%; transform:translateX(-50%); z-index:120; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:.5rem .9rem; font-size:.85rem; box-shadow:0 8px 24px rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; text-align:center; }
  #msg.show { opacity:1; }
  #msg.ok { border-color:rgba(34,197,94,.5); color:var(--good); }
  #msg.err { border-color:rgba(239,68,68,.5); color:var(--bad); }

  /* ── Platzierungs-Banner ── */
  #placeBar { position:fixed; top:56px; left:50%; transform:translateX(-50%); z-index:70; display:none; align-items:center; gap:.6rem; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.45); border-radius:999px; padding:.4rem .5rem .4rem .9rem; font-size:.82rem; backdrop-filter:blur(6px); white-space:nowrap; }
  #placeBar.show { display:flex; }
  #placeBar button { background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:999px; padding:.25rem .7rem; font-size:.76rem; cursor:pointer; }

  /* ── Iso-Karte ── */
  #scene { position:relative; height:max(calc(var(--board) * 1.05), calc(100vh - 230px)); margin:.6rem 0 5.5rem; overflow:hidden; touch-action:none; cursor:grab; }
  #scene.dragging { cursor:grabbing; }
  /* WICHTIG: kein filter auf #board — Filter sind CSS-"grouping properties" und
     erzwingen transform-style:flat, was alle 3D-Gebäude plattdrücken würde.
     Der Insel-Schatten ist deshalb ein eigenes Element (#boardShadow). */
  #board { width:var(--board); height:var(--board); display:grid; grid-template-columns:repeat(12,1fr); grid-template-rows:repeat(12,1fr); gap:0; transform:rotateX(55deg) rotateZ(45deg); transform-style:preserve-3d; }
  #boardShadow { position:absolute; left:50%; top:50%; width:var(--board); height:var(--board); transform:translate(-50%,-50%) translateY(calc(var(--cell) * .55)) rotateX(55deg) rotateZ(45deg) scale(1.04); background:rgba(0,0,0,.5); filter:blur(13px); }
  /* Rasen im CoC-Stil: zwei Grüntöne im Schachbrett ("gemähter Rasen") */
  /* Achtung: NIE filter auf .tile (auch nicht bei :hover/Animation) — Filter
     flatten die 3D-Kinder. Hover/Pulse laufen deshalb über box-shadow. */
  .tile { position:relative; background:linear-gradient(135deg,#54964b,#487f40); box-shadow:inset 0 0 0 .5px rgba(35,64,30,.55); transform-style:preserve-3d; cursor:pointer; transition:box-shadow .15s; }
  .tile.alt { background:linear-gradient(135deg,#4c8a44,#41733a); }
  .tile:hover { box-shadow:inset 0 0 0 2px rgba(255,255,255,.35); }
  /* Gesperrter Bereich: dunkler Wald am Rand */
  .tile.locked { background:linear-gradient(135deg,#26421f,#1e3519); box-shadow:inset 0 0 0 .5px rgba(15,28,12,.7); cursor:default; }
  .tile.locked.alt { background:linear-gradient(135deg,#223c1c,#1a2f16); }
  .tile.locked:hover { box-shadow:inset 0 0 0 .5px rgba(15,28,12,.7); }
  .tile.sel { box-shadow:inset 0 0 0 2px var(--acc), 0 0 14px rgba(249,115,22,.45); }
  .tile.can-place { box-shadow:inset 0 0 0 2px #fde047; animation:placePulse 1.1s infinite; }
  @keyframes placePulse { 0%,100% { box-shadow:inset 0 0 0 2px #fde047; } 50% { box-shadow:inset 0 0 0 3px #fff7b3, inset 0 0 14px rgba(253,224,71,.55); } }
  /* ── Echte 3D-Gebäude: jedes Modell besteht aus mehreren Quadern (.p),
     jeder Quader = Dach (.pt) + 2 sichtbare Wände (.pr unten, .ps rechts).
     --pz = Sockelhöhe, --ph = Quaderhöhe, --pc = Farbe (alles × Zellgröße) ── */
  .bld, .dec { position:absolute; inset:0; transform-style:preserve-3d; pointer-events:none; }
  .p { position:absolute; transform-style:preserve-3d; }
  .pf { position:absolute; background-color:var(--pc); }
  .pt { inset:0; transform:translateZ(calc(var(--pz) + var(--ph))); box-shadow:inset 0 0 0 1px rgba(255,255,255,.13); }
  .pr { left:0; right:0; bottom:0; height:var(--ph); transform-origin:bottom; transform:translateZ(var(--pz)) rotateX(-90deg); filter:brightness(.68); }
  .ps { top:0; bottom:0; right:0; width:var(--ph); transform-origin:right; transform:translateZ(var(--pz)) rotateY(90deg); filter:brightness(.44); }
  /* Billboard über dem Dach: Level-Abzeichen / Baustellen-Icon / Fortschritt */
  .bb { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) translateZ(var(--bz,0px)) rotateZ(-45deg) rotateX(-55deg) translateY(-85%); display:flex; flex-direction:column; align-items:center; gap:2px; pointer-events:none; }
  .bb .lv { font-size:calc(var(--cell) * .26); font-weight:800; background:rgba(8,12,20,.92); border:1.5px solid #fbbf24; color:#fbbf24; border-radius:999px; padding:1px 7px; line-height:1.45; white-space:nowrap; box-shadow:0 2px 5px rgba(0,0,0,.5); }
  .bb .site-ic { font-size:calc(var(--cell) * .55); filter:drop-shadow(0 3px 3px rgba(0,0,0,.5)); line-height:1; }
  .bb .cwrap { width:calc(var(--cell) * 1.05); height:5px; background:rgba(0,0,0,.65); border-radius:99px; overflow:hidden; box-shadow:0 0 0 1px rgba(0,0,0,.4); }
  .bb .cfill { display:block; height:100%; background:linear-gradient(90deg,#f59e0b,#22c55e); width:0%; }
  .tile.busy .bb { animation:bounce 1.6s infinite; }
  @keyframes bounce {
    0%,100% { transform:translate(-50%,-50%) translateZ(var(--bz,0px)) rotateZ(-45deg) rotateX(-55deg) translateY(-85%); }
    50%     { transform:translate(-50%,-50%) translateZ(var(--bz,0px)) rotateZ(-45deg) rotateX(-55deg) translateY(-115%); }
  }

  /* ── Zoom-Steuerung ── */
  #world { position:relative; width:100%; height:100%; display:flex; justify-content:center; align-items:center; will-change:transform; }
  #zoomCtl { position:fixed; right:.95rem; bottom:5.8rem; z-index:60; display:flex; flex-direction:column; gap:.4rem; }
  #zoomCtl button { width:40px; height:40px; border-radius:11px; background:var(--card); border:1px solid var(--line); color:var(--txt); font-size:1.1rem; cursor:pointer; font-weight:800; box-shadow:0 4px 12px rgba(0,0,0,.35); }
  #zoomCtl button:hover { border-color:var(--acc); }

  /* ── Job-Chips unten links: Bauauftrag / Forschung / laufende Einsätze ── */
  #jobs { position:fixed; left:.7rem; bottom:.8rem; z-index:60; display:flex; flex-direction:column; gap:.45rem; max-width:66vw; }
  .jchip { display:flex; align-items:center; gap:.55rem; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:.5rem .7rem; box-shadow:0 8px 24px rgba(0,0,0,.45); }
  .jchip.click { cursor:pointer; }
  .jchip.click:hover { border-color:var(--acc); }
  .jchip .qi { font-size:1.35rem; }
  .jchip .qt { font-size:.72rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .jchip .cd { font-size:.72rem; color:var(--mut); font-variant-numeric:tabular-nums; }
  .jchip .qbar { width:80px; height:5px; background:#0d1622; border-radius:99px; overflow:hidden; margin-top:2px; }
  .jchip .qbar .cfill { display:block; height:100%; background:linear-gradient(90deg,#f59e0b,#22c55e); width:0%; }
  .jchip .spd { background:var(--acc); color:#1a0a00; border:0; border-radius:9px; padding:.35rem .5rem; font-weight:800; font-size:.72rem; cursor:pointer; }
  .sheet-select { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:.3rem; font-size:.74rem; max-width:140px; }

  /* ── Bauen-FAB ── */
  #buildBtn { position:fixed; right:.9rem; bottom:.9rem; z-index:60; width:58px; height:58px; border-radius:50%; background:linear-gradient(145deg,#fb923c,var(--acc)); color:#1a0a00; border:0; font-size:1.5rem; cursor:pointer; box-shadow:0 10px 26px rgba(249,115,22,.4); transition:transform .15s; }
  #buildBtn:hover { transform:scale(1.07); }
  #buildBtn.hidden { display:none; }

  /* ── Info-Panel (gewähltes Gebäude) mit Jetzt→Nach-Ausbau-Vergleich ── */
  #infoBar { position:fixed; left:0; right:0; bottom:0; z-index:65; display:none; flex-direction:column; gap:.5rem; background:var(--card); border-top:1px solid var(--line); border-radius:16px 16px 0 0; padding:.75rem .95rem calc(.75rem + env(safe-area-inset-bottom)); box-shadow:0 -10px 30px rgba(0,0,0,.55); max-height:52vh; overflow-y:auto; }
  #infoBar.show { display:flex; }
  .ihead { display:flex; align-items:center; gap:.65rem; padding-right:1.6rem; }
  .ihead .ii { font-size:2.1rem; filter:drop-shadow(0 3px 3px rgba(0,0,0,.5)); }
  .ihead .in { font-weight:800; font-size:.95rem; }
  .ihead .isub { color:var(--mut); font-size:.7rem; margin-top:.1rem; line-height:1.35; }
  .istats { display:flex; flex-direction:column; }
  .strow { display:flex; align-items:baseline; justify-content:space-between; gap:.8rem; font-size:.78rem; padding:.24rem 0; border-bottom:1px dashed var(--line); }
  .strow:last-child { border-bottom:0; }
  .strow .sl { color:var(--mut); }
  .strow .sv { font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .strow .arr { color:var(--mut); font-weight:400; margin:0 .3rem; }
  .strow .nx { color:var(--good); }
  .ibtns { display:flex; flex-direction:column; gap:.4rem; }
  .ibtns button { border:0; border-radius:11px; padding:.55rem .8rem; font-weight:800; font-size:.85rem; cursor:pointer; }
  .ibtns .up { background:var(--good); color:#04200f; display:flex; flex-direction:column; gap:.15rem; align-items:center; }
  .ibtns .up small { font-weight:700; font-size:.72rem; opacity:.85; }
  .ibtns .up:disabled { opacity:.45; cursor:default; }
  .ibtns .mk { background:var(--acc); color:#1a0a00; }
  #infoBar .cl { position:absolute; top:.5rem; right:.6rem; background:var(--card2); border:1px solid var(--line); color:var(--mut); font-size:.8rem; cursor:pointer; padding:.25rem .5rem; border-radius:8px; }

  /* ── Sheets (Baumenü / Mitarbeiter / Fuhrpark / Rangliste / Fertigung) ── */
  #backdrop { position:fixed; inset:0; z-index:75; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .2s; }
  #backdrop.show { opacity:1; pointer-events:auto; }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:80; background:var(--card); border-top:1px solid var(--line); border-radius:18px 18px 0 0; max-height:72vh; display:flex; flex-direction:column; transform:translateY(105%); transition:transform .25s; }
  #sheet.open { transform:none; }
  .sh-head { display:flex; align-items:center; gap:.6rem; padding:.85rem 1rem .6rem; border-bottom:1px solid var(--line); }
  .sh-title { font-weight:800; font-size:1rem; flex:1; }
  .sh-close { background:var(--card2); border:1px solid var(--line); color:var(--mut); border-radius:9px; padding:.3rem .65rem; cursor:pointer; font-size:.8rem; }
  .sh-body { overflow-y:auto; padding:.8rem 1rem calc(1rem + env(safe-area-inset-bottom)); }

  .cats { display:flex; gap:.4rem; flex-wrap:wrap; padding:.6rem 1rem 0; }
  .cat { padding:.28rem .7rem; border-radius:999px; background:var(--card2); border:1px solid var(--line); color:var(--mut); font-size:.74rem; cursor:pointer; }
  .cat.active { background:var(--acc); border-color:var(--acc); color:#1a0a00; font-weight:800; }

  .shop-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.6rem; }
  .shop-card { background:var(--card2); border:1px solid var(--line); border-radius:13px; padding:.7rem .6rem .6rem; text-align:center; cursor:pointer; transition:border-color .15s, transform .15s; position:relative; }
  .shop-card:hover { border-color:var(--acc); transform:translateY(-2px); }
  .shop-card.off { opacity:.45; cursor:default; }
  .shop-card.off:hover { border-color:var(--line); transform:none; }
  .shop-card .si { font-size:1.9rem; filter:drop-shadow(0 3px 3px rgba(0,0,0,.5)); }
  .shop-card .sn { font-weight:700; font-size:.8rem; margin-top:.25rem; }
  .shop-card .sc { display:flex; justify-content:center; gap:.4rem; flex-wrap:wrap; font-size:.7rem; margin-top:.35rem; font-weight:700; }
  .shop-card .sc .short { color:var(--bad); }
  .shop-card .st { color:var(--mut); font-size:.64rem; margin-top:.2rem; }
  .shop-card .cnt { position:absolute; top:.4rem; right:.5rem; font-size:.64rem; color:var(--mut); background:rgba(0,0,0,.4); border-radius:99px; padding:.05rem .4rem; }

  .row { display:flex; align-items:center; justify-content:space-between; gap:.6rem; background:var(--card2); border:1px solid var(--line); border-radius:11px; padding:.55rem .7rem; margin-bottom:.5rem; }
  .row .rl { display:flex; align-items:center; gap:.55rem; min-width:0; }
  .row .rl .ric { font-size:1.35rem; }
  .row .rl .rn { font-weight:700; font-size:.85rem; }
  .row .rl .rd { color:var(--mut); font-size:.7rem; }
  .row button { border:0; border-radius:8px; padding:.38rem .6rem; font-weight:700; font-size:.74rem; cursor:pointer; background:var(--acc); color:#1a0a00; white-space:nowrap; }
  .row button:disabled { opacity:.45; cursor:default; }
  .row button.ghost { background:var(--card); color:var(--txt); border:1px solid var(--line); }
  .row button.bad { background:var(--bad); color:#fff; }
  .lbrow { display:flex; justify-content:space-between; padding:.42rem .2rem; border-bottom:1px solid var(--line); font-size:.85rem; }
  .muted { color:var(--mut); font-size:.8rem; }

  /* ── Level-Chip im HUD (öffnet das Profil) ── */
  #lvlChip { display:flex; flex-direction:column; gap:2px; background:linear-gradient(145deg,#1d2a42,#151b27); border:1px solid #3b4c6b; border-radius:10px; padding:.22rem .5rem; cursor:pointer; min-width:64px; }
  #lvlChip:hover { border-color:var(--acc); }
  #lvlChip .lc-top { display:flex; align-items:center; gap:.3rem; font-size:.74rem; font-weight:800; white-space:nowrap; }
  #lvlChip .lc-bar { height:4px; background:#0d1622; border-radius:99px; overflow:hidden; }
  #lvlChip .lc-fill { display:block; height:100%; background:linear-gradient(90deg,#38bdf8,#818cf8); transition:width .6s; }
  .hud-btn { position:relative; }
  .hud-btn .dot { position:absolute; top:-3px; right:-3px; width:11px; height:11px; border-radius:50%; background:var(--bad); border:2px solid var(--bg); }
  #dailyBtn { border-color:#fbbf24; animation:dailyPulse 1.6s infinite; }
  @keyframes dailyPulse { 0%,100% { box-shadow:0 0 0 0 rgba(251,191,36,.45); } 50% { box-shadow:0 0 0 6px rgba(251,191,36,0); } }

  /* ── Himmel: Tag/Nacht-Tönung + Sterne + Wolken (Geschwister von #world —
     nie als Vorfahre des 3D-Boards, sonst würde ein Filter die 3D-Modelle flatten) ── */
  #skyTint { position:absolute; inset:0; pointer-events:none; z-index:5; transition:background 3s linear, opacity 3s linear; }
  #stars { position:absolute; inset:0; pointer-events:none; z-index:5; opacity:0; transition:opacity 3s linear;
    background-image:radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 34% 8%, #fff9, transparent),
      radial-gradient(1.5px 1.5px at 58% 14%, #fff, transparent), radial-gradient(1px 1px at 78% 6%, #fffb, transparent),
      radial-gradient(1px 1px at 90% 20%, #fff8, transparent), radial-gradient(1.5px 1.5px at 45% 4%, #fff, transparent),
      radial-gradient(1px 1px at 22% 9%, #fffa, transparent), radial-gradient(1px 1px at 67% 22%, #fff9, transparent); }
  .cloud { position:absolute; pointer-events:none; z-index:6; width:170px; height:44px; border-radius:99px; filter:blur(9px);
    background:rgba(255,255,255,.16); animation:cloudMove linear infinite; }
  .cloud::before { content:''; position:absolute; left:34px; top:-19px; width:80px; height:46px; border-radius:50%; background:rgba(255,255,255,.15); }
  @keyframes cloudMove { from { transform:translateX(-260px); } to { transform:translateX(calc(100vw + 260px)); } }

  /* ── Wettereffekt: Regen als eigenes Overlay (Geschwister von #world, kein
     Filter/Opacity auf #board/.tile — sonst greift die CSS-3D-Grouping-Falle) ── */
  #rain { position:absolute; inset:0; pointer-events:none; z-index:6; opacity:0; transition:opacity 2.5s linear;
    background-image:repeating-linear-gradient(107deg, transparent 0 5px, rgba(190,215,255,.32) 5px 6px, transparent 6px 60px);
    background-size:100% 140px; animation:rainFall .4s linear infinite; }
  #rain.on { opacity:.55; }
  @keyframes rainFall { from { background-position:0 0; } to { background-position:0 140px; } }
  @media (prefers-reduced-motion: reduce) {
    .cloud, #rain { animation:none !important; }
    #rain.on { opacity:.3; }
  }

  /* ── Schwebende Gewinn-Texte + Konfetti-Burst ── */
  .fgain { position:fixed; z-index:130; font-weight:800; font-size:.95rem; color:#fde047; text-shadow:0 2px 6px rgba(0,0,0,.7); pointer-events:none; animation:fgain 1.3s ease-out forwards; white-space:nowrap; }
  @keyframes fgain { 0% { opacity:0; transform:translateY(8px); } 15% { opacity:1; } 100% { opacity:0; transform:translateY(-52px); } }
  .burst { position:fixed; z-index:130; width:8px; height:8px; border-radius:2px; pointer-events:none; animation:burst .8s ease-out forwards; }
  @keyframes burst { 0% { opacity:1; transform:translate(0,0) rotate(0); } 100% { opacity:0; transform:translate(var(--dx),var(--dy)) rotate(240deg); } }

  /* ── Level-Up-Overlay ── */
  #lvlOverlay { position:fixed; inset:0; z-index:140; display:none; align-items:center; justify-content:center; background:rgba(5,8,14,.72); backdrop-filter:blur(4px); }
  #lvlOverlay.show { display:flex; }
  .lvl-card { background:linear-gradient(160deg,#1c2842,#12182a); border:1px solid #3b4c6b; border-radius:20px; padding:1.6rem 2.2rem; text-align:center; max-width:88vw; box-shadow:0 24px 70px rgba(0,0,0,.6), 0 0 50px rgba(129,140,248,.25); animation:lvlPop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes lvlPop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  .lvl-card .big { font-size:3rem; line-height:1; filter:drop-shadow(0 4px 10px rgba(251,191,36,.5)); }
  .lvl-card h2 { margin:.5rem 0 .2rem; font-size:1.25rem; }
  .lvl-card .ttl { color:#818cf8; font-weight:800; font-size:.9rem; margin-bottom:.6rem; }
  .lvl-card .rew { display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap; font-size:.85rem; font-weight:700; margin:.6rem 0 1rem; }
  .lvl-card button { background:linear-gradient(145deg,#fb923c,var(--acc)); color:#1a0a00; border:0; border-radius:12px; padding:.6rem 1.6rem; font-weight:800; font-size:.95rem; cursor:pointer; }

  /* ── Erfolgs-Toasts (oben rechts, gestapelt) ── */
  #toasts { position:fixed; top:60px; right:.8rem; z-index:125; display:flex; flex-direction:column; gap:.45rem; max-width:78vw; }
  .toast { display:flex; align-items:center; gap:.55rem; background:linear-gradient(145deg,#243046,#182034); border:1px solid #4b5c7e; border-radius:12px; padding:.55rem .8rem; box-shadow:0 10px 30px rgba(0,0,0,.5); animation:toastIn .35s ease-out; font-size:.8rem; }
  .toast.out { animation:toastOut .4s forwards; }
  @keyframes toastIn { from { transform:translateX(120%); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes toastOut { to { transform:translateX(120%); opacity:0; } }
  .toast .ti { font-size:1.4rem; }
  .toast .tt { font-weight:800; }
  .toast .td { color:var(--mut); font-size:.72rem; }

  /* ── Quests ── */
  .qrow { background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:.6rem .7rem; margin-bottom:.55rem; }
  .qrow.done { border-color:rgba(34,197,94,.5); }
  .qrow .qhead { display:flex; align-items:center; gap:.55rem; }

/* ── Soundsystem: synthetisierte WebAudio-Effekte, kein Asset nötig ── */
const SFX = (() => {
  let ctx = null, muted = localStorage.getItem('coa-mute') === '1';
  const ac = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  };
  function tone(freq, dur, type = 'sine', gain = .12, delay = 0, slideTo = 0) {
    if (muted) return;
    const a = ac(); if (!a) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(a.destination);
    o.start(t0); o.stop(t0 + dur + .05);
  }
  return {
    isMuted: () => muted,
    setMuted(v) { muted = v; localStorage.setItem('coa-mute', v ? '1' : '0'); },
    tap() { tone(660, .05, 'triangle', .06); },
    ok() { tone(520, .09, 'sine', .1); tone(784, .12, 'sine', .1, .07); },
    err() { tone(196, .2, 'sawtooth', .06); },
    coin() { tone(988, .07, 'square', .05); tone(1319, .11, 'square', .05, .06); },
    build() { tone(294, .1, 'triangle', .1); tone(392, .12, 'triangle', .1, .1); tone(523, .16, 'triangle', .1, .2); },
    levelup() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .11, i * .11)); },
    ach() { tone(880, .1, 'sine', .1); tone(1175, .18, 'sine', .1, .09); },
  };
})();
function toggleSound() {
  SFX.setMuted(!SFX.isMuted());
  $('sndBtn').textContent = SFX.isMuted() ? '🔇' : '🔊';
  if (!SFX.isMuted()) SFX.ok();
}

let lastPt = { x: innerWidth / 2, y: innerHeight / 2 };
document.addEventListener('pointerdown', e => { lastPt = { x: e.clientX, y: e.clientY }; }, true);
function floatGain(text, x = lastPt.x, y = lastPt.y) {
  const el = document.createElement('div');
  el.className = 'fgain'; el.textContent = text;
  el.style.left = Math.min(x, innerWidth - 90) + 'px'; el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1400);
}
const BURST_COLORS = ['#fbbf24', '#22c55e', '#38bdf8', '#f97316', '#e879f9'];
function burstAt(x, y, n = 14) {
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'burst';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.background = BURST_COLORS[i % BURST_COLORS.length];
    const ang = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 70;
    el.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    el.style.setProperty('--dy', (Math.sin(ang) * dist - 30) + 'px');

}
function toast(icon, title, sub) {

/* ── Wettereffekt: rein kosmetisch, deterministisch pro 20-Minuten-Fenster (kein
   echter Zufall bei jedem Tick — sonst würde der Regen ständig an/aus flackern) ── */
function applyWeather() {
  const slot = Math.floor(Date.now() / (20 * 60000));
  let x = (slot ^ 0x9e3779b9) >>> 0;
  x ^= x << 13; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
  const raining = (x / 4294967296) < 0.18; // ~18 % der Zeitfenster
  $('rain')?.classList.toggle('on', raining);
}
applyWeather();
setInterval(applyWeather, 60000);

/* ── Rendering ── */
function render(d) {
  const prev = st;
  st = d;
  // Countdown-Anker: Server liefert remaining_sec/total_sec, der Client zählt nur
  // lokal ab Empfangszeitpunkt herunter (kein Timestamp-Parsen, kein Uhren-Drift)
  st._now = Date.now();
  // Bau-fertig erkennen, solange die alte Baustellen-Kachel noch im DOM steht
  let donePos = null;
  if (prev && prev.activeBuild && (!d.activeBuild || d.activeBuild.id !== prev.activeBuild.id)) {
    const b = d.buildings.find(b => b.x === prev.activeBuild.x && b.y === prev.activeBuild.y && b.level >= prev.activeBuild.target_level);
    if (b) {
      const tile = document.querySelector(`.tile[data-x="${b.x}"][data-y="${b.y}"]`);
      const r = tile && tile.getBoundingClientRect();
      donePos = r && r.width ? { x: r.left + r.width / 2, y: r.top + r.height / 2 } : { x: innerWidth / 2, y: innerHeight / 2 };
    }
  }
  renderRes();
  renderHudExtras();
  renderBoard();
  renderJobs();
  if (selectedId !== null) renderInfoBar();
  if (sheetType) renderSheet();
  if (donePos) { burstAt(donePos.x, donePos.y, 16); SFX.build(); }
  if (prev && prev.progression && d.progression.level > prev.progression.level) showLevelUp(d.progression);
  if (prev && prev.achievements) {
    const had = new Set(prev.achievements.filter(a => a.unlocked).map(a => a.key));
    const fresh = d.achievements.filter(a => a.unlocked && !had.has(a.key));
    if (fresh.length) { fresh.forEach(a => toast(a.icon, 'Erfolg: ' + a.label, a.desc)); SFX.ach(); }
  }
  // Überfall aufgelöst → Kampfbericht-Toast
  if (prev && prev.activeRaid && !d.activeRaid && (d.raidReports || []).length) {
    const rep = d.raidReports[0];
    const rdef = CFG.RAIDS[rep.raid_key] || {};
    const lootStr = Object.entries(rep.loot || {}).map(([r, v]) => RES_ICON[r] + fmt(v)).join(' ');
    if (rep.won) {
      toast('🏆', 'Überfall gewonnen: ' + (rdef.label || ''), `Beute: ${lootStr}${(rep.lost || []).length ? ` · ${rep.lost.length} Verlust(e)` : ''}`);
      burstAt(innerWidth / 2, innerHeight / 3, 20);
      SFX.ach();
    } else {
      toast('💥', 'Überfall gescheitert: ' + (rdef.label || ''), `${(rep.lost || []).length} Einheit(en) verloren — stärkerer Trupp nötig!`);
      SFX.err();
    }
  }
  // Liga-Auf-/Abstieg seit letztem Poll (wöchentlicher Rollover kann bei jedem
  // Request passieren, nicht nur direkt nach einer Aktion)
  if (prev && prev.league && d.league.tier !== prev.league.tier) {
    if (d.league.tier > prev.league.tier) {
      toast(d.league.icon, 'Aufstieg in die ' + d.league.label + '-Liga!', 'Weiter so — nächste Woche geht es weiter.');
      burstAt(innerWidth / 2, innerHeight / 3, 18);
      SFX.levelup();
    } else {
      toast(d.league.icon, 'Abstieg in die ' + d.league.label + '-Liga', 'Sammle diese Woche wieder Punkte für den Wiederaufstieg.');
    }
  }
  // Neuer PvP-Angriff gegen mich seit letztem Poll (id-Vergleich, damit es nur einmal auffällt)
  if (prev && d.pvp && (d.pvp.attacksReceived[0]?.id) && d.pvp.attacksReceived[0].id !== prev.pvp?.attacksReceived[0]?.id) {
    const r = d.pvp.attacksReceived[0];
    if (r.won) toast('🚨', 'Du wurdest angegriffen!', `${r.attacker_name || '?'} hat gewonnen — kleine Verluste im Lager.`);
    else toast('🛡️', 'Angriff abgewehrt!', `${r.attacker_name || '?'} ist gescheitert — dein Werkschutz hat gehalten.`);
    SFX[r.won ? 'err' : 'ach']();
  }
}

function renderRes() {

}

function renderBoard() {
  const built = new Map(st.buildings.map(b => [b.x + ',' + b.y, b]));
  const manuByBuilding = new Map((st.activeManufacture || []).map(m => [m.building_id, m]));
  const html = [];
  for (let y = 0; y < CFG.GRID.H; y++) for (let x = 0; x < CFG.GRID.W; x++) {
    const unlocked = CFG.cellIndex(x, y) < st.unlockedCells;
    const b = built.get(x + ',' + y);
    const cls = ['tile'];
    if ((x + y) % 2) cls.push('alt');
    if (!unlocked) cls.push('locked');
    let inner = '';
    if (!unlocked) {
      // deterministische Wald-Deko (Voxel-Bäume/Felsen), sieht bei jedem Rendern gleich aus
      const seed = (x * 31 + y * 17 + 7) % 10;
      if (seed === 0) inner = `<div class="dec">${parts3d(BUILD3D.dekoration)}</div>`;
      else if (seed < 3) inner = `<div class="dec">${parts3d(TREE_S)}</div>`;
      else if (seed === 3) inner = `<div class="dec">${parts3d(ROCK3D)}</div>`;
    }
    if (b) {
      const constructing = st.activeBuild && st.activeBuild.x === x && st.activeBuild.y === y;
      const manu = manuByBuilding.get(b.id);
      if (constructing || manu) cls.push('busy');
      if (b.id === selectedId) cls.push('sel');
      const site = b.level < 1;
      const spec = site ? SITE3D : (BUILD3D[b.building_key] || BUILD3D.storage);
      const job = constructing ? st.activeBuild : manu;
      const jobAttrs = job ? ` data-e="${st._now + job.remaining_sec * 1000}" data-t="${job.total_sec * 1000}"` : '';
      inner = `<div class="bld">${parts3d(spec)}</div>` +
        `<div class="bb" style="--bz:calc(var(--cell)*${spec.H})">` +
        (site ? `<span class="site-ic">🚧</span>` : `<span class="lv">${CFG.BUILDINGS[b.building_key].icon} ${b.level}</span>`) +
        (job ? `<span class="cwrap"><i class="cfill"${jobAttrs}></i></span>` : '') +
        `</div>`;
    } else if (unlocked && placing) {
      cls.push('can-place');
    }
    html.push(`<div class="${cls.join(' ')}" data-x="${x}" data-y="${y}">${inner}</div>`);
  }
  $('board').innerHTML = html.join('');
  tickProgress();
}

/* ── Zoom & Pan: Mausrad/Pinch zoomen, Ziehen verschiebt die Karte ── */
let zoom = 1, panX = 0, panY = 0, suppressClick = false;
const applyView = () => { $('world').style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`; };
function setZoom(z, cx, cy) {
  z = Math.min(2.6, Math.max(.55, z));
  if (cx !== undefined) {
    // auf den Cursor/Pinch-Mittelpunkt zu zoomen
    const r = $('scene').getBoundingClientRect();
    const ox = cx - r.left - r.width / 2, oy = cy - r.top - r.height / 2;
    panX = ox - (ox - panX) * (z / zoom);
    panY = oy - (oy - panY) * (z / zoom);
  }
  zoom = z; applyView();
}
function zoomBy(f) { setZoom(zoom * f); }
function resetView() { zoom = 1; panX = 0; panY = 0; applyView(); }
(() => {
  const scene = $('scene');
  const pts = new Map();
  let pinch0 = null, moved = false;
  const pinchDist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  const pinchMid = () => { const [a, b] = [...pts.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
  scene.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY); }, { passive: false });
  scene.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    // WICHTIG: erst bei echtem Ziehen capturen — Pointer-Capture ab pointerdown
    // würde alle Klicks auf #scene umleiten und die Kacheln unklickbar machen
    if (pts.size === 2) { pinch0 = { d: pinchDist(), z: zoom }; try { scene.setPointerCapture(e.pointerId); } catch {} }
    else moved = false;
  });
  scene.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && pinch0) {
      const m = pinchMid();
      setZoom(pinch0.z * pinchDist() / pinch0.d, m.x, m.y);
    } else if (pts.size === 1 && e.buttons) {
      const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      if (!moved && Math.abs(dx) + Math.abs(dy) > 3) {
        moved = true; scene.classList.add('dragging');
        try { scene.setPointerCapture(e.pointerId); } catch {}
      }
      if (moved) { panX += dx; panY += dy; applyView(); }
    }
  });
  const end = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch0 = null;
    if (pts.size === 0) { scene.classList.remove('dragging'); if (moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 80); } }
  };
  scene.addEventListener('pointerup', end);
  scene.addEventListener('pointercancel', end);
})();

$('board').addEventListener('click', e => {
  if (suppressClick) return;
  const t = e.target.closest('.tile');
  if (!t || !st) return;
  const x = +t.dataset.x, y = +t.dataset.y;
  const unlocked = CFG.cellIndex(x, y) < st.unlockedCells;
  const b = st.buildings.find(b => b.x === x && b.y === y);
  if (placing) {
    if (!unlocked) return msg('Dieser Bauplatz ist noch gesperrt — Büro ausbauen!');
    if (b) return msg('Hier steht schon ein Gebäude.');
    return place(placing, x, y);
  }
  if (b) { selectedId = b.id; renderBoard(); renderInfoBar(); return; }

// Alle Countdown-Texte generisch aktualisieren (Elemente mit data-cde = End-Zeitstempel)
function tickCdEls() {
  document.querySelectorAll('[data-cde]').forEach(el => {
    const left = +el.dataset.cde - Date.now();
    el.textContent = left <= 0 ? 'Wird abgeschlossen…' : 'Noch ' + fmtDur(left / 1000);
  });
}

/* ── Info-Panel mit Jetzt→Nach-Ausbau-Vergleich ── */
// Liefert [Label, Wert]-Paare für ein Level — identische Struktur über alle Level,
// damit Jetzt- und Nachher-Werte zeilenweise verglichen werden können.
function statPairs(def, lvl) {
  const e = def.effect || {}; const out = [];
  if (e.perHour) Object.entries(e.perHour(lvl)).forEach(([r, v]) => out.push([`${RES_ICON[r]} ${RES_NAME[r]} pro Stunde`, '+' + fmt(v)]));
  if (e.capBonus) Object.entries(e.capBonus(lvl)).forEach(([r, v]) => out.push([`${RES_ICON[r]} Lagerplatz ${RES_NAME[r]}`, '+' + fmt(v)]));
  if (e.unlockedCells) out.push(['🗺️ Freigeschaltete Bauplätze', e.unlockedCells(lvl)]);
  if (e.otherMaxLevel) out.push(['⬆️ Max-Level anderer Gebäude', e.otherMaxLevel(lvl)]);
  if (e.unlockedTier) out.push(['🚗 Fahrzeug-Tier', e.unlockedTier(lvl)]);
  if (e.manufactureTimeSec) out.push(['⏱ Fertigungszeit pro Fahrzeug', fmtDur(e.manufactureTimeSec(lvl))]);
  if (e.sellValuePct) out.push(['💰 Fahrzeug-Verkaufswert', '+' + e.sellValuePct(lvl) + '%']);
  if (e.sellBonusPct) out.push(['🤝 Verkaufsbonus', '+' + e.sellBonusPct(lvl) + '%']);
  if (e.rarityBonusPct) out.push(['✨ Wert neuer Fahrzeuge', '+' + e.rarityBonusPct(lvl) + '%']);
  if (e.globalProdPct) out.push(['⚡ Gesamtproduktion', '+' + e.globalProdPct(lvl) + '%']);
  if (e.employeeSlots) out.push(['👷 Mitarbeiter-Slots', '+' + e.employeeSlots(lvl)]);
  if (e.vehicleSlots) out.push(['🅿️ Stellplätze', e.vehicleSlots(lvl)]);
  if (e.missionSlots) out.push(['🚨 Einsatz-Slots', e.missionSlots(lvl)]);
  if (e.researchSpeedPct) out.push(['🔬 Forschungstempo', '+' + e.researchSpeedPct(lvl) + '%']);
  if (e.unitCap) out.push(['💂 Trupp-Kapazität', e.unitCap(lvl)]);
  if (e.unlockedUnitTier) out.push(['⚔️ Einheiten-Tier', e.unlockedUnitTier(lvl)]);
  return out;
}

function renderInfoBar() {
  const b = st.buildings.find(b => b.id === selectedId);
  if (!b) return deselect();
  const def = CFG.BUILDINGS[b.building_key];
  $('infoBar').classList.add('show');
  $('buildBtn').classList.add('hidden');
  $('iIcon').textContent = b.level < 1 ? '🚧' : def.icon;
  $('iName').textContent = bLabel(b.building_key, b.level) + (b.level >= 1 ? ` — Level ${b.level}` : ' — im Bau');
  $('iSub').textContent = def.desc;
  if (b.level < 1) {
    const cd = st.activeBuild ? cdAttr(st.activeBuild) : '';
    $('iStats').innerHTML = `<div class="strow"><span class="sl">🚧 Baustelle</span><span class="sv" id="iCd" ${cd}></span></div>`;
    $('iBtns').innerHTML = '';
    tickCdEls();
    return;
  }
  const isMax = b.level >= def.maxLevel;
  const now = statPairs(def, b.level);
  const nxt = isMax ? null : statPairs(def, b.level + 1);
  $('iStats').innerHTML = now.length
    ? now.map((p, i) => `<div class="strow"><span class="sl">${p[0]}</span><span class="sv">${p[1]}${nxt && String(nxt[i][1]) !== String(p[1]) ? `<i class="arr">→</i><span class="nx">${nxt[i][1]}</span>` : ''}</span></div>`).join('')
    : '<div class="strow"><span class="sl">Rein dekorativ — macht dein Gelände schöner.</span></div>';
  const btns = [];
  if (isMax) {
    btns.push('<div class="muted" style="text-align:center">✔ Maximales Level erreicht</div>');
  } else {
    const next = b.level + 1;
    const officeCap = CFG.BUILDINGS.office.effect.otherMaxLevel(Math.max(1, st.officeLevel));
    const gated = b.building_key !== 'office' && next > officeCap;
    const cost = mCost(def.cost(next));
    const dis = st.activeBuild || gated || !canAfford(cost);
    const costStr = Object.entries(cost).filter(([, a]) => a > 0).map(([r, a]) => RES_ICON[r] + fmt(a)).join('  ');
    btns.push(`<button class="up" ${dis ? 'disabled' : ''} onclick="upgrade(${b.id})">⬆ Auf Level ${next} ausbauen<small>Kosten: ${costStr} · Dauer: ⏱ ${fmtDur(mTime(def.buildTimeSec(next)))}</small></button>`);
    const hint = st.activeBuild ? '🚧 Der Bautrupp ist gerade beschäftigt.' : gated ? `🏢 Benötigt ein höheres Büro-Level (aktuell max. Lv ${officeCap}).` : !canAfford(cost) ? 'Nicht genug Ressourcen.' : '';
    if (hint) btns.push(`<div class="muted" style="text-align:center">${hint}</div>`);
  }
  if (b.building_key === 'garage') btns.push(`<button class="mk" onclick="openSheet('manu', ${b.id})">🚗 Fahrzeuge fertigen</button>`);
  if (b.building_key === 'towyard') btns.push(`<button class="mk" onclick="openSheet('missions')">🚨 Einsätze</button>`);
  if (b.building_key === 'forschungszentrum') btns.push(`<button class="mk" onclick="openSheet('research')">🔬 Forschung</button>`);
  if (b.building_key === 'sicherheitszentrale') btns.push(`<button class="mk" onclick="openSheet('army')">🛡️ Werkschutz & Überfälle</button>`);
  if (b.building_key === 'office' && (st.prestige.eligible || st.prestige.resets > 0)) btns.push(`<button class="mk" style="background:linear-gradient(145deg,#c084fc,#a855f7);color:#fff" onclick="openSheet('prestige')">🔁 Prestige</button>`);
  $('iBtns').innerHTML = btns.join('');
}

      ${lw.claimable

async function donateClan() {
  const resource = $('donateRes').value;
  const amount = Math.round(Number($('donateAmt').value));
  if (!amount || amount <= 0) return msg('Gib eine gültige Menge ein');
  try {
    const d = await api('/api/clash-of-acls/clan/donate', { method:'POST', body:{ resource, amount } });
    SFX.coin();
    $('donateAmt').value = '';
    msg(`Gespendet! +${d.points} Gildenpunkte`, true);
    render(d);
  } catch (e) { msg(e.message); }
}
async function claimClanWar() {
  try {
    const d = await api('/api/clash-of-acls/clan/war-claim', { method:'POST' });
    SFX.coin();
    floatGain(Object.entries(d.reward).map(([r, v]) => RES_ICON[r] + fmt(v)).join(' '));
    toast('🏆', d.tier + '-Stufe erreicht!', 'Gildenkriegs-Belohnung abgeholt.');
    render(d);
  } catch (e) { msg(e.message); }
}

/* ── PvP: Ziele finden, Trupp wählen, angreifen, Berichte einsehen ── */
let pvpTargets = null, pvpSel = new Set(), pvpTab = 'made';
async function loadPvpTargets() {
  try { pvpTargets = await api('/api/clash-of-acls/pvp/targets'); }
  catch (e) { pvpTargets = []; }
  if (sheetType === 'pvp') renderPvp();
}
function refreshPvpTargets() { pvpTargets = null; renderPvp(); }
function togglePvpSel(id) { pvpSel.has(id) ? pvpSel.delete(id) : pvpSel.add(id); renderPvp(); }
function pvpTabSwitch(t) { pvpTab = t; renderPvp(); }

function pvpReportRow(r, mine) {
  const won = mine ? r.won : !r.won; // aus MEINER Sicht: bei "gegen mich" ist mein Erfolg = Angreifer verlor
  const opp = mine ? r.defender_name : r.attacker_name;
  const lostMine = mine ? r.atk_lost : r.def_lost;
  const lootStr = Object.entries(r.loot || {}).filter(([, v]) => v > 0).map(([res, v]) => RES_ICON[res] + fmt(v)).join(' ') || '—';
  const lostStr = (lostMine || []).map(k => CFG.UNITS[k]?.icon || '💂').join('') || 'keine';
  return `<div class="pvp-report ${won ? 'won' : 'lost'}">
    <div class="pr-head"><span>${mine ? (r.won ? '🏆' : '💥') : (r.won ? '🚨' : '🛡️')}</span>
      <span>${mine ? (r.won ? 'Sieg gegen' : 'Niederlage gegen') : (r.won ? 'Angegriffen von' : 'Verteidigt gegen')} ${esc(opp || '?')}</span></div>
    <div class="pr-meta">⚔️ ${r.atk_power} vs. 🛡️ ${r.def_power} · Chance ${r.chance}% · ${mine && r.won ? 'Beute ' + lootStr + ' · ' : ''}Verluste: ${lostStr}</div>
  </div>`;
}

function renderPvp() {
  if (pvpTargets === null) { $('shBody').innerHTML = '<div class="muted">Lädt Ziele…</div>'; loadPvpTargets(); return; }
  const p = st.pvp;
  const myUnits = (st.units || []).filter(u => !u.raid_id);
  pvpSel = new Set([...pvpSel].filter(id => myUnits.some(u => u.id === id)));
  const selAtk = myUnits.reduce((s, u) => s + (pvpSel.has(u.id) ? (CFG.UNITS[u.unit_key]?.atk || 0) : 0), 0);

  let html = '';
  if (p.shieldRemainingSec > 0) {
    html += `<div class="pvp-shield"><span style="font-size:1.4rem">🛡️</span><div>Du stehst unter Schutz — niemand kann dich angreifen. Noch <b>${fmtDur(p.shieldRemainingSec)}</b>.</div></div>`;
  }
  html += `<div class="pvp-limit"><span>Angriffe heute: <b style="color:var(--txt)">${p.attacksToday}/${p.attacksLimit}</b></span><span>🛡️ Deine Verteidigung: <b style="color:var(--txt)">${p.defensePower}</b></span></div>`;

  if (st.security.level < 1) {
    html += '<div class="muted">🛡️ Baue zuerst eine Sicherheitszentrale, um Angriffe starten zu können.</div>';
  } else {
    html += `<div style="font-weight:800;margin-bottom:.45rem">⚔️ Trupp wählen <span class="rd" style="font-weight:400;color:var(--mut)">· Stärke: <b style="color:var(--acc)">${selAtk}</b></span></div>`;
    if (!myUnits.length) {
      html += '<div class="muted" style="margin-bottom:.7rem">Keine verfügbaren Einheiten — bilde welche in der Sicherheitszentrale aus oder warte, bis sie von einem Überfall zurück sind.</div>';
    } else {
      html += '<div style="margin-bottom:.7rem">' + myUnits.map(u => {
        const d = CFG.UNITS[u.unit_key] || {};
        return `<div class="row"><div class="rl"><span class="ric">${d.icon || '💂'}</span><div><div class="rn">${esc(d.label || u.unit_key)}</div><div class="rd">⚔️ ${d.atk} · 🛡️ ${d.def}</div></div></div>
          <input type="checkbox" style="width:19px;height:19px;accent-color:var(--acc);cursor:pointer" ${pvpSel.has(u.id) ? 'checked' : ''} onchange="togglePvpSel(${u.id})"></div>`;
      }).join('') + '</div>';
    }

    html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.45rem"><span style="font-weight:800">🎯 Mögliche Ziele</span><button style="background:var(--card2);color:var(--acc);border:1px solid var(--line);border-radius:8px;padding:.3rem .6rem;font-size:.72rem;font-weight:700;cursor:pointer" onclick="refreshPvpTargets()">🔄 Neu suchen</button></div>`;
    if (!pvpTargets.length) {
      html += '<div class="muted">Gerade keine passenden Ziele in deiner Levelspanne gefunden — versuch es später erneut.</div>';
    } else {
      html += pvpTargets.map(t => {
        const chance = Math.round(CFG.COMBAT.winChance(selAtk, t.def_power) * 100);
        const col = chance >= 70 ? 'var(--good)' : chance >= 40 ? '#fbbf24' : 'var(--bad)';
        const dis = !pvpSel.size || p.attacksToday >= p.attacksLimit;
        return `<div class="pvp-target">
          <div class="pt-head"><span class="pt-ava">🧑‍🔧</span><div><div class="pt-name">${esc(t.username || '?')}</div><div class="pt-lvl">⭐ Level ${t.level} · 🛡️ Verteidigung ${t.def_power}</div></div>
          <span class="pt-chance" style="color:${col}">${pvpSel.size ? chance + '%' : '—'}</span></div>
          <button ${dis ? 'disabled' : ''} onclick="attackPvp('${t.discord_id}')">⚔️ Angreifen</button>
        </div>`;
      }).join('');
    }
  }

  html += `<div class="pvp-tabs"><button class="${pvpTab === 'made' ? 'active' : ''}" onclick="pvpTabSwitch('made')">Meine Angriffe</button><button class="${pvpTab === 'received' ? 'active' : ''}" onclick="pvpTabSwitch('received')">Gegen mich</button></div>`;
  const list = pvpTab === 'made' ? p.attacksMade : p.attacksReceived;
  html += list.length ? list.map(r => pvpReportRow(r, pvpTab === 'made')).join('') : '<div class="muted">Noch keine Einträge.</div>';

  $('shBody').innerHTML = html;
}
async function attackPvp(defenderId) {
  if (!pvpSel.size) return msg('Wähle zuerst Einheiten für den Angriff');
  try {
    const d = await api('/api/clash-of-acls/pvp-attack', { method:'POST', body:{ defender_id: defenderId, unit_ids: [...pvpSel] } });
    pvpSel.clear();
    pvpTargets = (pvpTargets || []).filter(t => t.discord_id !== defenderId);
    const lootStr = Object.entries(d.loot || {}).filter(([, v]) => v > 0).map(([r, v]) => RES_ICON[r] + fmt(v)).join(' ');
    if (d.won) {
      toast('🏆', 'Angriff erfolgreich!', `Beute: ${lootStr || '—'}${d.atkLost.length ? ' · ' + d.atkLost.length + ' Verlust(e)' : ''}`);
      if (lootStr) floatGain('+' + lootStr);
      burstAt(innerWidth / 2, innerHeight / 3, 18);
      SFX.ach();
    } else {
      toast('💥', 'Angriff gescheitert', `${d.atkLost.length} Einheit(en) verloren — stärkerer Trupp nötig!`);
      SFX.err();
    }
    render(d);
  } catch (e) { msg(e.message); }
}

/* ── Kampagne / Questline: geführte, erzählte Aufgabenreihe quer durchs Spiel ── */
function renderCampaign() {
  const camp = st.campaign;
  // erster nicht abgeholter Schritt über alle Kapitel hinweg = "nächstes Ziel"
  let next = null;
  for (const ch of camp.chapters) { next = ch.steps.find(s => !s.claimed); if (next) break; }

  let html = `<div class="camp-progress-all"><span>${camp.claimedCount}/${camp.total}</span><div class="cpa-bar"><i style="width:${camp.claimedCount / camp.total * 100}%"></i></div></div>`;

  if (next) {
    html += `<div class="camp-next"><span class="cn-ic">${next.icon}</span><div><div class="cn-l">${next.claimable ? 'Bereit zum Abholen' : 'Nächstes Ziel'}</div><div class="cn-t">${esc(next.title)} — ${esc(next.desc)}</div></div></div>`;
  } else {
    html += `<div class="camp-next"><span class="cn-ic">👑</span><div><div class="cn-l">Kampagne abgeschlossen</div><div class="cn-t">Du hast die Legende von ACLS geschrieben!</div></div></div>`;
  }

  html += camp.chapters.map(ch => {
    const done = ch.steps.filter(s => s.claimed).length;
    const chLocked = done === 0 && ch.steps.every(s => !s.claimable);
    const steps = ch.steps.map(s => {
      const cls = s.claimed ? 'claimed' : s.claimable ? 'claimable' : '';
      const rew = Object.entries(s.reward).map(([r, v]) => RES_ICON[r] + fmt(v)).join(' ');
      const action = s.claimed
        ? '<span style="color:var(--good);font-size:1.1rem">✔</span>'
        : `<button ${s.claimable ? '' : 'disabled'} onclick="claimCampaign('${s.key}')">Abholen</button>`;
      return `<div class="camp-step ${cls}${s.final ? ' final' : ''}">
        <span class="cs-ic">${s.icon}</span>
        <div class="cs-body"><div class="cs-t">${esc(s.title)}</div><div class="cs-d">${esc(s.desc)}</div>
          <div class="cs-track"><i style="width:${Math.min(100, s.progress / s.target * 100)}%"></i></div>
          <div class="cs-rew">${fmt(s.progress)}/${fmt(s.target)} · 🎁 ${rew}${s.xp ? ' · ✨' + s.xp + ' XP' : ''}</div>
        </div>${action}</div>`;
    }).join('');
    return `<div class="camp-chapter ${chLocked ? 'locked' : ''}">
      <div class="ch-head"><span class="ch-ic">${ch.icon}</span><div><div class="ch-title">${esc(ch.title)} <span class="muted" style="font-weight:400">· ${done}/${ch.steps.length}</span></div><div class="ch-flavor">${esc(ch.flavor)}</div></div></div>
      <div class="camp-steps">${steps}</div>
    </div>`;
  }).join('');

  $('shBody').innerHTML = html;
}
async function claimCampaign(key) {
  try {
    const d = await api('/api/clash-of-acls/campaign-claim', { method:'POST', body:{ step_key: key } });
    SFX.coin();
    floatGain('+✨' + (d.xp || 0) + ' XP ' + Object.entries(d.reward).map(([r, v]) => RES_ICON[r] + fmt(v)).join(' '));
    if (d.final) {
      toast('👑', 'Kampagne abgeschlossen!', 'Du hast die Legende von ACLS geschrieben.');
      burstAt(innerWidth / 2, innerHeight / 2 - 60, 30);
      SFX.levelup();
    } else {
      msg('Kampagnenschritt abgeschlossen!', true);
    }
    render(d);
  } catch (e) { msg(e.message); }
}

/* ── Werkschutz: Ausbildung, Trupp-Auswahl, Überfälle, Kampfberichte ── */
let raidSel = new Set();
function toggleUnitSel(id) {
  raidSel.has(id) ? raidSel.delete(id) : raidSel.add(id);
  renderArmy();
}
function renderArmy() {
  const sec = st.security;
  if (sec.level < 1) {
    $('shBody').innerHTML = '<div class="muted">🛡️ Baue zuerst eine <b>Sicherheitszentrale</b> (Baumenü → Spezial), um Werkschutz-Einheiten auszubilden und NPC-Banden zu überfallen.</div>';
    return;
  }
  const units = st.units || [];
  const freeIds = new Set(units.filter(u => !u.raid_id).map(u => u.id));
  raidSel = new Set([...raidSel].filter(id => freeIds.has(id)));
  const selAtk = units.reduce((s, u) => s + (raidSel.has(u.id) ? (CFG.UNITS[u.unit_key]?.atk || 0) : 0), 0);

  let html = `<div class="muted">Zentrale Level <b>${sec.level}</b> · Trupp: <b>${units.length}/${sec.unitCap}</b> · Einheiten bis Tier <b>${sec.unlockedUnitTier}</b> — mehr durch Ausbau der Zentrale.</div>`;

  // Laufende Ausbildung
  if (st.activeTraining) {
    const u = CFG.UNITS[st.activeTraining.unit_key] || {};
    html += `<div class="row" style="margin-top:.6rem"><div class="rl"><span class="ric">${u.icon || '💂'}</span><div><div class="rn">${esc(u.label || '')} wird ausgebildet…</div><div class="rd" ${cdAttr(st.activeTraining)}></div></div></div></div>`;
  }

  // Ausbildung
  html += '<div style="font-weight:800;margin:.75rem 0 .45rem">💂 Einheiten ausbilden</div>';
  html += Object.entries(CFG.UNITS).map(([k, u]) => {
    const locked = u.tier > sec.unlockedUnitTier;
    const full = units.length >= sec.unitCap;
    const dis = locked || full || st.activeTraining || !canAfford(u.cost);
    return `<div class="row" style="${locked ? 'opacity:.45' : ''}"><div class="rl"><span class="ric">${u.icon}</span><div>
      <div class="rn">${esc(u.label)} <span class="rd">· ⚔️ ${u.atk} · 🛡️ ${u.def} · Tier ${u.tier}</span></div>
      <div class="rd">${esc(u.desc)}</div>
      <div class="rd">${costHtml(u.cost)} · ⏱ ${fmtDur(u.trainTimeSec)}${locked ? ' · 🔒 Zentrale Lv ' + (u.tier * 3 - 2) + '+' : ''}</div>
    </div></div>
    <button ${dis ? 'disabled' : ''} onclick="train('${k}')">Ausbilden</button></div>`;
  }).join('');

  // Trupp zusammenstellen
  html += `<div style="font-weight:800;margin:.75rem 0 .45rem">⚔️ Trupp für den nächsten Überfall <span class="rd" style="font-weight:400">· gewählte Stärke: <b style="color:var(--acc)">⚔️ ${selAtk}</b></span></div>`;
  if (!units.length) {
    html += '<div class="muted">Noch keine Einheiten — bilde zuerst welche aus.</div>';
  } else {
    html += units.map(u => {
      const d = CFG.UNITS[u.unit_key] || {};
      if (u.raid_id) {
        return `<div class="row" style="opacity:.55"><div class="rl"><span class="ric">${d.icon || '💂'}</span><div><div class="rn">${esc(d.label || u.unit_key)}</div><div class="rd">🛡️ im Einsatz</div></div></div></div>`;
      }
      return `<div class="row"><div class="rl"><span class="ric">${d.icon || '💂'}</span><div><div class="rn">${esc(d.label || u.unit_key)}</div><div class="rd">⚔️ ${d.atk} · 🛡️ ${d.def}</div></div></div>
        <input type="checkbox" style="width:19px;height:19px;accent-color:var(--acc);cursor:pointer" ${raidSel.has(u.id) ? 'checked' : ''} onchange="toggleUnitSel(${u.id})"></div>`;
    }).join('');
  }

  // Aktiver Überfall
  if (st.activeRaid) {
    const d = CFG.RAIDS[st.activeRaid.raid_key] || {};
    html += `<div class="row" style="border-color:rgba(249,115,22,.5);margin-top:.7rem"><div class="rl"><span class="ric">${d.icon || '🛡️'}</span><div><div class="rn">Überfall läuft: ${esc(d.label || '')}</div><div class="rd" ${cdAttr(st.activeRaid)}></div></div></div></div>`;
  }

  // Ziele
  html += '<div style="font-weight:800;margin:.75rem 0 .45rem">🏴 Ziele</div>';
  html += Object.entries(CFG.RAIDS).map(([k, d]) => {
    const p = Math.round(CFG.COMBAT.winChance(selAtk, d.power) * 100);
    const col = p >= 70 ? 'var(--good)' : p >= 40 ? '#fbbf24' : 'var(--bad)';
    const loot = Object.entries(d.loot).map(([r, v]) => RES_ICON[r] + fmt(v)).join(' ');
    const dis = !raidSel.size || st.activeRaid;
    return `<div class="row" style="flex-wrap:wrap"><div class="rl"><span class="ric">${d.icon}</span><div>
      <div class="rn">${esc(d.label)} <span class="rd">· Stärke ${d.power} · ⏱ ${fmtDur(d.durationSec)}</span></div>
      <div class="rd">${esc(d.desc)}</div>
      <div class="rd">🎁 ${loot} · ✨${d.xp} XP</div>
    </div></div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <span style="font-weight:800;color:${col};font-size:.82rem" title="Siegchance mit gewähltem Trupp">${raidSel.size ? p + ' %' : '—'}</span>
      <button ${dis ? 'disabled' : ''} onclick="startRaid('${k}')">Angriff</button>
    </div></div>`;
  }).join('');

  // Kampfberichte
  if ((st.raidReports || []).length) {
    html += '<div style="font-weight:800;margin:.75rem 0 .45rem">📜 Letzte Kampfberichte</div>';
    html += st.raidReports.map(rep => {
      const d = CFG.RAIDS[rep.raid_key] || {};
      const loot = Object.entries(rep.loot || {}).map(([r, v]) => RES_ICON[r] + fmt(v)).join(' ');
      const lostStr = (rep.lost || []).map(k => CFG.UNITS[k]?.icon || '💂').join('') || 'keine';
      return `<div class="row" style="border-color:${rep.won ? 'rgba(34,197,94,.4)' : 'rgba(239,68,68,.4)'}"><div class="rl"><span class="ric">${rep.won ? '🏆' : '💥'}</span><div>
        <div class="rn">${rep.won ? 'Sieg' : 'Niederlage'} — ${esc(d.label || rep.raid_key)}</div>
        <div class="rd">⚔️ ${rep.atk} vs. ${rep.power} (Chance ${rep.chance} %) · Verluste: ${lostStr}</div>
        <div class="rd">${rep.won ? `🎁 ${loot} · ` : ''}✨${rep.xp} XP</div>
      </div></div></div>`;
    }).join('');
  }
  $('shBody').innerHTML = html;
  tickCdEls();
}

/* ── Täglicher Login-Bonus: 7-Tage-Zyklus mit Streak ── */
function renderDaily() {
  const d = st.daily;
  const curDone = ((d.streak - 1) % CFG.DAILY_BONUS.cycleDays) + 1;
  const cards = d.cycle.map((rw, i) => {
    const day = i + 1;
    const past = d.available ? day < d.nextDay : day <= curDone;
    const today = d.available && day === d.nextDay;
    return `<div class="daycard ${today ? 'today' : past ? 'past' : ''}">
      <div class="dn">Tag ${day}</div>
      ${Object.entries(rw).map(([r, v]) => `${RES_ICON[r]}${fmt(v)}`).join('<br>')}
      <div style="margin-top:.2rem">✨${CFG.DAILY_BONUS.xp(day)} XP</div>
    </div>`;
  }).join('');
  $('shBody').innerHTML =
    `<div class="muted">Melde dich jeden Tag an und hole dir steigende Belohnungen — Tag 7 bringt den Jackpot! Verpasst du einen Tag, startet der Zyklus neu. Die Beträge wachsen mit deinem Level. Aktuelle Serie: <b style="color:var(--txt)">🔥 ${d.streak} ${d.streak === 1 ? 'Tag' : 'Tage'}</b></div>
    <div class="daygrid">${cards}</div>
    <button class="claimBtn" ${d.available ? '' : 'disabled'} onclick="claimDaily()">${d.available ? `🎁 Tag ${d.nextDay} abholen` : '✔ Heute schon abgeholt — bis morgen!'}</button>`;
}

/* ── Auktionshaus: Fahrzeuge per Gebot statt Fixpreis handeln ── */
let auctionTab = 'browse', auctionList = [], auctionAnchor = 0;
function auctionTabSwitch(t) { auctionTab = t; renderAuction(); }
function auctionTabsHtml() {
  return `<div class="pvp-tabs">
    <button class="${auctionTab === 'browse' ? 'active' : ''}" onclick="auctionTabSwitch('browse')">🔎 Durchsuchen</button>
    <button class="${auctionTab === 'selling' ? 'active' : ''}" onclick="auctionTabSwitch('selling')">🏷️ Meine Angebote</button>
    <button class="${auctionTab === 'bidding' ? 'active' : ''}" onclick="auctionTabSwitch('bidding')">💰 Meine Gebote</button>
  </div>`;
}
async function renderAuction() {
  $('shBody').innerHTML = auctionTabsHtml() + '<div class="muted">Lädt…</div>';
  try {
    const d = await api('/api/clash-of-acls/auctions');
    auctionList = d.list; auctionAnchor = Date.now();
    renderAuctionBody();
  } catch (e) { $('shBody').innerHTML = auctionTabsHtml() + '<div class="muted">Konnte nicht geladen werden.</div>'; }
}
const auctionCdAttr = a => `data-cde="${auctionAnchor + a.remaining_sec * 1000}"`;
function renderAuctionRow(a, mode) {
  const d = CFG.VEHICLES[a.vehicle_key] || {};
  const priceLine = a.bidder_name
    ? `Aktuelles Gebot: 💰${fmt(a.current_bid)} von <b>${esc(a.bidder_name)}</b>`
    : `Startpreis: 💰${fmt(a.start_price)} — noch kein Gebot`;
  let action = '';
  if (mode === 'browse') {
    action = a.isMine
      ? `<span class="muted">Dein Angebot</span>`
      : `<div class="clan-donate" style="margin:.4rem 0 0"><input type="number" id="bid-${a.id}" placeholder="min. ${fmt(a.minNextBid)}" min="${a.minNextBid}" style="width:110px"><button onclick="placeBid(${a.id})">Bieten</button></div>`;
  } else if (mode === 'selling') {
    action = a.bidder_name ? '<span class="muted">Gebot liegt vor</span>' : `<button class="ghost" onclick="cancelAuction(${a.id})">Zurückziehen</button>`;
  } else {
    action = '<span class="muted" style="color:var(--good)">Du führst!</span>';
  }
  return `<div class="row" style="flex-wrap:wrap"><div class="rl"><span class="ric">${d.icon || '🚗'}</span><div>
    <div class="rn">${esc(d.label || a.vehicle_key)} <span class="rd">· ${esc(a.rarity)} · Verkäufer ${esc(a.seller_name || '?')}</span></div>
    <div class="rd">${priceLine}</div>
    <div class="rd" ${auctionCdAttr(a)}></div>
  </div></div>${action}</div>`;
}
function renderAuctionBody() {
  let rows;
  if (auctionTab === 'selling') {
    const mine = auctionList.filter(a => a.isMine);
    const eligible = st.vehicles.filter(v => !v.on_mission && !v.in_auction);
    const formHtml = `<div style="font-weight:800;margin-bottom:.4rem">🏷️ Fahrzeug einstellen</div>
      <div class="clan-donate">
        <select id="aucVeh">${eligible.length ? eligible.map(v => { const vd = CFG.VEHICLES[v.vehicle_key] || {}; return `<option value="${v.id}">${vd.icon || '🚗'} ${esc(vd.label || v.vehicle_key)} (💰${fmt(v.value)})</option>`; }).join('') : '<option value="">Kein Fahrzeug verfügbar</option>'}</select>
        <input type="number" id="aucPrice" placeholder="Startpreis" min="${CFG.AUCTION.minStartPrice}" style="width:110px">
        <select id="aucDur">${CFG.AUCTION.durations.map(dd => `<option value="${dd.key}">${dd.label}</option>`).join('')}</select>
        <button onclick="submitListing()">Einstellen</button>
      </div>
      <div class="muted" style="margin-bottom:.6rem">Einstellgebühr: ${CFG.AUCTION.listingFeePct}% des Startpreises, sofort fällig — unabhängig davon, ob am Ende jemand mitbietet.</div>`;
    rows = formHtml + (mine.length ? mine.map(a => renderAuctionRow(a, 'selling')).join('') : '<div class="muted">Du hast aktuell keine Fahrzeuge im Auktionshaus.</div>');
  } else if (auctionTab === 'bidding') {
    const mine = auctionList.filter(a => a.isMyBid);
    rows = mine.length ? mine.map(a => renderAuctionRow(a, 'bidding')).join('') : '<div class="muted">Du bietest aktuell auf nichts.</div>';
  } else {
    rows = auctionList.length ? auctionList.map(a => renderAuctionRow(a, 'browse')).join('') : '<div class="muted">Aktuell steht kein Fahrzeug zur Auktion.</div>';
  }
  $('shBody').innerHTML = auctionTabsHtml() + rows;
  tickCdEls();
}
async function submitListing() {
  const vehicle_id = Number($('aucVeh').value);
  const start_price = Math.round(Number($('aucPrice').value));
  const duration_key = $('aucDur').value;
  if (!vehicle_id) return msg('Kein Fahrzeug ausgewählt');
  if (!start_price || start_price < CFG.AUCTION.minStartPrice) return msg(`Startpreis muss mindestens ${CFG.AUCTION.minStartPrice} betragen`);
  try {
    const d = await api('/api/clash-of-acls/auctions', { method: 'POST', body: { vehicle_id, start_price, duration_key } });
    SFX.tap(); msg('Fahrzeug eingestellt!', true);
    render(d); auctionList = d.list; auctionAnchor = Date.now();
    renderAuctionBody();
  } catch (e) { msg(e.message); }
}
async function placeBid(id) {
  const input = $('bid-' + id);
  const amount = Math.round(Number(input ? input.value : 0));
  const a = auctionList.find(x => x.id === id);
  const minNext = a ? a.minNextBid : 1;
  if (!amount || amount < minNext) return msg(`Gib ein gültiges Gebot ein (mind. ${fmt(minNext)})`);
  try {
    const d = await api(`/api/clash-of-acls/auctions/${id}/bid`, { method: 'POST', body: { amount } });
    SFX.coin(); msg('Gebot abgegeben!', true);
    render(d); auctionList = d.list; auctionAnchor = Date.now();
    renderAuctionBody();
  } catch (e) { msg(e.message); }
}
async function cancelAuction(id) {
  try {
    const d = await api(`/api/clash-of-acls/auctions/${id}/cancel`, { method: 'POST' });
    msg('Angebot zurückgezogen', true);
    render(d); auctionList = d.list; auctionAnchor = Date.now();
    renderAuctionBody();
  } catch (e) { msg(e.message); }
}

/* ── Forschung ── */
function renderResearch() {
  const centerLvl = st.researchCenterLevel;
  if (centerLvl < 1) {
    $('shBody').innerHTML = '<div class="muted">🔬 Baue zuerst ein <b>Forschungszentrum</b> (Baumenü → Spezial), um dauerhafte Boni zu erforschen.</div>';
    return;
  }
  const speedPct = CFG.BUILDINGS.forschungszentrum.effect.researchSpeedPct(centerLvl);
  const act = st.activeResearch;
  let html = `<div class="muted" style="margin-bottom:.6rem">Forschungszentrum Level <b>${centerLvl}</b> — Stufe N braucht Zentrum-Level N${speedPct ? ` · Forschung ${speedPct} % schneller` : ''}</div>`;
  if (act) {
    const t = CFG.RESEARCH[act.tech_key] || {};
    html += `<div class="row"><div class="rl"><span class="ric">${t.icon || '🔬'}</span><div><div class="rn">${esc(t.label || act.tech_key)} → Stufe ${act.target_level}</div><div class="rd" ${cdAttr(act)}></div></div></div>
      <button onclick="speedup('research')" title="Mit ACLS-Coins sofort abschließen">⚡</button></div>`;
  }
  const REDUCTIONS = ['buildTimePct', 'buildCostPct', 'manuTimePct'];
  const fmtEff = (t, lvl) => lvl ? (REDUCTIONS.includes(t.mod) ? '−' : '+') + (t.perLevel * lvl) + t.unit : '—';
  html += Object.entries(CFG.RESEARCH).map(([key, t]) => {
    const lvl = st.researchLevels[key] || 0;
    const maxed = lvl >= t.maxLevel;
    const target = lvl + 1;
    const gated = !maxed && centerLvl < target;
    const cost = maxed ? null : t.cost(target);
    const dur = maxed ? 0 : Math.max(60, Math.round(t.timeSec(target) * (1 - speedPct / 100)));
    const dis = maxed || !!act || gated || !canAfford(cost || {});
    return `<div class="row" style="flex-wrap:wrap"><div class="rl"><span class="ric">${t.icon}</span><div>
      <div class="rn">${esc(t.label)} <span class="rd">· Stufe ${lvl}/${t.maxLevel}</span></div>
      <div class="rd">${esc(t.desc)}</div>
      <div class="rd">Jetzt: <b>${fmtEff(t, lvl)}</b>${maxed ? '' : ` → <b style="color:var(--good)">${fmtEff(t, target)}</b>`}</div>
      ${maxed ? '' : `<div class="rd">${Object.entries(cost).map(([r, v]) => RES_ICON[r] + fmt(v)).join(' ')} · ⏱ ${fmtDur(dur)}${gated ? ` · 🔒 Zentrum Lv ${target} nötig` : ''}</div>`}
    </div></div>
    <button ${dis ? 'disabled' : ''} onclick="research('${key}')">${maxed ? '✔ Max' : 'Erforschen'}</button></div>`;
  }).join('');
  $('shBody').innerHTML = html;
  tickCdEls();
}

  let html = `<div class="war-card" style="border-color:rgba(168,85,247,.5)">

    html += `<div class="war-card">
      <div style="font-weight:800">🔁 Werkstatt zurücksetzen</div>

        ? '<div class="muted">Verdiene seit deinem letzten Prestige mehr Geld, um Punkte zu sammeln.</div>'

          ? `<div style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.5);border-radius:11px;padding:.6rem;margin-top:.4rem">
              <div style="font-weight:700;color:var(--bad);margin-bottom:.4rem">⚠️ Wirklich zurücksetzen? Gebäude, Mitarbeiter, Fahrzeuge, Forschung und Werkschutz gehen verloren!</div>
              <div style="display:flex;gap:.5rem">
                <button style="flex:1;background:var(--bad);color:#fff;border:0;border-radius:9px;padding:.5rem;font-weight:800;cursor:pointer" onclick="doPrestige()">Ja, zurücksetzen</button>
                <button style="flex:1;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:.5rem;font-weight:700;cursor:pointer" onclick="prestigeArmed=false;renderPrestige()">Abbrechen</button>
              </div>
            </div>`
          : `<button class="claimBtn" style="background:linear-gradient(145deg,#c084fc,#a855f7);color:#fff" onclick="prestigeArmed=true;renderPrestige()">🔁 Prestige starten</button>`
      }

  }

    const maxed = lvl >= u.maxLevel;
    const cost = maxed ? null : u.cost(lvl + 1);
    const dis = maxed || p.points < cost;
    const sign = (u.mod === 'buildCostPct' || u.mod === 'manuTimePct') ? '−' : '+';
    const effNow = u.mod ? `${sign}${u.perLevel * lvl}%` : `+${fmt(u.perLevel * lvl)} 💰 Start-Bonus`;
    const effNext = maxed ? null : (u.mod ? `${sign}${u.perLevel * (lvl + 1)}%` : `+${fmt(u.perLevel * (lvl + 1))} 💰 Start-Bonus`);
    return `<div class="row" style="flex-wrap:wrap"><div class="rl"><span class="ric">${u.icon}</span><div>
      <div class="rn">${esc(u.label)} <span class="rd">· Stufe ${lvl}/${u.maxLevel}</span></div>
      <div class="rd">${esc(u.desc)}</div>
      <div class="rd">Jetzt: <b>${effNow}</b>${maxed ? '' : ` → <b style="color:var(--good)">${effNext}</b>`}</div>
    </div></div>
    <button ${dis ? 'disabled' : ''} onclick="buyPrestigeUpgrade('${key}')">${maxed ? '✔ Max' : `💜${fmt(cost)}`}</button></div>`;
  }).join('');

  $('shBody').innerHTML = html;
}
async function doPrestige() {
  try {
    const d = await api('/api/clash-of-acls/prestige', { method:'POST', body:{ confirm: true } });
    prestigeArmed = false;
    SFX.levelup();
    toast('🔁', 'Prestige!', `+${d.gainedPoints} Prestige-Punkte — deine Werkstatt startet neu.`);
    burstAt(innerWidth / 2, innerHeight / 2 - 60, 26);
    render(d);
  } catch (e) { msg(e.message); }
}
async function buyPrestigeUpgrade(key) {
  try {
    const d = await api('/api/clash-of-acls/prestige-upgrade', { method:'POST', body:{ upgrade_key: key } });
    SFX.coin();
    msg('Upgrade verbessert!', true);
    render(d);
  } catch (e) { msg(e.message); }
}

function renderHelp() {
  const step = (icon, title, text) =>
    `<div class="hstep"><span class="hic">${icon}</span><div><div class="hti">${title}</div><div class="htx">${text}</div></div></div>`;
  $('shBody').innerHTML =
    step('🎯', 'Dein Ziel', 'Baue aus einer kleinen Werkstatt dein eigenes Werkstatt-Imperium: Gelände erweitern, Fahrzeuge produzieren, verkaufen und in der Rangliste aufsteigen.') +
    step('🗺️', 'Die Kampagne', 'Nicht sicher, wo du anfangen sollst? Die Kampagne (🗺️ oben) führt dich in 6 Kapiteln und 24 Schritten durch das ganze Spiel — vom ersten Ausbau bis zur „Legende von ACLS". Jeder Schritt zeigt genau, was zu tun ist, und bringt beim Abholen eine Belohnung. Perfekt als roter Faden!') +
    step('💰', 'Ressourcen', 'Geld, Stahl, Ersatzteile, Elektronik und Treibstoff werden von deinen Gebäuden automatisch produziert — auch während du offline bist! Aber: Volle Lager produzieren nicht weiter. Baue das Lager aus, um mehr zu bunkern.') +
    step('🔨', 'Bauen', 'Tippe auf den Hammer-Button unten rechts, wähle ein Gebäude und tippe dann auf einen gelb markierten Bauplatz. Es kann immer nur <b>ein</b> Bauauftrag gleichzeitig laufen — der Fortschritt läuft unten links.') +
    step('🏢', 'Das Büro', 'Dein wichtigstes Gebäude (wie das Rathaus): Jedes Büro-Level schaltet neue Bauplätze frei und erlaubt höhere Level für alle anderen Gebäude. Der dunkle Wald ist noch gesperrtes Gelände.') +
    step('⬆️', 'Ausbauen', 'Tippe ein Gebäude auf der Karte an — unten erscheinen Infos und der Ausbau-Button mit Kosten und Bauzeit. Höhere Level = mehr Produktion, mehr Lager, bessere Boni.') +
    step('👷', 'Mitarbeiter', 'Über das 👷-Symbol oben stellst du Mechaniker, Abschlepper, Elektriker & Co. ein und levelst sie hoch — sie steigern die Produktion ihrer Gebäude. Das Personalbüro schaltet mehr Slots frei.') +
    step('🚗', 'Fahrzeuge', 'Tippe die Garage an → „Fahrzeuge": Aus Rohstoffen fertigst du Abschleppwagen bis Sportwagen. Höheres Garagen-Level = schnellere Fertigung und bessere Fahrzeuge. Verkaufen im Fuhrpark (🚗 oben) — Tuningzentrum, Lackiererei und Fahrzeughandel erhöhen den Erlös!') +
    step('🚨', 'Einsätze', 'Schicke deine Fahrzeuge auf Missionen (🚨 oben oder Abschlepphof antippen) — vom 10-Minuten-Abschleppauftrag bis zur 8-Stunden-Flottenwartung. Das Fahrzeug ist solange unterwegs, dafür gibt es Geld und Material. Der Abschlepphof schaltet mit höherem Level mehr gleichzeitige Einsätze frei.') +
    step('🔬', 'Forschung', 'Baue das Forschungszentrum und erforsche dauerhafte Boni: schnelleres Bauen, größere Lager, billigere Ausbauten, mehr Produktion und bessere Missionserträge. Stufe N braucht Zentrum-Level N, und es läuft immer eine Forschung gleichzeitig.') +
    step('🛡️', 'Werkschutz & Überfälle', 'Die Sicherheitszentrale schaltet den Kampf frei: Bilde Wachmänner, Wachhunde, Drohnen und Sicherheitstrucks aus und überfalle NPC-Banden — vom Schrottdiebe-Versteck bis zur Syndikat-Zentrale. Je stärker dein Trupp, desto höher die Siegchance (wird live angezeigt). Sieg bringt fette Beute, aber Vorsicht: Einheiten können fallen! Jeder Kampf landet im Kampfbericht.') +
    step('⚔️', 'PvP-Angriffe', 'Über das ⚔️-Symbol greifst du andere Spieler an! Deine Einheiten (sofern nicht gerade auf einem NPC-Überfall) verteidigen automatisch dein Lager — schickst du sie auf Angriffe, bist du selbst verwundbarer. Bei Sieg erbeutest du echte Ressourcen vom Gegner. Fair geregelt: Einsteiger unter Level 3 sind nie angreifbar, jedes Ziel bekommt nach einem Angriff ein 20-Minuten-Schild, und pro Tag sind maximal 12 Angriffe erlaubt.') +
    step('🏰', 'Gilde', 'Bist du im Portal Mitglied in einem Club, profitierst du hier automatisch: Spende Ressourcen (🏰 oben) für Gildenpunkte — höheres Gildenlevel bedeutet mehr Produktion für ALLE Mitglieder, die Clash of ACLS spielen. Dazu läuft jede Woche ein Gildenkrieg: gewonnene Überfälle und PvP-Kämpfe bringen Punkte, ab bestimmten Schwellen (Bronze bis Platin) gibt es am Wochenende Belohnungen für jedes Mitglied.') +
    step('🎪', 'Events', 'Zeitlich begrenzte Events (🎪, nur sichtbar wenn gerade eins läuft) bringen eine eigene Marken-Währung, die du beim Abschließen von Einsätzen, Überfällen, PvP-Siegen und Ausbauten zusätzlich verdienst. Tausche die Marken im Event-Shop gegen exklusive Ressourcenpakete — nur für die begrenzte Laufzeit des Events verfügbar!') +
    step('⭐', 'Level & XP', 'Fast alles gibt Erfahrungspunkte: Bauen, Fertigen, Verkaufen, Einsätze, Forschung. Mit jedem Level-Aufstieg gibt es eine Belohnung und einen neuen Titel — dein Fortschritt steckt im ⭐-Chip oben links (antippen = Profil mit Statistiken und allen Erfolgen).') +
    step('🎯', 'Quests & Erfolge', 'Jeden Tag warten 3 Tages-Quests, jede Woche 3 Wochen-Quests (🎯 oben) — abschließen, abholen, kassieren. Dazu gibt es über 40 Erfolge mit XP- und Geld-Belohnungen im Profil.') +
    step('🎁', 'Täglicher Bonus', 'Einmal am Tag wartet ein Login-Bonus (🎁 oben). Wer an 7 Tagen in Folge abholt, knackt den Jackpot — die Beträge wachsen mit deinem Level. Verpasst du einen Tag, startet die Serie neu.') +
    step('⚔️', 'Liga', 'Jede Woche läufst du in einer von 8 Liga-Stufen (Holz bis Champion) — dein ⭐-Chip zeigt dein aktuelles Abzeichen. Fast jede Aktion bringt Liga-Punkte; genug Punkte am Wochenende bedeuten Aufstieg (mit Belohnung), zu wenige Abstieg. Verpasste Wochen kosten aber nichts außer der Stufe — jederzeit wieder einsteigbar. Die Liga-Rangliste findest du unter 🏆 oben.') +
    step('🔁', 'Prestige', 'Ab Büro-Level 8 (🔁 oben, auch übers Büro erreichbar) kannst du deine Werkstatt zurücksetzen: Gebäude, Mitarbeiter, Fahrzeuge, Forschung und Werkschutz starten neu — dafür gibt es dauerhafte Prestige-Punkte für permanente Boni (mehr Produktion, günstigeres Bauen, schnellere Fertigung, wertvollere Fahrzeuge, mehr Startkapital). Level, Erfolge, Kampagne, Quests, Gilde und PvP-Historie bleiben unangetastet — nichts Verdientes geht verloren.') +
    step('🔍', 'Karte bedienen', 'Zoome mit dem Mausrad, zwei Fingern oder den ＋/−-Buttons rechts. Ziehe die Karte mit gedrückter Maustaste oder dem Finger, um dich umzusehen. ⌂ setzt die Ansicht zurück.') +
    step('⚡', 'Tipp', 'Zu ungeduldig? Laufende Bauaufträge kannst du mit ACLS-Coins sofort abschließen (⚡-Button). Und du bekommst eine Benachrichtigung im Portal, sobald etwas fertig ist.') +
    `<button class="hgo" onclick="closeSheet()">Los geht's! 🔧</button>`;
}

/* ── Aktionen ── */
let tutorialChecked = false, welcomed = false, retroShown = false;
async function load() {
  try {
    const d = await api('/api/clash-of-acls/state');
    render(d);
    if (d.retroBonus && !retroShown) {
      retroShown = true;
      const src = d.retroBonus.fromEmpire && d.retroBonus.fromTycoon ? 'Auto Empire & Werkstatt-Tycoon'
        : d.retroBonus.fromEmpire ? 'Auto Empire' : 'Werkstatt-Tycoon';
      toast('🎁', 'Willkommensbonus verbucht!', `+${d.retroBonus.money} Geld aus deinem Fortschritt in ${src} — die Spiele wurden hier zusammengeführt.`);
    }
    if (!tutorialChecked) {
      tutorialChecked = true;
      if (!localStorage.getItem('coa-tutorial')) {
        localStorage.setItem('coa-tutorial', '1');
        welcomed = true; // Tutorial hat Vorrang vor Offline-/Daily-Popup
        openSheet('help');
      }
    }
    if (!welcomed) {
      welcomed = true;
      if (d.offline && Object.values(d.offline.gains).some(v => v > 0) && !sheetType) openSheet('offline', d.offline);
      else if (d.daily.available && !sheetType) openSheet('daily');
    }
  } catch (e) { msg(e.message); }
}
async function claimDaily() {
  try {
    const d = await api('/api/clash-of-acls/daily', { method:'POST' });
    SFX.coin();
    floatGain(Object.entries(d.rewards).map(([r, v]) => RES_ICON[r] + fmt(v)).join(' '));
    msg(`Tag ${d.day} abgeholt — Serie: ${d.streak} 🔥`, true);
    render(d);
  } catch (e) { msg(e.message); }
}
async function claimQuest(period, key) {
  try {
    const d = await api('/api/clash-of-acls/quest-claim', { method:'POST', body:{ period, quest_key: key } });
    SFX.coin();
    floatGain('+✨' + d.xp + ' XP ' + Object.entries(d.rewards).map(([r, v]) => RES_ICON[r] + fmt(v)).join(' '));
    msg('Quest-Belohnung abgeholt!', true);
    render(d);
  } catch (e) { msg(e.message); }
}
async function place(key, x, y) {
  try {
    const d = await api('/api/clash-of-acls/place', { method:'POST', body:{ building_key:key, x, y } });
    cancelPlacing(); msg('Baustelle eingerichtet!', true); render(d);
  } catch (e) { msg(e.message); }
}
async function upgrade(id) { try { const d = await api('/api/clash-of-acls/upgrade', { method:'POST', body:{ building_id:id } }); msg('Ausbau gestartet!', true); render(d); } catch (e) { msg(e.message); } }
async function manufacture(id, key) { try { const d = await api('/api/clash-of-acls/manufacture', { method:'POST', body:{ building_id:id, vehicle_key:key } }); msg('Fertigung gestartet!', true); render(d); } catch (e) { msg(e.message); } }
async function hire(type) { try { const d = await api('/api/clash-of-acls/hire', { method:'POST', body:{ emp_type:type } }); msg('Mitarbeiter eingestellt!', true); render(d); } catch (e) { msg(e.message); } }
async function empFire(id) { try { const d = await api(`/api/clash-of-acls/fire/${id}`, { method:'POST' }); msg('Mitarbeiter entlassen.', true); render(d); } catch (e) { msg(e.message); } }
async function empLevel(id) { try { const d = await api(`/api/clash-of-acls/employee/${id}/levelup`, { method:'POST' }); msg('Mitarbeiter aufgestiegen!', true); render(d); } catch (e) { msg(e.message); } }
async function sell(id) { try { const d = await api(`/api/clash-of-acls/sell/${id}`, { method:'POST' }); SFX.coin(); floatGain('+💰' + fmt(d.credited)); msg(`Verkauft für 💰${fmt(d.credited)}!`, true); render(d); } catch (e) { msg(e.message); } }
async function speedup(what) { try { const d = await api('/api/clash-of-acls/speedup', { method:'POST', body:{ what: what || 'build' } }); msg(`Fertig! (−${d.cost} ACLS-Coins)`, true); render(d); } catch (e) { msg(e.message); } }
async function startMission(key) {
  const sel = $('msel-' + key);
  const vid = sel ? +sel.value : 0;
  if (!vid) return msg('Kein passendes Fahrzeug verfügbar');
  try { const d = await api('/api/clash-of-acls/mission', { method:'POST', body:{ mission_key: key, vehicle_id: vid } }); msg('Einsatz gestartet!', true); render(d); } catch (e) { msg(e.message); }
}
async function research(key) { try { const d = await api('/api/clash-of-acls/research', { method:'POST', body:{ tech_key: key } }); msg('Forschung gestartet!', true); render(d); } catch (e) { msg(e.message); } }
async function train(key) { try { const d = await api('/api/clash-of-acls/train', { method:'POST', body:{ unit_key: key } }); msg('Ausbildung gestartet!', true); render(d); } catch (e) { msg(e.message); } }
async function startRaid(key) {
  if (!raidSel.size) return msg('Wähle zuerst Einheiten für den Trupp');
  try {
    const d = await api('/api/clash-of-acls/raid', { method:'POST', body:{ raid_key: key, unit_ids: [...raidSel] } });
    raidSel.clear();
    msg('Überfall gestartet — der Trupp ist unterwegs!', true);
    render(d);
  } catch (e) { msg(e.message); }
}

/* ── Ticker ── */
let reloadPending = false;
function tickProgress() {
  document.querySelectorAll('.cfill').forEach(el => {
    const e = +el.dataset.e, t = Math.max(1, +el.dataset.t);
    el.style.width = Math.min(100, Math.max(0, (1 - (e - Date.now()) / t) * 100)) + '%';
  });
}
setInterval(() => {
  if (!st) return;
  tickProgress(); tickCdEls();
  const due = (st.activeBuild && jobLeft(st.activeBuild) <= 0)
    || (st.activeResearch && jobLeft(st.activeResearch) <= 0)
    || (st.activeTraining && jobLeft(st.activeTraining) <= 0)
    || (st.activeRaid && jobLeft(st.activeRaid) <= 0)
    || (st.activeManufacture || []).some(m => jobLeft(m) <= 0)
    || (st.activeMissions || []).some(m => jobLeft(m) <= 0);
  if (due && !reloadPending) { reloadPending = true; load().finally(() => { reloadPending = false; }); }
}, 1000);
setInterval(load, 30000);

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('lvlOverlay').classList.contains('show')) $('lvlOverlay').classList.remove('show');
  else if (placing) cancelPlacing();
  else if (sheetType) closeSheet();
  else if (selectedId !== null) deselect();
});

$('sndBtn').textContent = SFX.isMuted() ? '🔇' : '🔊';
load();
</script>
