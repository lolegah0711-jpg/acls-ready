<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clash of ACLS</title>
<style>
  :root { --bg:#0b0f17; --card:#151b27; --card2:#1c2433; --line:#26303f; --txt:#e5e9f0; --mut:#8b97a9; --acc:#f97316; --good:#22c55e; --bad:#ef4444; --lock:#0d1622; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:1.2rem; }
  h1 { font-size:1.5rem; margin:.2rem 0; }
  .sub { color:var(--mut); margin-bottom:1rem; font-size:.9rem; }
  a.back { color:var(--acc); text-decoration:none; font-size:.85rem; }
  .err { color:var(--bad); font-size:.85rem; min-height:1rem; margin:.4rem 0; } .err.ok{ color:var(--good); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.1rem; margin-bottom:1rem; }
  .res-bar { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem; }
  .res { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:.5rem .8rem; flex:1; min-width:120px; }
  .res b { display:block; font-size:1.05rem; } .res span { color:var(--mut); font-size:.7rem; }
  .queue-bar { height:10px; background:var(--lock); border-radius:999px; overflow:hidden; margin:.5rem 0; }
  .queue-bar > i { display:block; height:100%; background:linear-gradient(90deg,#f59e0b,#22c55e); transition:width .3s; }
  button { background:var(--acc); color:#1a0a00; border:0; border-radius:9px; padding:.55rem .95rem; font-weight:700; cursor:pointer; font-size:.85rem; }
  button:hover { filter:brightness(1.08); } button:disabled { opacity:.45; cursor:default; }
  button.ghost { background:var(--card2); color:var(--txt); border:1px solid var(--line); }
  button.bad { background:var(--bad); color:#fff; }
  button.sm { padding:.35rem .7rem; font-size:.78rem; }
  .muted { color:var(--mut); font-size:.82rem; }
  .grid-outer { display:flex; justify-content:center; }
  .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:3px; width:100%; max-width:480px; aspect-ratio:1; }
  .cell { position:relative; aspect-ratio:1; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:1rem; cursor:pointer; background:var(--card2); border:1px solid var(--line); user-select:none; }
  .cell.locked { background:var(--lock); border-color:var(--lock); cursor:default; color:var(--mut); font-size:.7rem; }
  .cell.empty:hover { border-color:var(--acc); }
  .cell.building { background:#1e2a1e; border-color:#2e4a2e; flex-direction:column; }
  .cell .lvl { position:absolute; bottom:1px; right:2px; font-size:.55rem; color:var(--mut); background:rgba(0,0,0,.5); border-radius:4px; padding:0 2px; }
  .cell.progress { animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(249,115,22,.5); } 50%{ box-shadow:0 0 0 4px rgba(249,115,22,.15); } }
  .panel-title { font-weight:700; margin-bottom:.5rem; display:flex; align-items:center; gap:.5rem; }
  .opt-list { display:flex; flex-direction:column; gap:.5rem; margin-top:.5rem; }
  .opt { display:flex; align-items:center; justify-content:space-between; gap:.6rem; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:.55rem .7rem; }
  .opt .l { display:flex; align-items:center; gap:.55rem; }
  .opt .l .ic { font-size:1.3rem; }
  .opt .l .name { font-weight:600; font-size:.88rem; } .opt .l .d { color:var(--mut); font-size:.72rem; }
  .tabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
  .tab { padding:.4rem .8rem; border-radius:8px; background:var(--card2); border:1px solid var(--line); cursor:pointer; font-size:.82rem; color:var(--mut); }
  .tab.active { background:var(--acc); color:#1a0a00; border-color:var(--acc); font-weight:700; }
  .lbrow { display:flex; justify-content:space-between; padding:.35rem .2rem; border-bottom:1px solid var(--line); font-size:.86rem; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Zurück zum Portal</a>
  <h1>🏗️ Clash of ACLS</h1>
  <div class="sub">Baue dein Werkstattgelände aus — Gebäude leveln, Mitarbeiter einstellen, Fahrzeuge fertigen und verkaufen.</div>
  <div class="err" id="msg"></div>

  <div class="res-bar" id="resBar"></div>

  <div class="card" id="queueCard" style="display:none">
    <div class="panel-title"><i class="ic">🛠️</i><span id="queueTitle">Bauauftrag läuft…</span></div>
    <div class="queue-bar"><i id="queueBar" style="width:0%"></i></div>
    <div class="muted" id="queueNote"></div>
    <div style="margin-top:.5rem"><button class="ghost sm" onclick="speedup()">⚡ Beschleunigen (ACLS-Coins)</button></div>
  </div>

  <div class="card">
    <div class="panel-title"><i class="ic">🗺️</i><span>Gelände</span></div>
    <div class="grid-outer"><div class="grid" id="grid"></div></div>
    <div class="muted" style="margin-top:.5rem">Klick auf eine freie Zelle zum Bauen, auf ein Gebäude zum Ausbauen.</div>
  </div>

  <div class="card" id="detailCard" style="display:none"></div>

  <div class="tabs">
    <div class="tab active" data-tab="mitarbeiter" onclick="switchTab('mitarbeiter')">👷 Mitarbeiter</div>
    <div class="tab" data-tab="fuhrpark" onclick="switchTab('fuhrpark')">🚗 Fuhrpark</div>
    <div class="tab" data-tab="rang" onclick="switchTab('rang')">🏆 Rangliste</div>
  </div>

  <div class="card" id="tab-mitarbeiter"></div>
  <div class="card" id="tab-fuhrpark" style="display:none"></div>
  <div class="card" id="tab-rang" style="display:none"></div>
</div>

<script src="/game-auth.js"></script>
<script src="/js/clash-of-acls-config.js?v=1"></script>
<script>
const CFG = window.CLASH_OF_ACLS_CONFIG;
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n||0).toLocaleString('de-DE');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RES_ICON = { money:'💰', steel:'🔩', parts:'⚙️', electronics:'💡', fuel:'⛽' };
const RES_NAME = { money:'Geld', steel:'Stahl', parts:'Ersatzteile', electronics:'Elektronik', fuel:'Treibstoff' };

async function api(path, opts={}) {
  const r = await fetch(path, { headers:{'Content-Type':'application/json'}, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.error || 'Fehler');
  return d;
}
function msg(t, ok) { const m=$('msg'); m.textContent=t; m.className = ok ? 'err ok' : 'err'; if (t) setTimeout(()=>{ if (m.textContent===t) m.textContent=''; }, 4000); }

let st = null;
let selected = null; // {x,y} oder building id
let activeTab = 'mitarbeiter';

function buildingLabel(key, level) {
  const def = CFG.BUILDINGS[key];
  if (!def) return key;
  return typeof def.label === 'function' ? def.label(level) : def.label;
}

function render(d) {
  st = d;
  renderResBar();
  renderQueue();
  renderGrid();
  if (selected) renderDetail(); else $('detailCard').style.display = 'none';
  renderTab();
}

function renderResBar() {
  $('resBar').innerHTML = CFG.RESOURCES.map(r => `
    <div class="res"><b>${RES_ICON[r]} ${fmt(st.resources[r])} <span style="color:var(--mut);font-size:.65rem">/ ${fmt(st.caps[r])}</span></b>
    <span>${RES_NAME[r]} · +${fmt(st.ratesPerHour[r])}/h</span></div>`).join('');
}

function renderQueue() {
  const q = st.activeBuild;
  if (!q) { $('queueCard').style.display = 'none'; return; }
  $('queueCard').style.display = '';
  const total = (new Date(q.finish_at+'Z').getTime() - new Date(q.started_at+'Z').getTime());
  const left = Math.max(0, new Date(q.finish_at+'Z').getTime() - Date.now());
  const pct = total > 0 ? Math.min(100, 100 - (left/total*100)) : 100;
  $('queueBar').style.width = pct + '%';
  const label = buildingLabel(q.building_key, q.target_level);
  $('queueTitle').textContent = `${label} → Level ${q.target_level}`;
  const mins = Math.ceil(left/60000);
  $('queueNote').textContent = left <= 0 ? 'Wird abgeschlossen…' : `Noch ca. ${mins} Min.`;
}

function renderGrid() {
  const built = new Map(st.buildings.map(b => [`${b.x},${b.y}`, b]));
  const manuByBuilding = new Map((st.activeManufacture||[]).map(m => [m.building_id, m]));
  const html = [];
  for (let y = 0; y < CFG.GRID.H; y++) {
    for (let x = 0; x < CFG.GRID.W; x++) {
      const idx = CFG.cellIndex(x, y);
      const b = built.get(`${x},${y}`);
      if (b) {
        const inProgress = (st.activeBuild && st.activeBuild.x === x && st.activeBuild.y === y) || manuByBuilding.has(b.id);
        const def = CFG.BUILDINGS[b.building_key];
        html.push(`<div class="cell building${inProgress?' progress':''}" data-x="${x}" data-y="${y}" title="${esc(buildingLabel(b.building_key,b.level))}">
          <span>${b.level < 1 ? '🚧' : def.icon}</span>${b.level>=1?`<span class="lvl">Lv${b.level}</span>`:''}</div>`);
      } else if (idx < st.unlockedCells) {
        html.push(`<div class="cell empty" data-x="${x}" data-y="${y}">+</div>`);
      } else {
        html.push(`<div class="cell locked">🔒</div>`);
      }
    }
  }
  $('grid').innerHTML = html.join('');
  $('grid').querySelectorAll('.cell.building,.cell.empty').forEach(el => {
    el.addEventListener('click', () => selectCell(+el.dataset.x, +el.dataset.y));
  });
}

function selectCell(x, y) {
  const b = st.buildings.find(b => b.x === x && b.y === y);
  selected = b ? { mode:'building', id:b.id } : { mode:'place', x, y };
  renderDetail();
}

function renderDetail() {
  const el = $('detailCard');
  el.style.display = '';
  if (selected.mode === 'place') {
    const placed = new Set(st.buildings.map(b=>b.building_key));
    const options = Object.keys(CFG.BUILDINGS).filter(k => !(CFG.BUILDINGS[k].singleton && placed.has(k)));
    el.innerHTML = `<div class="panel-title"><i class="ic">🏗️</i><span>Gebäude bauen</span> <button class="ghost sm" style="margin-left:auto" onclick="closeDetail()">Schließen</button></div>
      <div class="opt-list">${options.map(k => {
        const def = CFG.BUILDINGS[k];
        const cost = def.cost(1);
        const affordable = Object.entries(cost).every(([r,a]) => st.resources[r] >= a);
        const label = typeof def.label==='function' ? def.label(1) : def.label;
        return `<div class="opt"><div class="l"><span class="ic">${def.icon}</span><div><div class="name">${esc(label)}</div><div class="d">${esc(def.desc)} · ${Object.entries(cost).map(([r,a])=>`${RES_ICON[r]}${fmt(a)}`).join(' ')} · ⏱${fmt(def.buildTimeSec(1))}s</div></div></div>
          <button ${affordable?'':'disabled'} onclick="place('${k}')">Bauen</button></div>`;
      }).join('') || '<div class="muted">Keine Gebäude verfügbar.</div>'}</div>`;
  } else {
    const b = st.buildings.find(b => b.id === selected.id);
    if (!b) { selected = null; el.style.display='none'; return; }
    const def = CFG.BUILDINGS[b.building_key];
    const label = buildingLabel(b.building_key, b.level);
    if (b.level < 1) {
      el.innerHTML = `<div class="panel-title"><i class="ic">🚧</i><span>${esc(label)} — im Bau</span> <button class="ghost sm" style="margin-left:auto" onclick="closeDetail()">Schließen</button></div><div class="muted">Fertigstellung siehe Bauauftrag oben.</div>`;
      return;
    }
    let extra = '';
    if (b.building_key === 'garage') extra = renderGarage(b, def);
    const canUpgrade = b.level < def.maxLevel && !st.activeBuild;
    const nextCost = canUpgrade ? def.cost(b.level+1) : null;
    const affordable = nextCost && Object.entries(nextCost).every(([r,a]) => st.resources[r] >= a);
    el.innerHTML = `<div class="panel-title"><i class="ic">${def.icon}</i><span>${esc(label)} — Level ${b.level}</span> <button class="ghost sm" style="margin-left:auto" onclick="closeDetail()">Schließen</button></div>
      <div class="muted">${esc(def.desc)}</div>
      ${b.level >= def.maxLevel ? '<div class="muted" style="margin-top:.5rem">Maximales Level erreicht.</div>' :
        `<div style="margin-top:.6rem"><button ${affordable && canUpgrade ? '' : 'disabled'} onclick="upgrade(${b.id})">Ausbauen → Level ${b.level+1} (${nextCost?Object.entries(nextCost).map(([r,a])=>`${RES_ICON[r]}${fmt(a)}`).join(' '):''})</button></div>`}
      ${extra}`;
  }
}
function closeDetail() { selected = null; $('detailCard').style.display = 'none'; }

function renderGarage(b, def) {
  const activeManu = (st.activeManufacture||[]).find(m => m.building_id === b.id);
  if (activeManu) {
    const left = Math.max(0, new Date(activeManu.finish_at+'Z').getTime() - Date.now());
    return `<div class="muted" style="margin-top:.6rem">🚧 Fertigt: ${esc(CFG.VEHICLES[activeManu.vehicle_key]?.label||activeManu.vehicle_key)} — noch ca. ${Math.ceil(left/60000)} Min.</div>`;
  }
  const tier = def.effect.unlockedTier(b.level);
  const vehicles = Object.entries(CFG.VEHICLES).filter(([,v]) => v.tier <= tier);
  const cost = def.manufactureCost;
  const affordable = Object.entries(cost).every(([r,a]) => st.resources[r] >= a);
  return `<div class="panel-title" style="margin-top:.8rem"><i class="ic">🚗</i><span>Fahrzeug fertigen</span></div>
    <div class="muted">Kosten: ${Object.entries(cost).map(([r,a])=>`${RES_ICON[r]}${fmt(a)}`).join(' ')} · ⏱${fmt(def.effect.manufactureTimeSec(b.level))}s</div>
    <div class="opt-list">${vehicles.map(([k,v]) => `<div class="opt"><div class="l"><span class="ic">${v.icon}</span><div><div class="name">${esc(v.label)}</div><div class="d">${v.rarity}</div></div></div>
      <button ${affordable?'':'disabled'} onclick="manufacture(${b.id},'${k}')">Fertigen</button></div>`).join('')}</div>`;
}

function switchTab(t) {
  activeTab = t;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === t));
  ['mitarbeiter','fuhrpark','rang'].forEach(k => $('tab-'+k).style.display = k===t ? '' : 'none');
  renderTab();
}

function renderTab() {
  if (activeTab === 'mitarbeiter') renderMitarbeiter();
  else if (activeTab === 'fuhrpark') renderFuhrpark();
  else loadLeaderboard();
}

function renderMitarbeiter() {
  const slotsUsed = st.employees.length, slotsMax = st.employeeSlots;
  const hireCost = CFG.empHireCost(st.employees.length);
  const hireOptions = Object.entries(CFG.EMPLOYEES).map(([k,e]) => `<div class="opt"><div class="l"><span class="ic">${e.icon}</span><div><div class="name">${esc(e.label)}</div><div class="d">${esc(e.desc)}</div></div></div>
    <button ${slotsUsed>=slotsMax || st.resources.money<hireCost ? 'disabled':''} onclick="hire('${k}')">Einstellen — 💰${fmt(hireCost)}</button></div>`).join('');
  const list = st.employees.map(e => {
    const def = CFG.EMPLOYEES[e.emp_type];
    const cost = CFG.empLevelCost(e.level);
    return `<div class="opt"><div class="l"><span class="ic">${def?.icon||'👷'}</span><div><div class="name">${esc(def?.label||e.emp_type)} — Lv.${e.level}</div><div class="d">${def?.desc||''}</div></div></div>
      <div style="display:flex;gap:.4rem">
        <button class="sm" ${e.level>=CFG.EMP_MAX_LEVEL || st.resources.money<cost ? 'disabled':''} onclick="levelUpEmployee(${e.id})">⬆ 💰${fmt(cost)}</button>
        <button class="sm bad" onclick="fireEmployee(${e.id})">Entlassen</button>
      </div></div>`;
  }).join('');
  $('tab-mitarbeiter').innerHTML = `<div class="panel-title"><i class="ic">👷</i><span>Mitarbeiter (${slotsUsed}/${slotsMax})</span></div>
    ${list || '<div class="muted">Noch keine Mitarbeiter eingestellt.</div>'}
    <div class="panel-title" style="margin-top:1rem">Neu einstellen</div>
    <div class="opt-list">${hireOptions}</div>`;
}

function renderFuhrpark() {
  if (!st.vehicles.length) { $('tab-fuhrpark').innerHTML = '<div class="muted">Noch keine fertigen Fahrzeuge — in der Garage produzieren.</div>'; return; }
  $('tab-fuhrpark').innerHTML = `<div class="panel-title"><i class="ic">🚗</i><span>Fuhrpark (${st.vehicles.length})</span></div>
    <div class="opt-list">${st.vehicles.map(v => {
      const def = CFG.VEHICLES[v.vehicle_key];
      return `<div class="opt"><div class="l"><span class="ic">${def?.icon||'🚗'}</span><div><div class="name">${esc(def?.label||v.vehicle_key)}</div><div class="d">${v.rarity} · Wert 💰${fmt(v.value)}</div></div></div>
        <button onclick="sellVehicle(${v.id})">Verkaufen</button></div>`;
    }).join('')}</div>`;
}

async function loadLeaderboard() {
  try {
    const l = await api('/api/clash-of-acls/leaderboard');
    $('tab-rang').innerHTML = `<div class="panel-title"><i class="ic">🏆</i><span>Rangliste</span></div>` +
      (l.length ? l.map((x,i)=>`<div class="lbrow"><span>#${i+1} ${esc(x.username||'?')}</span><span>💰 ${fmt(x.total_earned)}</span></div>`).join('') : '<div class="muted">Noch keine Einträge.</div>');
  } catch(e) {}
}

async function load() { try { render(await api('/api/clash-of-acls/state')); } catch(e) { msg(e.message); } }
async function place(key) { try { const d = await api('/api/clash-of-acls/place', { method:'POST', body:{ building_key:key, x:selected.x, y:selected.y } }); msg('Baustelle eingerichtet!', true); closeDetail(); render(d); } catch(e) { msg(e.message); } }
async function upgrade(id) { try { const d = await api('/api/clash-of-acls/upgrade', { method:'POST', body:{ building_id:id } }); msg('Ausbau gestartet!', true); render(d); } catch(e) { msg(e.message); } }
async function manufacture(id, key) { try { const d = await api('/api/clash-of-acls/manufacture', { method:'POST', body:{ building_id:id, vehicle_key:key } }); msg('Fertigung gestartet!', true); render(d); } catch(e) { msg(e.message); } }
async function hire(type) { try { const d = await api('/api/clash-of-acls/hire', { method:'POST', body:{ emp_type:type } }); msg('Mitarbeiter eingestellt!', true); render(d); } catch(e) { msg(e.message); } }
async function fireEmployee(id) { try { const d = await api(`/api/clash-of-acls/fire/${id}`, { method:'POST' }); msg('Mitarbeiter entlassen.', true); render(d); } catch(e) { msg(e.message); } }
async function levelUpEmployee(id) { try { const d = await api(`/api/clash-of-acls/employee/${id}/levelup`, { method:'POST' }); msg('Mitarbeiter aufgestiegen!', true); render(d); } catch(e) { msg(e.message); } }
async function sellVehicle(id) { try { const d = await api(`/api/clash-of-acls/sell/${id}`, { method:'POST' }); msg(`Verkauft für 💰${fmt(d.credited)}!`, true); render(d); } catch(e) { msg(e.message); } }
async function speedup() { try { const d = await api('/api/clash-of-acls/speedup', { method:'POST' }); msg(`Beschleunigt für ${d.cost} ACLS-Coins!`, true); render(d); } catch(e) { msg(e.message); } }

load();
setInterval(load, 30000);
setInterval(() => { if (st && st.activeBuild) renderQueue(); }, 1000);
</script>
</body>
</html>
