<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Defense – ACLS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0d1117;font-family:'Inter',sans-serif;color:#fff;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}

    #back{position:fixed;top:10px;left:10px;z-index:999;background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.75);padding:5px 14px;
      border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;
      font-family:Inter,sans-serif;backdrop-filter:blur(4px);}

    #ui{width:min(700px,98vw);display:flex;flex-direction:column;align-items:center;padding:52px 8px 20px;}
    h1{font-size:clamp(18px,4vw,26px);font-weight:800;letter-spacing:.12em;text-transform:uppercase;
      background:linear-gradient(90deg,#f97316,#fbbf24);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}

    /* Map picker */
    #screen-map{width:100%;text-align:center;}
    .map-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;}
    .map-card{background:#161b22;border:2px solid #30363d;border-radius:12px;padding:16px 10px;
      cursor:pointer;transition:border-color .15s,background .15s;}
    .map-card:hover{border-color:#f97316;background:#1a1200;}
    .map-preview{width:100%;aspect-ratio:16/9;border-radius:8px;margin-bottom:10px;position:relative;overflow:hidden;}
    .map-name{font-weight:700;font-size:14px;margin-bottom:3px;}
    .map-desc{font-size:11px;color:#8b949e;}

    /* HUD */
    #hud{width:100%;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}
    .hud-item{background:#161b22;border:1px solid #30363d;border-radius:8px;
      padding:5px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;}
    .hud-label{color:#8b949e;font-size:10px;font-weight:600;text-transform:uppercase;}
    .hud-val{color:#fbbf24;}
    #lives-val{color:#ef4444;}
    #wave-val{color:#60a5fa;}

    #canvas-wrap{position:relative;border:2px solid #30363d;border-radius:8px;overflow:hidden;}
    canvas{display:block;}

    /* Tower info panel */
    #tower-panel{width:100%;background:#161b22;border:1px solid #30363d;border-radius:10px;
      padding:10px 14px;margin-top:8px;display:none;align-items:center;gap:12px;flex-wrap:wrap;}
    .tp-icon{font-size:26px;}
    .tp-info{flex:1;min-width:0;}
    .tp-name{font-weight:800;font-size:15px;}
    .tp-stats{font-size:11px;color:#8b949e;margin-top:2px;}
    .tp-level{display:flex;gap:4px;margin-top:4px;}
    .tp-dot{width:10px;height:10px;border-radius:50%;background:#30363d;}
    .tp-dot.filled{background:#f97316;}
    #btn-upgrade{padding:7px 16px;border:none;border-radius:8px;font-size:12px;font-weight:800;
      font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#7c2d12,#f97316);color:#fff;}
    #btn-upgrade:disabled{opacity:.4;cursor:default;}
    #btn-sell-tp{padding:7px 12px;border:1px solid #374151;border-radius:8px;font-size:12px;
      font-weight:700;font-family:inherit;cursor:pointer;background:#1f2937;color:#ef4444;}

    /* Shop */
    #shop{width:100%;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
    .tower-btn{display:flex;flex-direction:column;align-items:center;gap:3px;
      background:#161b22;border:2px solid #30363d;border-radius:10px;
      padding:7px 10px;cursor:pointer;transition:border-color .15s,background .15s;min-width:78px;}
    .tower-btn:hover{background:#1f2937;}
    .tower-btn.selected{border-color:#f97316;background:#1a0e00;}
    .tower-btn.disabled{opacity:.4;cursor:default;}
    .tower-icon{font-size:20px;}
    .tower-name{font-size:10px;font-weight:700;}
    .tower-cost{font-size:10px;color:#fbbf24;font-weight:700;}

    #ctrl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center;}
    .ctrl-btn{padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:700;
      font-family:inherit;cursor:pointer;transition:opacity .15s;}
    .ctrl-btn:hover{opacity:.85;}
    #btn-start{background:linear-gradient(135deg,#166534,#22c55e);color:#fff;}
    #btn-speed{background:#1f2937;color:#fbbf24;border:1px solid #374151;}

    .ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;
      justify-content:center;z-index:200;}
    .ov.hidden{display:none;}
    .ov-card{background:#161b22;border:2px solid #30363d;border-radius:16px;
      padding:28px 36px;text-align:center;max-width:400px;width:92%;}
    .ov-title{font-size:24px;font-weight:800;margin-bottom:8px;}
    .ov-sub{color:#8b949e;font-size:13px;margin-bottom:20px;}
    .ov-btn{padding:11px 24px;border:none;border-radius:9px;font-size:14px;font-weight:800;
      font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#b45309,#f59e0b);color:#fff;margin:4px;}

    .lb-card{background:#161b22;border:2px solid #30363d;border-radius:16px;padding:20px 24px;
      max-width:420px;width:92%;max-height:85vh;overflow-y:auto;text-align:left;}
    .lb-card-title{font-size:18px;font-weight:800;margin-bottom:4px;color:#f97316;}
    .lb-card-sub{font-size:12px;color:#8b949e;margin-bottom:14px;}
    .lb-row{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid #21262d;font-size:13px;}
    .lb-rank{width:26px;text-align:center;font-weight:700;font-size:14px;}
    .lb-av{width:26px;height:26px;border-radius:50%;background:#1f2937;display:flex;align-items:center;
      justify-content:center;font-size:9px;font-weight:700;overflow:hidden;flex-shrink:0;}
    .lb-av img{width:100%;height:100%;object-fit:cover;}
    .lb-name{flex:1;font-weight:600;}
    .lb-score{font-weight:700;color:#fbbf24;}
    .lb-close{margin-top:12px;padding:8px 20px;border:none;border-radius:8px;background:#1f2937;
      color:#9ca3af;border:1px solid #374151;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;}

    #msg{position:absolute;top:8px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,.85);padding:5px 14px;border-radius:20px;font-size:12px;
      font-weight:700;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5;}

    /* Leaderboard */
    .lb-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:300;}
    .lb-ov.hidden{display:none;}
  </style>
</head>
<body>
<a id="back" href="/" onclick="window.close()">← Portal</a>

<div id="ui">
  <h1>🛡️ Tower Defense</h1>

  <!-- MAP SELECTION -->
  <div id="screen-map">
    <div style="color:#8b949e;font-size:13px">Wähle eine Map</div>
    <div class="map-grid" id="map-grid"></div>
  </div>

  <!-- GAME -->
  <div id="screen-game" style="display:none;width:100%">
    <div id="hud">
      <div class="hud-item"><span class="hud-label">Leben</span><span class="hud-val" id="lives-val">20</span></div>
      <div class="hud-item"><span class="hud-label">Gold</span><span class="hud-val" id="gold-val">150</span></div>
      <div class="hud-item"><span class="hud-label">Welle</span><span class="hud-val" id="wave-val">0</span></div>
      <div class="hud-item"><span class="hud-label">Punkte</span><span class="hud-val" id="score-val">0</span></div>
      <div class="hud-item"><span class="hud-label">Kills</span><span class="hud-val" id="kills-val">0</span></div>
    </div>

    <div id="canvas-wrap">
      <canvas id="c"></canvas>
      <div id="msg"></div>
    </div>

    <div id="tower-panel">
      <div class="tp-icon" id="tp-icon"></div>
      <div class="tp-info">
        <div class="tp-name" id="tp-name"></div>
        <div class="tp-stats" id="tp-stats"></div>
        <div class="tp-level" id="tp-level"></div>
      </div>
      <button id="btn-upgrade" onclick="upgradeSelected()">⬆ Upgrade</button>
      <button id="btn-sell-tp" onclick="sellSelected()">🗑 Verkaufen</button>
    </div>

    <div id="shop"></div>

    <div id="ctrl">
      <button class="ctrl-btn" id="btn-start" onclick="startWave()">▶ Welle starten</button>
      <button class="ctrl-btn" id="btn-speed" onclick="toggleSpeed()">⚡ 1×</button>
      <button class="ctrl-btn" style="background:#1f2937;color:#fbbf24;border:1px solid #374151" onclick="openLb()">🏆 Rangliste</button>
      <button class="ctrl-btn" style="background:#1f2937;color:#8b949e;border:1px solid #374151" onclick="backToMenu()">← Maps</button>
    </div>
  </div>
</div>

<!-- OVERLAYS -->
<div class="ov hidden" id="ov-end">
  <div class="ov-card">
    <div class="ov-title" id="ov-title">💀 Game Over</div>
    <div class="ov-sub" id="ov-sub"></div>
    <button class="ov-btn" onclick="restartGame()">Nochmal</button>
    <button class="ov-btn" style="background:#1f2937;color:#f0f0f0;border:1px solid #374151" onclick="backToMenu()">Map wählen</button>
  </div>
</div>

<div class="lb-ov hidden" id="ov-lb">
  <div class="lb-card">
    <div class="lb-card-title">🏆 Rangliste – Tower Defense</div>
    <div class="lb-card-sub">Höchste Punktzahl</div>
    <div id="lb-list"></div>
    <button class="lb-close" onclick="document.getElementById('ov-lb').classList.add('hidden')">Schließen ✕</button>
  </div>
</div>

<script>
// ── MAPS ──────────────────────────────────────────────────────────
const MAPS = [
  {
    id:'classic', name:'Klassisch', desc:'Klassischer Zickzack-Pfad',
    bg:'#0d1117', pathColor:'#1a1209', borderColor:'#2a1f09',
    path:[
      [0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[6,3],[6,4],[6,5],[6,6],[6,7],
      [7,7],[8,7],[9,7],[10,7],[11,7],[11,6],[11,5],[11,4],[11,3],[11,2],[12,2],
      [13,2],[14,2],[14,3],[14,4],[14,5],[14,6],[14,7],[14,8],[14,9],[14,10],
      [13,10],[12,10],[11,10],[10,10],[9,10],[8,10],[7,10],[6,10],[6,11],[6,12],
      [7,12],[8,12],[9,12],[10,12],[11,12],[12,12],[13,12],[14,12],[15,12],
      [16,12],[17,12],[18,12],[19,12]
    ]
  },
  {
    id:'spiral', name:'Labyrinth', desc:'Enger Spiralpfad — wenig Platz für Türme',
    bg:'#0a0d12', pathColor:'#0f1a24', borderColor:'#1a2a35',
    path:[
      [0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1],[11,1],[12,1],[13,1],[14,1],[15,1],[16,1],[17,1],[18,1],[19,1],
      [19,2],[19,3],[19,4],[19,5],[19,6],[19,7],[19,8],[19,9],[19,10],[19,11],[19,12],
      [18,12],[17,12],[16,12],[15,12],[14,12],[13,12],[12,12],[11,12],[10,12],[9,12],[8,12],[7,12],[6,12],[5,12],[4,12],[3,12],[2,12],[1,12],
      [1,11],[1,10],[1,9],[1,8],[1,7],[1,6],[1,5],[1,4],[1,3],
      [2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[9,3],[10,3],[11,3],[12,3],[13,3],[14,3],[15,3],[16,3],[17,3],
      [17,4],[17,5],[17,6],[17,7],[17,8],[17,9],[17,10],
      [16,10],[15,10],[14,10],[13,10],[12,10],[11,10],[10,10],[9,10],[8,10],[7,10],[6,10],[5,10],[4,10],[3,10],
      [3,9],[3,8],[3,7],[3,6],[3,5],
      [4,5],[5,5],[6,5],[7,5],[8,5],[9,5],[10,5],[11,5],[12,5],[13,5],[14,5],[15,5],
      [15,6],[15,7],[15,8],
      [14,8],[13,8],[12,8],[11,8],[10,8],[9,8],[8,8],[7,8],[6,8],[5,8],
      [5,7],[5,6],
      [6,6],[7,6],[8,6],[9,6],[10,6],[11,6],[12,6],[13,6]
    ]
  },
  {
    id:'cross', name:'Kreuzung', desc:'Zwei Pfade — Feinde kommen von zwei Seiten',
    bg:'#100d17', pathColor:'#1a1024', borderColor:'#2a1a35',
    path:[
      [0,6],[1,6],[2,6],[3,6],[4,6],[5,6],[6,6],[6,5],[6,4],[6,3],[6,2],[6,1],
      [7,1],[8,1],[9,1],[10,1],[11,1],[12,1],[13,1],[13,2],[13,3],[13,4],[13,5],[13,6],
      [14,6],[15,6],[16,6],[17,6],[18,6],[19,6],
      [19,7],[18,7],[17,7],[16,7],[15,7],[14,7],[13,7],[13,8],[13,9],[13,10],[13,11],[13,12],
      [12,12],[11,12],[10,12],[9,12],[8,12],[7,12],[6,12],[6,11],[6,10],[6,9],[6,8],[6,7],
      [5,7],[4,7],[3,7],[2,7],[1,7],[0,7]
    ]
  }
];

const COLS = 20, ROWS = 14;
let CELL = 34;

const TOWER_DEFS = {
  gun:    {cost:60,  dmg:18, range:2.5, rate:1.1, color:'#60a5fa', splash:0,   slow:0,    pierce:false, icon:'🔫', name:'Schütze',       desc:'Schnell & günstig'},
  sniper: {cost:120, dmg:90, range:5.5, rate:0.35,color:'#a855f7', splash:0,   slow:0,    pierce:false, icon:'🎯', name:'Scharfschütze',  desc:'Hoher Schaden'},
  bomb:   {cost:150, dmg:55, range:3,   rate:0.45,color:'#f97316', splash:1.1, slow:0,    pierce:false, icon:'💣', name:'Mörser',         desc:'Flächenschaden'},
  freeze: {cost:90,  dmg:8,  range:3,   rate:0.8, color:'#67e8f9', splash:0.9, slow:.5,   pierce:false, icon:'❄️', name:'Einfrierung',   desc:'Verlangsamt'},
  laser:  {cost:220, dmg:30, range:4.5, rate:0.7, color:'#facc15', splash:0,   slow:0,    pierce:true,  icon:'⚡', name:'Tesla',          desc:'Durchschlag alle'},
  rocket: {cost:300, dmg:120,range:3.5, rate:0.25,color:'#ef4444', splash:1.5, slow:0,    pierce:false, icon:'🚀', name:'Rakete',         desc:'Massiver Schaden'},
};

// Upgrade-Multiplikatoren pro Level (Level 0 = Base)
const UPGRADE_MULT = [
  {dmg:1,    rate:1,    range:1   },
  {dmg:1.65, rate:1.35, range:1.15},
  {dmg:2.8,  rate:1.75, range:1.3 },
];

const ENEMY_TYPES = {
  normal:   {hp:80,   speed:1.0, reward:10, color:'#ef4444', size:.36, score:10,  armor:0},
  fast:     {hp:50,   speed:2.2, reward:15, color:'#f97316', size:.28, score:15,  armor:0},
  tank:     {hp:380,  speed:0.55,reward:30, color:'#8b5cf6', size:.46, score:30,  armor:0},
  armored:  {hp:200,  speed:0.8, reward:25, color:'#64748b', size:.40, score:25,  armor:.45},
  healer:   {hp:150,  speed:1.0, reward:20, color:'#22c55e', size:.35, score:20,  armor:0},
  boss:     {hp:1200, speed:0.38,reward:120,color:'#fbbf24', size:.58, score:150, armor:.2},
};

function waveEnemies(wave) {
  const list = [];
  const count = 8 + wave * 5;
  const types = ['normal'];
  if (wave >= 2)  types.push('fast');
  if (wave >= 4)  types.push('armored');
  if (wave >= 6)  types.push('tank');
  if (wave >= 8)  types.push('healer');
  const isBossWave = wave % 5 === 0 && wave > 0;
  if (isBossWave) list.push({type:'boss', delay:0});
  for (let i = 0; i < count; i++) {
    list.push({type: types[Math.floor(Math.random() * types.length)], delay: i * 0.55});
  }
  return list;
}

// ── STATE ─────────────────────────────────────────────────────────
let canvas, ctx, currentMap = null, currentUser = null;
let towers = [], enemies = [], bullets = [], particles = [];
let lives = 20, gold = 150, score = 0, kills = 0, wave = 0;
let waveActive = false, speed = 1;
let selectedType = 'gun', selectedTower = null;
let animId = null, lastTs = 0;
let spawnQueue = [], spawnTimer = 0;
let gameOverFlag = false;
let PATH_CELLS = [], PATH_SET = new Set();
let hoverCell = null;

// ── MAP SELECTION ─────────────────────────────────────────────────
function buildMapPicker() {
  const grid = document.getElementById('map-grid');
  grid.innerHTML = MAPS.map(m => {
    const cols = COLS, rows = ROWS;
    const pathSet = new Set(m.path.map(([c,r]) => `${c}_${r}`));
    // Mini preview via SVG
    const cellW = 16, cellH = 9;
    const rects = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (pathSet.has(`${c}_${r}`)) {
          rects.push(`<rect x="${c*cellW}" y="${r*cellH}" width="${cellW}" height="${cellH}" fill="${m.pathColor}" stroke="${m.borderColor}" stroke-width=".5"/>`);
        }
      }
    }
    const startC = m.path[0][0], startR = m.path[0][1];
    const endC = m.path[m.path.length-1][0], endR = m.path[m.path.length-1][1];
    return `<div class="map-card" onclick="selectMap('${m.id}')">
      <svg class="map-preview" viewBox="0 0 ${cols*cellW} ${rows*cellH}" style="background:${m.bg}">
        ${rects.join('')}
        <circle cx="${startC*cellW+cellW/2}" cy="${startR*cellH+cellH/2}" r="7" fill="#22c55e"/>
        <circle cx="${endC*cellW+cellW/2}" cy="${endR*cellH+cellH/2}" r="7" fill="#ef4444"/>
      </svg>
      <div class="map-name">${m.name}</div>
      <div class="map-desc">${m.desc}</div>
    </div>`;
  }).join('');
}

function selectMap(id) {
  currentMap = MAPS.find(m => m.id === id);
  PATH_CELLS = currentMap.path;
  PATH_SET = new Set(PATH_CELLS.map(([c,r]) => `${c}_${r}`));
  document.getElementById('screen-map').style.display = 'none';
  document.getElementById('screen-game').style.display = '';
  buildShop();
  initCanvas();
  resetGame();
}

function backToMenu() {
  cancelAnimationFrame(animId);
  gameOverFlag = true;
  document.getElementById('screen-game').style.display = 'none';
  document.getElementById('screen-map').style.display = '';
  document.getElementById('ov-end').classList.add('hidden');
}

// ── CANVAS ────────────────────────────────────────────────────────
function initCanvas() {
  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);
  canvas.addEventListener('click', onCanvasClick);
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    hoverCell = [Math.floor((e.clientX-r.left)/CELL), Math.floor((e.clientY-r.top)/CELL)];
  });
  canvas.addEventListener('mouseleave', () => hoverCell = null);
}

function resize() {
  const w = Math.min(window.innerWidth - 16, 688);
  CELL = Math.floor(w / COLS);
  canvas.width  = CELL * COLS;
  canvas.height = CELL * ROWS;
}

// ── SHOP ─────────────────────────────────────────────────────────
function buildShop() {
  document.getElementById('shop').innerHTML = Object.entries(TOWER_DEFS).map(([type, def]) =>
    `<div class="tower-btn${type===selectedType?' selected':''}" id="tb-${type}" onclick="selectTower('${type}')">
      <span class="tower-icon">${def.icon}</span>
      <span class="tower-name">${def.name}</span>
      <span class="tower-cost">💰${def.cost}</span>
    </div>`
  ).join('');
}

function selectTower(type) {
  selectedType = type;
  selectedTower = null;
  hideTowerPanel();
  document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
  const el = document.getElementById('tb-'+type);
  if (el) el.classList.add('selected');
}

// ── TOWER PANEL ───────────────────────────────────────────────────
function showTowerPanel(t) {
  const def = TOWER_DEFS[t.type];
  const lv = t.level || 0;
  const mult = UPGRADE_MULT[lv];
  const panel = document.getElementById('tower-panel');
  panel.style.display = 'flex';
  document.getElementById('tp-icon').textContent = def.icon;
  document.getElementById('tp-name').textContent = `${def.name} (Lv.${lv+1})`;
  const dmg = Math.round(def.dmg * mult.dmg);
  const rate = (def.rate * mult.rate).toFixed(2);
  const range = (def.range * mult.range).toFixed(1);
  document.getElementById('tp-stats').textContent = `Schaden ${dmg} · Rate ${rate}/s · Reichweite ${range}`;
  document.getElementById('tp-level').innerHTML = [0,1,2].map(i => `<div class="tp-dot${i<=lv?' filled':''}"></div>`).join('');
  const maxLevel = UPGRADE_MULT.length - 1;
  const upgBtn = document.getElementById('btn-upgrade');
  if (lv < maxLevel) {
    const upgCost = Math.floor(def.cost * (lv === 0 ? 0.8 : 1.2));
    upgBtn.textContent = `⬆ Upgrade (💰${upgCost})`;
    upgBtn.disabled = gold < upgCost;
    upgBtn._cost = upgCost;
  } else {
    upgBtn.textContent = 'Max Level';
    upgBtn.disabled = true;
  }
  const sellVal = Math.floor(def.cost * (1 + lv * 0.5) * 0.6);
  document.getElementById('btn-sell-tp').textContent = `🗑 Verkaufen (+${sellVal}💰)`;
  document.getElementById('btn-sell-tp')._val = sellVal;
}

function hideTowerPanel() {
  document.getElementById('tower-panel').style.display = 'none';
}

// ── CONTROLS ─────────────────────────────────────────────────────
function upgradeSelected() {
  if (!selectedTower) return;
  const lv = selectedTower.level || 0;
  if (lv >= UPGRADE_MULT.length - 1) return;
  const def = TOWER_DEFS[selectedTower.type];
  const cost = Math.floor(def.cost * (lv === 0 ? 0.8 : 1.2));
  if (gold < cost) { flashMsg('Nicht genug Gold!'); return; }
  gold -= cost;
  selectedTower.level = lv + 1;
  document.getElementById('gold-val').textContent = gold;
  showTowerPanel(selectedTower);
  updateShopDisabled();
  flashMsg(`${def.icon} Upgrade auf Level ${selectedTower.level+1}!`);
}

function sellSelected() {
  if (!selectedTower) return;
  const lv = selectedTower.level || 0;
  const refund = Math.floor(TOWER_DEFS[selectedTower.type].cost * (1 + lv * 0.5) * 0.6);
  gold += refund;
  document.getElementById('gold-val').textContent = gold;
  towers = towers.filter(t => t !== selectedTower);
  selectedTower = null;
  hideTowerPanel();
  updateShopDisabled();
  flashMsg(`Turm verkauft: +${refund}💰`);
}

function toggleSpeed() {
  speed = speed === 1 ? 2 : speed === 2 ? 3 : 1;
  document.getElementById('btn-speed').textContent = `⚡ ${speed}×`;
}

function updateShopDisabled() {
  Object.entries(TOWER_DEFS).forEach(([type, def]) => {
    const el = document.getElementById('tb-'+type);
    if (el) el.classList.toggle('disabled', gold < def.cost);
  });
  if (selectedTower) showTowerPanel(selectedTower);
}

// ── MAIN LOOP ─────────────────────────────────────────────────────
function loop(ts) {
  if (gameOverFlag) return;
  const dt = Math.min((ts - lastTs) / 1000, 0.1) * speed;
  lastTs = ts;
  update(dt);
  draw();
  animId = requestAnimationFrame(loop);
}

function update(dt) {
  spawnEnemies(dt);
  moveEnemies(dt);
  fireTowers(dt);
  moveBullets(dt);
  updateParticles(dt);
  checkWaveEnd();
}

// ── SPAWNING ──────────────────────────────────────────────────────
function startWave() {
  if (waveActive) return;
  wave++;
  document.getElementById('wave-val').textContent = wave;
  const types = waveEnemies(wave);
  spawnQueue = types;
  spawnTimer = 0;
  waveActive = true;
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-start').style.opacity = '.5';
  if (wave % 5 === 0) flashMsg(`⚠️ Boss-Welle ${wave}!`, 2500);
}

function spawnEnemies(dt) {
  if (!spawnQueue.length) return;
  spawnTimer += dt;
  while (spawnQueue.length && spawnTimer >= spawnQueue[0].delay) {
    const {type} = spawnQueue.shift();
    const def = ENEMY_TYPES[type];
    const scale = 1 + (wave - 1) * 0.12;
    enemies.push({
      hp: def.hp * scale, maxHp: def.hp * scale,
      speed: def.speed, reward: def.reward,
      color: def.color, size: def.size, score: def.score,
      armor: def.armor || 0, type,
      pathIdx: 0,
      x: PATH_CELLS[0][0]*CELL+CELL/2, y: PATH_CELLS[0][1]*CELL+CELL/2,
      slow: 1, slowTimer: 0, healTimer: 0,
      dead: false, reached: false,
    });
  }
}

// ── ENEMY MOVEMENT ────────────────────────────────────────────────
function moveEnemies(dt) {
  for (const e of enemies) {
    if (e.dead || e.reached) continue;
    if (e.slowTimer > 0) e.slowTimer -= dt; else e.slow = 1;
    // Healer heals nearby enemies
    if (e.type === 'healer') {
      e.healTimer = (e.healTimer || 0) - dt;
      if (e.healTimer <= 0) {
        e.healTimer = 2;
        for (const o of enemies) {
          if (o !== e && !o.dead && Math.hypot(o.x-e.x,o.y-e.y) < 2.5*CELL)
            o.hp = Math.min(o.hp + o.maxHp*0.05, o.maxHp);
        }
      }
    }
    const spd = e.speed * e.slow * CELL;
    let dist = spd * dt;
    while (dist > 0 && e.pathIdx < PATH_CELLS.length-1) {
      const [tc,tr] = PATH_CELLS[e.pathIdx+1];
      const tx=tc*CELL+CELL/2, ty=tr*CELL+CELL/2;
      const dx=tx-e.x, dy=ty-e.y, d=Math.hypot(dx,dy);
      if (d<=dist) { e.x=tx; e.y=ty; e.pathIdx++; dist-=d; }
      else { e.x+=dx/d*dist; e.y+=dy/d*dist; dist=0; }
    }
    if (e.pathIdx >= PATH_CELLS.length-1) {
      e.reached=true; lives--;
      document.getElementById('lives-val').textContent=lives;
      if (lives<=0) triggerGameOver();
    }
  }
  enemies = enemies.filter(e=>!e.dead&&!e.reached);
}

// ── TOWERS ────────────────────────────────────────────────────────
function fireTowers(dt) {
  for (const t of towers) {
    const lv = t.level || 0;
    const mult = UPGRADE_MULT[lv];
    const def = TOWER_DEFS[t.type];
    const rate = def.rate * mult.rate;
    const range = def.range * mult.range * CELL;
    t.cooldown = Math.max(0, (t.cooldown||0) - dt);
    if (t.cooldown > 0) continue;
    const targets = enemies.filter(e=>Math.hypot(e.x-t.px,e.y-t.py)<=range)
      .sort((a,b)=>b.pathIdx-a.pathIdx);
    if (!targets.length) continue;
    t.cooldown = 1/rate;
    if (def.pierce) {
      targets.forEach(e=>hitEnemy(e,def,t,lv));
      addLineFx(t,targets[0],def.color);
    } else if (def.splash>0) {
      const tgt=targets[0];
      bullets.push({x:t.px,y:t.py,tx:tgt.x,ty:tgt.y,speed:280,def,tower:t,lv,splash:true,color:def.color});
    } else {
      bullets.push({x:t.px,y:t.py,tx:targets[0].x,ty:targets[0].y,tgtRef:targets[0],speed:380,def,tower:t,lv,splash:false,color:def.color});
    }
  }
}

function hitEnemy(e, def, tower, lv=0) {
  const mult = UPGRADE_MULT[lv||0];
  let dmg = def.dmg * mult.dmg;
  if (e.armor > 0) dmg *= (1 - e.armor);
  e.hp -= dmg;
  if (def.slow) { e.slow = def.slow; e.slowTimer = 1.8; }
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead=true; gold+=e.reward; score+=e.score; kills++;
  document.getElementById('gold-val').textContent=gold;
  document.getElementById('score-val').textContent=score;
  document.getElementById('kills-val').textContent=kills;
  spawnDeathFx(e);
  updateShopDisabled();
}

// ── BULLETS ───────────────────────────────────────────────────────
function moveBullets(dt) {
  for (const b of bullets) {
    const dx=b.tx-b.x, dy=b.ty-b.y, d=Math.hypot(dx,dy), move=b.speed*dt;
    if (d<=move) {
      b.done=true;
      if (b.splash) {
        const r=(b.def.splash*(UPGRADE_MULT[b.lv||0].range||1))*CELL;
        enemies.forEach(e=>{if(Math.hypot(e.x-b.tx,e.y-b.ty)<=r)hitEnemy(e,b.def,b.tower,b.lv);});
        spawnExplosionFx(b.tx,b.ty,b.color);
      } else {
        if(b.tgtRef&&!b.tgtRef.dead) hitEnemy(b.tgtRef,b.def,b.tower,b.lv);
        spawnImpactFx(b.tx,b.ty,b.color);
      }
    } else { b.x+=dx/d*move; b.y+=dy/d*move; }
  }
  bullets=bullets.filter(b=>!b.done);
}

// ── PARTICLES ─────────────────────────────────────────────────────
function spawnDeathFx(e) {
  for(let i=0;i<8;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*70;
    particles.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5,maxLife:.5,color:e.color,r:3});}
}
function spawnExplosionFx(x,y,color) {
  for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*110;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.7,maxLife:.7,color,r:5});}
}
function spawnImpactFx(x,y,color){particles.push({x,y,vx:0,vy:0,life:.18,maxLife:.18,color,r:7});}
function addLineFx(t,e,color){particles.push({x:t.px,y:t.py,tx:e.x,ty:e.y,line:true,life:.1,maxLife:.1,color});}
function updateParticles(dt){
  particles.forEach(p=>{p.life-=dt;if(!p.line){p.x+=p.vx*dt;p.y+=p.vy*dt;}});
  particles=particles.filter(p=>p.life>0);
}

// ── DRAW ──────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawMap(); drawRangeCircle(); drawTowers(); drawEnemies(); drawBullets(); drawParticles(); drawHover();
}

function drawMap() {
  const m=currentMap;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
    const isPath=PATH_SET.has(`${c}_${r}`);
    ctx.fillStyle=isPath?m.pathColor:m.bg;
    ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
    ctx.strokeStyle=isPath?m.borderColor:'#161b22';
    ctx.lineWidth=.5;ctx.strokeRect(c*CELL,r*CELL,CELL,CELL);
    if(isPath){ctx.fillStyle=m.borderColor;ctx.fillRect(c*CELL+2,r*CELL+2,CELL-4,CELL-4);}
  }
  ctx.font=`${CELL*.5}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const[sc,sr]=PATH_CELLS[0],[ec,er]=PATH_CELLS[PATH_CELLS.length-1];
  ctx.fillText('▶',sc*CELL+CELL/2,sr*CELL+CELL/2);
  ctx.fillText('🏁',ec*CELL+CELL/2,er*CELL+CELL/2);
}

function drawRangeCircle() {
  if(!selectedTower) return;
  const def=TOWER_DEFS[selectedTower.type], lv=selectedTower.level||0;
  const range=def.range*UPGRADE_MULT[lv].range*CELL;
  ctx.beginPath();ctx.arc(selectedTower.px,selectedTower.py,range,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.stroke();
}

function drawTowers() {
  for(const t of towers) {
    const def=TOWER_DEFS[t.type], lv=t.level||0, sel=t===selectedTower;
    const r=CELL*.42;
    ctx.fillStyle=sel?'#1f2937':'#111827';
    ctx.strokeStyle=sel?'#f97316':def.color;
    ctx.lineWidth=sel?2.5:1.5;
    roundRect(ctx,t.px-r,t.py-r,r*2,r*2,5);ctx.fill();ctx.stroke();
    ctx.font=`${CELL*.46}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(def.icon,t.px,t.py);
    if(lv>0){
      ctx.fillStyle='#f97316';ctx.font=`bold ${CELL*.28}px sans-serif`;
      ctx.fillText('★'.repeat(lv),t.px,t.py+r*.7);
    }
  }
}

function drawEnemies() {
  for(const e of enemies) {
    if(e.dead) continue;
    const r=CELL*e.size;
    ctx.beginPath();ctx.ellipse(e.x,e.y+r*.75,r*.65,r*.22,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fill();
    ctx.beginPath();ctx.arc(e.x,e.y,r,0,Math.PI*2);
    const frozen=e.slowTimer>0;
    ctx.fillStyle=e.armor>.3?'#475569':frozen?'#67e8f9':e.color;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.stroke();
    if(e.type==='healer'){ctx.font=`${r}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💚',e.x,e.y);}
    const bw=r*2.4,bh=4;
    ctx.fillStyle='#1f2937';ctx.fillRect(e.x-bw/2,e.y-r-9,bw,bh);
    const pct=e.hp/e.maxHp;
    ctx.fillStyle=pct>.5?'#22c55e':pct>.25?'#f59e0b':'#ef4444';
    ctx.fillRect(e.x-bw/2,e.y-r-9,bw*pct,bh);
    if(e.armor>.0){
      ctx.fillStyle='rgba(100,116,139,.6)';ctx.fillRect(e.x-bw/2,e.y-r-9,bw*e.armor,bh);
    }
  }
}

function drawBullets() {
  for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fillStyle=b.color;ctx.fill();}
}

function drawParticles() {
  for(const p of particles){
    const alpha=p.life/p.maxLife;
    const hex=Math.round(alpha*255).toString(16).padStart(2,'0');
    if(p.line){
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.tx,p.ty);
      ctx.strokeStyle=p.color+hex;ctx.lineWidth=2;ctx.stroke();
    } else {
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*alpha,0,Math.PI*2);
      ctx.fillStyle=p.color+hex;ctx.fill();
    }
  }
}

function drawHover() {
  if(!hoverCell) return;
  const[c,r]=hoverCell;
  if(!isValidPlacement(c,r)) return;
  const def=TOWER_DEFS[selectedType], range=def.range*CELL;
  ctx.fillStyle='rgba(249,115,22,.12)';ctx.strokeStyle='rgba(249,115,22,.5)';ctx.lineWidth=1.5;
  ctx.fillRect(c*CELL,r*CELL,CELL,CELL);ctx.strokeRect(c*CELL,r*CELL,CELL,CELL);
  ctx.beginPath();ctx.arc(c*CELL+CELL/2,r*CELL+CELL/2,range,0,Math.PI*2);
  ctx.fillStyle='rgba(249,115,22,.06)';ctx.fill();
  ctx.strokeStyle='rgba(249,115,22,.22)';ctx.stroke();
}

// ── INTERACTION ───────────────────────────────────────────────────
function onCanvasClick(e) {
  const rect=canvas.getBoundingClientRect();
  const col=Math.floor((e.clientX-rect.left)/CELL), row=Math.floor((e.clientY-rect.top)/CELL);
  const clicked=towers.find(t=>t.col===col&&t.row===row);
  if(clicked){selectedTower=clicked;showTowerPanel(clicked);return;}
  selectedTower=null;hideTowerPanel();
  if(!isValidPlacement(col,row)){flashMsg('Hier kein Turm möglich!');return;}
  const def=TOWER_DEFS[selectedType];
  if(gold<def.cost){flashMsg('Nicht genug Gold!');return;}
  gold-=def.cost;document.getElementById('gold-val').textContent=gold;
  towers.push({type:selectedType,col,row,px:col*CELL+CELL/2,py:row*CELL+CELL/2,cooldown:0,level:0});
  updateShopDisabled();
}

function isValidPlacement(col,row) {
  if(col<0||col>=COLS||row<0||row>=ROWS) return false;
  if(PATH_SET.has(`${col}_${row}`)) return false;
  if(towers.find(t=>t.col===col&&t.row===row)) return false;
  return true;
}

// ── WAVE END ──────────────────────────────────────────────────────
function checkWaveEnd() {
  if(!waveActive||spawnQueue.length||enemies.length) return;
  waveActive=false;
  const bonus=wave*25;gold+=bonus;
  document.getElementById('gold-val').textContent=gold;
  document.getElementById('btn-start').disabled=false;
  document.getElementById('btn-start').style.opacity='1';
  flashMsg(`Welle ${wave} geschafft! +${bonus}💰`,2000);
  updateShopDisabled();
}

// ── GAME OVER ─────────────────────────────────────────────────────
function triggerGameOver() {
  if(gameOverFlag) return;
  gameOverFlag=true;cancelAnimationFrame(animId);submitScore();
  document.getElementById('ov-title').textContent='💀 Game Over';
  document.getElementById('ov-sub').textContent=`Welle ${wave} · ${score.toLocaleString('de-DE')} Punkte · ${kills} Kills`;
  document.getElementById('ov-end').classList.remove('hidden');
}

function resetGame() {
  cancelAnimationFrame(animId);
  towers=[];enemies=[];bullets=[];particles=[];
  lives=20;gold=150;score=0;kills=0;wave=0;
  waveActive=false;speed=1;selectedTower=null;gameOverFlag=false;
  spawnQueue=[];spawnTimer=0;lastTs=0;
  document.getElementById('lives-val').textContent=20;
  document.getElementById('gold-val').textContent=150;
  document.getElementById('wave-val').textContent=0;
  document.getElementById('score-val').textContent=0;
  document.getElementById('kills-val').textContent=0;
  document.getElementById('btn-start').disabled=false;
  document.getElementById('btn-start').style.opacity='1';
  document.getElementById('btn-speed').textContent='⚡ 1×';
  document.getElementById('ov-end').classList.add('hidden');
  hideTowerPanel();updateShopDisabled();
  requestAnimationFrame(loop);
}

function restartGame() {
  document.getElementById('ov-end').classList.add('hidden');
  resetGame();
}

// ── LEADERBOARD ───────────────────────────────────────────────────
async function submitScore() {
  if(!currentUser||wave<1) return;
  try { await fetch('/api/game-scores/towerdefense',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({score})}); } catch {}
}

async function openLb() {
  await submitScore();
  document.getElementById('ov-lb').classList.remove('hidden');
  const el=document.getElementById('lb-list');
  el.innerHTML='<div style="text-align:center;padding:14px;color:#8b949e">Laden…</div>';
  try {
    const data=await (await fetch('/api/game-scores/towerdefense')).json();
    if(!data.length){el.innerHTML='<div style="text-align:center;padding:14px;color:#8b949e">Noch keine Einträge</div>';return;}
    el.innerHTML=data.map((row,i)=>{
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
      const me=currentUser&&row.discord_id===currentUser.discord_id;
      const av=row.avatar?`<img src="https://cdn.discordapp.com/avatars/${row.discord_id}/${row.avatar}.png" onerror="this.style.display='none'">`:(row.username||'?').slice(0,2).toUpperCase();
      return `<div class="lb-row" style="${me?'background:#1a0e00;border-radius:6px;':''}">
        <div class="lb-rank">${medal}</div>
        <div class="lb-av">${av}</div>
        <div class="lb-name">${row.username||'Unbekannt'}</div>
        <div class="lb-score">${row.score.toLocaleString('de-DE')} Pkt.</div>
      </div>`;
    }).join('');
  } catch {el.innerHTML='<div style="text-align:center;color:#ef4444">Fehler</div>';}
}

// ── HELPERS ───────────────────────────────────────────────────────
function flashMsg(text,dur=1800){
  const el=document.getElementById('msg');el.textContent=text;el.style.opacity='1';
  clearTimeout(flashMsg._t);flashMsg._t=setTimeout(()=>el.style.opacity='0',dur);
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

// ── INIT ──────────────────────────────────────────────────────────
(async()=>{try{const r=await fetch('/auth/me');if(r.ok)currentUser=await r.json();}catch{}})();
buildMapPicker();
window.addEventListener('resize',()=>{if(canvas)resize();});
</script>
