<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ACLS Autorennen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: .6rem;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 360px;
    }
    .back-btn {
      background: transparent;
      border: 1px solid rgba(249,115,22,.4);
      color: #f97316;
      padding: .28rem .65rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: .8rem;
      transition: background .15s;
      text-decoration: none;
    }
    .back-btn:hover { background: rgba(249,115,22,.12); }
    h1 { font-size: 1rem; color: #f97316; font-weight: 700; flex: 1; }
    .hiscore { font-size: .78rem; color: #64748b; white-space: nowrap; }
    canvas { display: block; border-radius: 10px; border: 2px solid rgba(249,115,22,.2); }
    .hint { font-size: .7rem; color: #374151; }
    body { overflow-y: auto; justify-content: flex-start; padding: .8rem 0 1.5rem; }
    .lb { width: 360px; background: #111827; border: 1px solid rgba(249,115,22,.18); border-radius: 10px; padding: .6rem .7rem; }
    .lb-title { font-size: .72rem; font-weight: 700; color: #f97316; text-transform: uppercase; letter-spacing: .06em; margin-bottom: .45rem; }
    .lb-row { display: flex; align-items: center; gap: .55rem; padding: .22rem .25rem; border-radius: 5px; font-size: .82rem; }
    .lb-row.me { background: rgba(249,115,22,.13); }
    .lb-rank { width: 1.4rem; text-align: right; font-size: .72rem; color: #64748b; flex-shrink: 0; }
    .lb-rank.gold   { color: #fbbf24; font-weight: 700; }
    .lb-rank.silver { color: #94a3b8; font-weight: 700; }
    .lb-rank.bronze { color: #c2410c; font-weight: 700; }
    .lb-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: #1e293b; flex-shrink: 0; }
    .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-score { font-weight: 700; color: #f97316; flex-shrink: 0; }
    .lb-empty { font-size: .78rem; color: #4b5563; text-align: center; padding: .5rem 0; }

    .tabs { display: flex; gap: .4rem; width: 360px; }
    .tab-btn { flex: 1; padding: .4rem; background: #111827; border: 1px solid rgba(249,115,22,.18); border-radius: 8px; color: #94a3b8; font-size: .78rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .tab-btn.active { background: rgba(249,115,22,.15); color: #f97316; border-color: #f97316; }
    .panel { width: 360px; }
    .panel[hidden] { display: none; }
    .subtabs { display: flex; gap: .35rem; margin-bottom: .5rem; }
    .subtab-btn { flex: 1; padding: .3rem; background: #0f172a; border: 1px solid rgba(255,255,255,.08); border-radius: 6px; color: #64748b; font-size: .72rem; cursor: pointer; font-family: inherit; }
    .subtab-btn.active { color: #e2e8f0; border-color: rgba(249,115,22,.4); }
    .track-row { display: flex; align-items: center; gap: .5rem; padding: .4rem .25rem; border-bottom: 1px solid rgba(255,255,255,.05); font-size: .8rem; }
    .track-row:last-child { border-bottom: none; }
    .track-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .track-meta { font-size: .66rem; color: #64748b; }
    .btn-sm { background: #f97316; color: #000; border: none; border-radius: 6px; padding: .32rem .65rem; font-size: .72rem; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit; }
    .btn-sm.alt { background: transparent; border: 1px solid rgba(249,115,22,.4); color: #f97316; }
    .editor-field { display: block; width: 100%; background: #0f172a; color: #e2e8f0; border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: .4rem .5rem; font-size: .8rem; font-family: inherit; margin-bottom: .5rem; }
    .editor-grid { display: flex; flex-direction: column; gap: 2px; overflow-x: auto; background: #0a0e1a; border-radius: 6px; padding: 4px; margin-bottom: .5rem; }
    .editor-lane { display: flex; gap: 2px; }
    .editor-cell { width: 13px; height: 24px; background: #1e2030; border-radius: 2px; flex-shrink: 0; cursor: pointer; }
    .editor-cell.active { background: #f97316; }
    .editor-actions { display: flex; gap: .4rem; }
    .editor-actions .btn-sm { flex: 1; }
    .track-current-box { background: rgba(249,115,22,.08); border: 1px solid rgba(249,115,22,.25); border-radius: 8px; padding: .5rem; margin-bottom: .6rem; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="back-btn" href="/" onclick="window.close()">← Zurück</a>
    <h1>🏎️ ACLS Autorennen</h1>
    <div class="hiscore">Rekord: <span id="hs">0</span></div>
  </div>
  <canvas id="c" width="360" height="580"></canvas>
  <div class="hint">← → / A D zum Lenken &nbsp;·&nbsp; Space oder Klick zum Starten</div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-endless" onclick="switchMode('endless')">🏁 Endlos</button>
    <button class="tab-btn" id="tab-track" onclick="switchMode('track')">🛣️ Strecken</button>
  </div>

  <div class="panel" id="endless-panel">
    <div class="lb">
      <div class="lb-title">🏆 Rangliste – Autorennen</div>
      <div id="lb-list"><div class="lb-empty">Lade…</div></div>
    </div>
  </div>

  <div class="panel" id="track-panel" hidden>
    <div class="subtabs">
      <button class="subtab-btn active" id="subtab-browse" onclick="switchTrackSub('browse')">📜 Strecken</button>
      <button class="subtab-btn" id="subtab-editor" onclick="switchTrackSub('editor')">✏️ Editor</button>
    </div>

    <div id="track-browse-view">
      <div id="track-current-box"></div>
      <div class="lb">
        <div class="lb-title">📜 Veröffentlichte Strecken</div>
        <div id="track-list"><div class="lb-empty">Lade…</div></div>
      </div>
    </div>

    <div id="track-editor-view" hidden>
      <div class="lb">
        <div class="lb-title">✏️ Strecke bauen</div>
        <input class="editor-field" id="editor-name" maxlength="40" placeholder="Name der Strecke">
        <select class="editor-field" id="editor-duration" onchange="onEditorDurationChange()">
          <option value="20000">20 Sekunden</option>
          <option value="40000" selected>40 Sekunden</option>
          <option value="60000">60 Sekunden</option>
        </select>
        <div style="font-size:.68rem;color:#64748b;margin-bottom:.4rem">Klicke Felder an, um Gegner-Autos zu platzieren (Spur × Zeit).</div>
        <div class="editor-grid" id="editor-grid"></div>
        <div class="editor-actions">
          <button class="btn-sm alt" onclick="testEditorTrack()">🧪 Testen</button>
          <button class="btn-sm" onclick="publishEditorTrack()">📤 Veröffentlichen</button>
        </div>
      </div>
    </div>
  </div>

  <script>
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const HS_KEY = 'acls_game_hs';

    let hiScore = parseInt(localStorage.getItem(HS_KEY) || '0');
    document.getElementById('hs').textContent = hiScore;

    // Road layout
    const RL = 44, RR = W - 44;
    const RW = RR - RL;
    const LW = RW / 3;
    const LANES = [RL + LW * 0.5, RL + LW * 1.5, RL + LW * 2.5];

    // Car sizes
    const PW = 36, PH = 62;
    const EW = 34, EH = 58;

    const ENEMY_COLORS = ['#ef4444','#3b82f6','#22c55e','#a855f7','#ec4899','#0ea5e9','#f59e0b'];

    // State
    let state = 'idle';
    let score, lives, speed, frame, invincible;
    let player, enemies, particles, dashOff, spawnTimer, spawnInterval, speedTimer;

    // Strecken-Modus (Editor + Ghost-Rennen)
    let mode = 'endless'; // 'endless' | 'track'
    let currentTrack = null; // { id, durationMs, pattern, ghost, token, ts }
    let testMode = false;
    let trackStartTs = 0, trackElapsed = 0, nextPatternIdx = 0, recording = [];
    let ghostCar = null;

    function reset() {
      score = 0; lives = 3; speed = 3.0; frame = 0; invincible = 0;
      player   = { lane: 1, x: LANES[1], targetX: LANES[1], y: H - 95 };
      enemies  = []; particles = [];
      dashOff  = 0; spawnTimer = 0; spawnInterval = 110; speedTimer = 0;
      ghostCar = null;
      if (mode === 'track' && currentTrack) {
        trackStartTs = performance.now();
        trackElapsed = 0;
        nextPatternIdx = 0;
        recording = [{ t: 0, lane: 1 }];
      }
    }

    function tryStart() {
      if (mode === 'track' && !currentTrack) return;
      reset();
      state = 'playing';
    }

    function spawnEnemy() {
      const lane = Math.floor(Math.random() * 3);
      // never spawn on same lane as previous enemy that's still near top
      const blocked = enemies.some(e => e.lane === lane && e.y < EH * 2);
      const realLane = blocked ? (lane + 1 + Math.floor(Math.random() * 2)) % 3 : lane;
      enemies.push({
        lane: realLane,
        x: LANES[realLane],
        y: -EH - 10,
        color: ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)],
        spd: speed * (0.75 + Math.random() * 0.5),
      });
    }

    function burst(x, y, color) {
      for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = 2 + Math.random() * 5;
        particles.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 1, r: 2+Math.random()*3, color });
      }
    }

    function hit(player, enemy) {
      const mx = 9;
      return Math.abs(player.x - enemy.x) < (PW/2 + EW/2 - mx) &&
             Math.abs(player.y - enemy.y) < (PH/2 + EH/2 - mx);
    }

    // Input
    const keys = {};
    let moveCd = 0;

    document.addEventListener('keydown', e => {
      if (['ArrowLeft','ArrowRight','a','A','d','D',' ','Enter'].includes(e.key)) e.preventDefault();
      keys[e.key] = true;
      if ((e.key === ' ' || e.key === 'Enter') && state !== 'playing') tryStart();
    });
    document.addEventListener('keyup', e => { delete keys[e.key]; });

    canvas.addEventListener('click', () => { if (state !== 'playing') tryStart(); });

    // Swipe
    let swipeX = null;
    canvas.addEventListener('touchstart', e => {
      swipeX = e.touches[0].clientX;
      if (state !== 'playing') tryStart();
    }, { passive: true });
    canvas.addEventListener('touchend', e => {
      if (swipeX == null) return;
      const dx = e.changedTouches[0].clientX - swipeX;
      if (Math.abs(dx) > 28) moveLane(dx > 0 ? 1 : -1);
      swipeX = null;
    }, { passive: true });

    function moveLane(dir) {
      const n = Math.max(0, Math.min(2, player.lane + dir));
      if (n !== player.lane) {
        player.lane = n; player.targetX = LANES[n];
        if (mode === 'track' && state === 'playing') recording.push({ t: Math.round(trackElapsed), lane: n });
      }
    }

    // Update
    function update() {
      if (state !== 'playing') return;
      frame++;

      // Input
      if (moveCd > 0) moveCd--;
      if (moveCd === 0) {
        if ((keys['ArrowLeft']  || keys['a'] || keys['A']) && player.lane > 0) { moveLane(-1); moveCd = 13; }
        if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.lane < 2) { moveLane( 1); moveCd = 13; }
      }
      player.x += (player.targetX - player.x) * 0.2;

      // Road scroll
      dashOff = (dashOff + speed) % 50;

      // Speed ramp every 5 seconds (300 frames at 60fps)
      speedTimer++;
      if (speedTimer >= 300) {
        speedTimer = 0;
        speed = Math.min(10, speed + 0.35);
        spawnInterval = Math.max(55, spawnInterval - 5);
      }

      // Score (1 point every 5 frames)
      if (frame % 5 === 0) score++;

      if (mode === 'track' && currentTrack) {
        trackElapsed = performance.now() - trackStartTs;
        while (nextPatternIdx < currentTrack.pattern.length && currentTrack.pattern[nextPatternIdx].t <= trackElapsed) {
          const p = currentTrack.pattern[nextPatternIdx++];
          enemies.push({ lane: p.lane, x: LANES[p.lane], y: -EH - 10, color: ENEMY_COLORS[p.lane % ENEMY_COLORS.length], spd: speed });
        }
        if (currentTrack.ghost) {
          const gl = ghostLaneAt(trackElapsed);
          if (!ghostCar) ghostCar = { x: LANES[gl], targetX: LANES[gl], y: player.y };
          ghostCar.targetX = LANES[gl];
          ghostCar.x += (ghostCar.targetX - ghostCar.x) * 0.2;
        }
      } else {
        // Spawn
        spawnTimer++;
        if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnEnemy(); }
      }

      // Move enemies + collision
      enemies = enemies.filter(e => e.y < H + 80);
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.spd;
        if (invincible <= 0 && hit(player, e)) {
          burst(player.x, player.y, '#f97316');
          enemies.splice(i, 1);
          lives--;
          invincible = 100;
          if (lives <= 0) {
            state = 'dead';
            if (mode === 'track') {
              finishTrackRun(false);
            } else {
              if (score > hiScore) {
                hiScore = score;
                localStorage.setItem(HS_KEY, hiScore);
                document.getElementById('hs').textContent = hiScore;
              }
              submitScore(score);
            }
          }
          break;
        }
      }

      if (invincible > 0) invincible--;

      if (mode === 'track' && state === 'playing' && currentTrack && trackElapsed >= currentTrack.durationMs) {
        state = 'finished';
        finishTrackRun(true);
      }

      // Particles
      particles = particles.filter(p => p.life > 0.01);
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.18;
        p.vx *= 0.97;
        p.life -= 0.028;
        p.r   *= 0.96;
      }
    }

    // Draw helpers
    function drawCar(x, y, w, h, color, isPlayer) {
      const lx = x - w/2, ty = y - h/2;

      // Drop shadow
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.beginPath();
      ctx.ellipse(x, ty + h - 4, w/2 - 2, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Body
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.roundRect(lx, ty + 7, w, h - 14, 7); ctx.fill();

      // Roof (darker)
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.beginPath(); ctx.roundRect(lx + 5, ty + 17, w - 10, h - 32, 5); ctx.fill();

      // Windows
      ctx.fillStyle = 'rgba(147,210,255,.25)';
      ctx.beginPath(); ctx.roundRect(lx + 6, ty + 18, w - 12, h - 34, 4); ctx.fill();

      // Headlights (front of player = top, front of enemy = bottom)
      const frontY = isPlayer ? ty + 7  : ty + h - 12;
      const backY  = isPlayer ? ty + h - 12 : ty + 7;
      ctx.fillStyle = '#fef9c3';
      ctx.beginPath(); ctx.roundRect(lx + 3,     frontY, 9, 5, 2); ctx.fill();
      ctx.beginPath(); ctx.roundRect(lx + w - 12, frontY, 9, 5, 2); ctx.fill();
      ctx.fillStyle = '#dc2626';
      ctx.beginPath(); ctx.roundRect(lx + 3,     backY, 9, 5, 2); ctx.fill();
      ctx.beginPath(); ctx.roundRect(lx + w - 12, backY, 9, 5, 2); ctx.fill();

      // Orange stripe on player
      if (isPlayer) {
        ctx.fillStyle = 'rgba(249,115,22,.6)';
        ctx.beginPath(); ctx.roundRect(lx + 2, ty + h/2 - 3, w - 4, 6, 3); ctx.fill();
      }
    }

    function drawRoad() {
      // Sky / background
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, W, H);

      // Grass
      ctx.fillStyle = '#14301a';
      ctx.fillRect(0, 0, RL, H);
      ctx.fillRect(RR, 0, W - RR, H);

      // Road surface
      const grad = ctx.createLinearGradient(RL, 0, RR, 0);
      grad.addColorStop(0,   '#1e2030');
      grad.addColorStop(0.5, '#252840');
      grad.addColorStop(1,   '#1e2030');
      ctx.fillStyle = grad;
      ctx.fillRect(RL, 0, RW, H);

      // Edge lines
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3;
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(RL, 0); ctx.lineTo(RL, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(RR, 0); ctx.lineTo(RR, H); ctx.stroke();

      // Lane dashes
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      ctx.lineWidth = 2;
      ctx.setLineDash([28, 22]);
      ctx.lineDashOffset = -dashOff;
      for (let i = 1; i < 3; i++) {
        const lx = RL + LW * i;
        ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, H); ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function drawHUD() {
      // Score box
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath(); ctx.roundRect(6, 6, 110, 30, 6); ctx.fill();
      ctx.fillStyle = '#f97316';
      ctx.font = 'bold 15px Segoe UI, system-ui';
      ctx.textAlign = 'left';
      ctx.fillText(`Score: ${score}`, 14, 26);

      // Lives
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath(); ctx.roundRect(W - 80, 6, 74, 30, 6); ctx.fill();
      ctx.font = '16px Segoe UI';
      ctx.textAlign = 'right';
      const hearts = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
      ctx.fillText(hearts, W - 8, 26);

      // Speed bar at bottom
      const pct = (speed - 4) / (14 - 4);
      ctx.fillStyle = 'rgba(0,0,0,.4)';
      ctx.beginPath(); ctx.roundRect(RL, H - 18, RW, 10, 5); ctx.fill();
      ctx.fillStyle = `hsl(${120 - pct * 120}, 80%, 50%)`;
      ctx.beginPath(); ctx.roundRect(RL, H - 18, RW * pct, 10, 5); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.font = '9px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText(`${Math.round(speed * 22)} km/h`, W/2, H - 10);

      // Streckenfortschritt (Strecken-Modus)
      if (mode === 'track' && currentTrack) {
        const pct = Math.min(1, trackElapsed / currentTrack.durationMs);
        ctx.fillStyle = 'rgba(0,0,0,.4)';
        ctx.beginPath(); ctx.roundRect(RL, 40, RW, 8, 4); ctx.fill();
        ctx.fillStyle = '#f97316';
        ctx.beginPath(); ctx.roundRect(RL, 40, RW * pct, 8, 4); ctx.fill();
      }
    }

    function drawOverlay(title, line1, line2) {
      ctx.fillStyle = 'rgba(0,0,0,.75)';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#f97316';
      ctx.font = 'bold 30px Segoe UI, system-ui';
      ctx.fillText(title, W/2, H/2 - 50);

      if (line1) {
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '15px Segoe UI';
        ctx.fillText(line1, W/2, H/2 - 10);
      }
      if (line2) {
        ctx.fillStyle = '#64748b';
        ctx.font = '13px Segoe UI';
        ctx.fillText(line2, W/2, H/2 + 16);
      }

      // Pulsing button
      const p = 0.82 + 0.18 * Math.sin(Date.now() / 280);
      ctx.fillStyle = `rgba(249,115,22,${p})`;
      ctx.beginPath(); ctx.roundRect(W/2 - 85, H/2 + 45, 170, 44, 9); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Segoe UI';
      ctx.fillText(state === 'idle' ? '▶   Spiel starten' : '▶   Nochmal spielen', W/2, H/2 + 72);
    }

    function draw() {
      drawRoad();

      // Particles
      for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (const e of enemies) drawCar(e.x, e.y, EW, EH, e.color, false);

      // Ghost (beste Aufnahme auf dieser Strecke) — halbtransparent, ohne Kollision
      if (mode === 'track' && ghostCar && (state === 'playing' || state === 'finished' || state === 'dead')) {
        ctx.globalAlpha = 0.4;
        drawCar(ghostCar.x, ghostCar.y, PW, PH, '#94a3b8', true);
        ctx.globalAlpha = 1;
      }

      // Player blinks when invincible
      if (invincible <= 0 || Math.floor(invincible / 7) % 2 === 0) {
        drawCar(player.x, player.y, PW, PH, '#f97316', true);
      }

      drawHUD();

      if (state === 'idle') {
        if (mode === 'track' && currentTrack) {
          drawOverlay('🛣️ ' + (currentTrack.name || 'Test-Strecke'), 'Bereit?', '← → oder A D zum Lenken');
        } else if (mode === 'track') {
          drawOverlay('🛣️ Strecken-Modus', 'Wähle unten eine Strecke', 'oder baue eine im Editor');
        } else {
          drawOverlay('🏎️ ACLS Autorennen', 'Weiche den Autos aus!', '← → oder A D zum Lenken');
        }
      } else if (state === 'dead') {
        if (mode === 'track') {
          drawOverlay('💥 Crash!', `Strecke verlassen bei ${(trackElapsed/1000).toFixed(1)}s`, `Ziel: ${(currentTrack.durationMs/1000).toFixed(0)}s`);
        } else {
          const isNew = score >= hiScore && score > 0;
          drawOverlay(
            '💥 Game Over',
            `Punkte: ${score}${isNew ? '  🏆 Neuer Rekord!' : ''}`,
            `Bestleistung: ${hiScore}`
          );
        }
      } else if (state === 'finished') {
        const ghostTxt = currentTrack.ghost?.finishMs != null ? `Ghost: ${(currentTrack.ghost.finishMs/1000).toFixed(1)}s` : 'Erster Finisher!';
        drawOverlay('🏁 Ziel erreicht!', `Zeit: ${(currentTrack.durationMs/1000).toFixed(1)}s`, ghostTxt);
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    reset();
    loop();

    // ── Rangliste ─────────────────────────────────────────────────
    let currentUserId = null;

    const MEDAL = ['🥇','🥈','🥉'];
    const MEDAL_CLASS = ['gold','silver','bronze'];

    function avatarUrl(discordId, avatar) {
      return avatar ? `https://cdn.discordapp.com/avatars/${discordId}/${avatar}.png?size=32` : '';
    }

    async function refreshLeaderboard() {
      const rows = await fetch('/api/game-scores/race').then(r => r.ok ? r.json() : []).catch(() => []);
      const list = document.getElementById('lb-list');
      if (!rows.length) { list.innerHTML = '<div class="lb-empty">Noch keine Einträge</div>'; return; }
      list.innerHTML = rows.map((r, i) => {
        const isMe = r.user_id === currentUserId;
        const av   = avatarUrl(r.discord_id, r.avatar);
        const medal = i < 3 ? MEDAL[i] : `${i+1}.`;
        const cls   = i < 3 ? MEDAL_CLASS[i] : '';
        return `<div class="lb-row${isMe ? ' me' : ''}">
          <span class="lb-rank ${cls}">${medal}</span>
          ${av ? `<img class="lb-avatar" src="${av}" onerror="this.style.display='none'">` : '<div class="lb-avatar"></div>'}
          <span class="lb-name" style="${isMe ? 'color:#f97316;font-weight:700' : ''}">${esc(r.username)}</span>
          <span class="lb-score">${r.score.toLocaleString()}</span>
        </div>`;
      }).join('');
    }

    async function submitScore(score) {
      await fetch('/api/game-scores/race', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(GameAuth.body(score)),
      }).catch(() => {});
      refreshLeaderboard();
    }

    // ── Strecken-Modus: Tabs ─────────────────────────────────────
    function switchMode(m) {
      if (state === 'playing' || m === mode) return;
      mode = m;
      document.getElementById('tab-endless').classList.toggle('active', m === 'endless');
      document.getElementById('tab-track').classList.toggle('active', m === 'track');
      document.getElementById('endless-panel').hidden = m !== 'endless';
      document.getElementById('track-panel').hidden = m !== 'track';
      state = 'idle';
      if (m === 'endless') currentTrack = null;
      else loadTrackList();
    }

    function switchTrackSub(sub) {
      document.getElementById('subtab-browse').classList.toggle('active', sub === 'browse');
      document.getElementById('subtab-editor').classList.toggle('active', sub === 'editor');
      document.getElementById('track-browse-view').hidden = sub !== 'browse';
      document.getElementById('track-editor-view').hidden = sub !== 'editor';
      if (sub === 'editor' && !editorGridBuilt) { buildEditorGrid(); editorGridBuilt = true; }
    }

    // ── Strecken-Browser ─────────────────────────────────────────
    async function loadTrackList() {
      const el = document.getElementById('track-list');
      try {
        const rows = await fetch('/api/tracks').then(r => r.ok ? r.json() : []);
        if (!rows.length) { el.innerHTML = '<div class="lb-empty">Noch keine Strecken — sei der Erste!</div>'; return; }
        el.innerHTML = rows.map(t => `<div class="track-row">
          <div style="flex:1;min-width:0">
            <div class="track-name">${esc(t.name)}</div>
            <div class="track-meta">von ${esc(t.author_name)} · ${(t.duration_ms/1000).toFixed(0)}s${t.best_time_ms != null ? ' · 🏁 ' + (t.best_time_ms/1000).toFixed(1) + 's' : ''} · ${t.racers} Fahrer</div>
          </div>
          <button class="btn-sm" onclick="playTrack(${t.id})">▶ Spielen</button>
        </div>`).join('');
      } catch { el.innerHTML = '<div class="lb-empty">Fehler beim Laden</div>'; }
    }

    async function playTrack(id) {
      const detail = await fetch('/api/tracks/' + id).then(r => r.ok ? r.json() : null).catch(() => null);
      if (!detail) return;
      const tr = await fetch('/api/game-token/track_' + id).then(r => r.ok ? r.json() : null).catch(() => null);
      currentTrack = { id: detail.id, name: detail.name, durationMs: detail.durationMs, pattern: detail.pattern, ghost: detail.ghost, token: tr?.token, ts: tr?.ts };
      testMode = false;
      renderCurrentTrackBox();
      loadTrackLeaderboard(id);
      tryStart();
    }

    function backToBrowse() {
      currentTrack = null;
      renderCurrentTrackBox();
      state = 'idle';
    }

    function renderCurrentTrackBox() {
      const el = document.getElementById('track-current-box');
      if (!currentTrack || currentTrack.id == null) { el.innerHTML = ''; return; }
      el.innerHTML = `<div class="track-current-box">
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem">
          <div style="flex:1;font-weight:700;font-size:.85rem">🏁 ${esc(currentTrack.name)}</div>
          <button class="btn-sm alt" onclick="backToBrowse()">← Liste</button>
        </div>
        <div id="track-current-lb"><div class="lb-empty">Lade…</div></div>
      </div>`;
    }

    async function loadTrackLeaderboard(id) {
      const el = document.getElementById('track-current-lb');
      if (!el) return;
      try {
        const rows = await fetch(`/api/tracks/${id}/leaderboard`).then(r => r.ok ? r.json() : []);
        if (!rows.length) { el.innerHTML = '<div class="lb-empty">Noch keine Läufe</div>'; return; }
        el.innerHTML = rows.map((r, i) => {
          const av = avatarUrl(r.discord_id, r.avatar);
          const medal = i < 3 ? MEDAL[i] : `${i+1}.`;
          const result = r.finish_ms != null ? (r.finish_ms/1000).toFixed(1) + 's' : `${(r.crash_progress_ms/1000).toFixed(1)}s (Crash)`;
          return `<div class="lb-row">
            <span class="lb-rank ${i < 3 ? MEDAL_CLASS[i] : ''}">${medal}</span>
            ${av ? `<img class="lb-avatar" src="${av}" onerror="this.style.display='none'">` : '<div class="lb-avatar"></div>'}
            <span class="lb-name">${esc(r.username)}</span>
            <span class="lb-score">${result}</span>
          </div>`;
        }).join('');
      } catch { el.innerHTML = '<div class="lb-empty">Fehler beim Laden</div>'; }
    }

    function ghostLaneAt(t) {
      const rec = currentTrack.ghost.recording;
      let lane = rec[0]?.lane ?? 1;
      for (const r of rec) { if (r.t <= t) lane = r.lane; else break; }
      return lane;
    }

    async function finishTrackRun(success) {
      const finishMs = success ? currentTrack.durationMs : null;
      const crashProgressMs = success ? null : Math.round(trackElapsed);
      if (!testMode && currentTrack.id != null) {
        await submitTrackRun(finishMs, crashProgressMs);
        loadTrackLeaderboard(currentTrack.id);
        loadTrackList();
      }
    }

    async function submitTrackRun(finishMs, crashProgressMs) {
      if (!currentTrack.token) return;
      try {
        await fetch(`/api/tracks/${currentTrack.id}/run`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: currentTrack.token, ts: currentTrack.ts, finishMs, crashProgressMs, recording }),
        });
      } catch {}
    }

    // ── Strecken-Editor ──────────────────────────────────────────
    let editorPattern = [];
    let editorDuration = 40000;
    let editorGridBuilt = false;

    function onEditorDurationChange() {
      editorDuration = parseInt(document.getElementById('editor-duration').value, 10);
      editorPattern = editorPattern.filter(p => p.t < editorDuration);
      buildEditorGrid();
    }

    function buildEditorGrid() {
      const slots = Math.round(editorDuration / 500);
      let html = '';
      for (let lane = 0; lane < 3; lane++) {
        html += `<div class="editor-lane">`;
        for (let s = 0; s < slots; s++) {
          const active = editorPattern.some(p => p.lane === lane && Math.round(p.t / 500) === s);
          html += `<div class="editor-cell${active ? ' active' : ''}" data-lane="${lane}" data-slot="${s}"></div>`;
        }
        html += `</div>`;
      }
      const grid = document.getElementById('editor-grid');
      grid.innerHTML = html;
      grid.querySelectorAll('.editor-cell').forEach(cell => {
        cell.addEventListener('click', () => toggleCell(+cell.dataset.lane, +cell.dataset.slot));
      });
    }

    function toggleCell(lane, slot) {
      const t = slot * 500;
      const idx = editorPattern.findIndex(p => p.lane === lane && p.t === t);
      if (idx >= 0) editorPattern.splice(idx, 1);
      else editorPattern.push({ lane, t });
      buildEditorGrid();
    }

    function playTestRun(pattern, durationMs) {
      currentTrack = { id: null, name: 'Test-Strecke', durationMs, pattern: pattern.slice().sort((a,b)=>a.t-b.t), ghost: null, token: null, ts: null };
      testMode = true;
      tryStart();
    }

    function testEditorTrack() {
      if (!editorPattern.length) { alert('Platziere zuerst ein paar Gegner-Autos.'); return; }
      playTestRun(editorPattern, editorDuration);
    }

    async function publishEditorTrack() {
      const name = document.getElementById('editor-name').value.trim();
      if (!name) { alert('Bitte einen Streckennamen eingeben.'); return; }
      if (!editorPattern.length) { alert('Platziere zuerst ein paar Gegner-Autos.'); return; }
      try {
        const r = await fetch('/api/tracks', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, durationMs: editorDuration, pattern: editorPattern }),
        });
        const d = await r.json();
        if (!r.ok) { alert(d.error || 'Fehler beim Veröffentlichen'); return; }
        editorPattern = [];
        document.getElementById('editor-name').value = '';
        buildEditorGrid();
        switchTrackSub('browse');
        loadTrackList();
      } catch { alert('Netzwerkfehler'); }
    }

    (async () => {
      const me = await fetch('/auth/me').then(r => r.ok ? r.json() : null).catch(() => null);
      if (me && me.id) currentUserId = me.id;
      await GameAuth.init('race');
      refreshLeaderboard();
    })();
  </script>
  <script src="/game-auth.js"></script>
</body>
</html>
